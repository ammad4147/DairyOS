# A generic, single database configuration.

[alembic]
script_location = db_migrations
prepend_sys_path = .
path_separator = os

# Runtime configuration is authoritative. db_migrations/env.py resolves
# DAIRYOS_DATABASE_URL / DAIRYOS_DB_* from the environment and overwrites
# this value before creating a database connection. Keep this setting empty
# so no database credential is ever stored in repository configuration.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
