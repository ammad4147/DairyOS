[build-system]
requires = ["setuptools>=75","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dairyos"
version = "0.1.0"
description = "Enterprise Dairy Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name="Trident Dairies"}]
dependencies = [
  "fastapi>=0.141.1",
  "starlette>=1.0.1",
  "sqlalchemy>=2.0",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "python-dotenv>=1.1",
  "uvicorn>=0.35",
  "PyYAML>=6.0",
  "cryptography>=45.0"
]

[project.optional-dependencies]
desktop = ["pywebview>=6.2.1"]

[project.scripts]
dairyos-server = "dairyos.server:main"
dairyos-lifecycle = "dairyos.lifecycle.cli:main"
dairyos-desktop = "dairyos.windows.supervisor:main"
dairyos-admin = "dairyos.admin.app:main"
dairyos-admin-cli = "dairyos.admin.cli:main"

[tool.black]
line-length=88

[tool.ruff]
line-length=88

[tool.pytest.ini_options]
testpaths=["tests"]
