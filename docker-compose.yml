services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dairyos}
      POSTGRES_USER: ${POSTGRES_USER:-dairyos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - dairyos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dairyos} -d ${POSTGRES_DB:-dairyos}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DAIRYOS_ENV: production
      DAIRYOS_DATA_DIR: /var/lib/dairyos
      DAIRYOS_DB_HOST: db
      DAIRYOS_DB_PORT: 5432
      DAIRYOS_DB_NAME: ${POSTGRES_DB:-dairyos}
      DAIRYOS_DB_USER: ${POSTGRES_USER:-dairyos}
      DAIRYOS_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DAIRYOS_AUTH_SECRET: ${DAIRYOS_AUTH_SECRET:?set DAIRYOS_AUTH_SECRET in .env}
      # Keep this key stable across restarts and independent of auth-secret rotation.
      DAIRYOS_EMAIL_SECRET: ${DAIRYOS_EMAIL_SECRET:?set DAIRYOS_EMAIL_SECRET in .env}
      # Comma-separated exact browser origins; same-origin deployments need none.
      DAIRYOS_ALLOWED_ORIGINS: ${DAIRYOS_ALLOWED_ORIGINS:-}
      # Set to the exact POSTGRES_DB name only for an explicitly authorized empty-database bootstrap.
      DAIRYOS_HOSTED_BOOTSTRAP_DATABASE: ${DAIRYOS_HOSTED_BOOTSTRAP_DATABASE:-}
    ports:
      # Loopback-only until an authenticated HTTPS reverse-proxy/LAN setup is approved.
      - "127.0.0.1:${DAIRYOS_WEB_PORT:-8000}:8000"
    volumes:
      - dairyos_farm_data:/var/lib/dairyos

volumes:
  dairyos_postgres_data:
  dairyos_farm_data:
