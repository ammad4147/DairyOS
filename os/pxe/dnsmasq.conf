# DairyOS edge PXE reference configuration.
# Bind this to the isolated farm LAN only.
port=0
dhcp-authoritative
dhcp-range=192.168.50.100,192.168.50.200,255.255.255.0,12h
dhcp-option=option:router,192.168.50.1
interface=eth0
bind-interfaces

# TFTP root containing Debian installer netboot artifacts and DairyOS PXE menu.
enable-tftp
tftp-root=/srv/dairyos-pxe

dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-boot=tag:efi64,grubx64.efi
dhcp-boot=pxelinux.0

# No WAN dependency is expressed here. Host all required Debian installer
# netboot files on the local TFTP server and serve application artifacts from
# the local farm HTTP mirror.
