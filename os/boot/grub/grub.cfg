set default=0
set timeout=5

insmod part_gpt
insmod ext2

search --no-floppy --fs-uuid --set=dairyos-root DAIRYOS-ROOT

menuentry 'DairyOS' --id dairyos {
    linux /boot/vmlinuz root=UUID=DAIRYOS-ROOT ro quiet splash
    initrd /boot/initrd.img
}

menuentry 'DairyOS Recovery' --id dairyos-recovery {
    linux /boot/vmlinuz root=UUID=DAIRYOS-ROOT ro systemd.unit=rescue.target
    initrd /boot/initrd.img
}