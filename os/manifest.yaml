schema_version: 1
product: DairyOS Appliance OS
target:
  distribution: debian
  release: trixie
  point_release: "13.6"
  architecture: amd64
  boot_modes:
    - uefi
    - legacy-bios
storage:
  partition_table: gpt
  minimum_disk_gib: 32
  partitions:
    - name: efi
      type: efi-system
      size_mib: 512
      filesystem: fat32
      mount: /boot/efi
    - name: bios-boot
      type: bios-boot
      size_mib: 2
      filesystem: null
      mount: null
    - name: root
      type: linux-root
      size_mib: 16384
      filesystem: ext4
      mount: /
    - name: log
      type: linux-data
      size_mib: 4096
      filesystem: ext4
      mount: /var/log
    - name: swap
      type: linux-swap
      size_mib: 4096
      filesystem: swap
      mount: null
    - name: dairyos-data
      type: linux-data
      size_mib: 0
      filesystem: ext4
      mount: /var/lib/dairyos
security:
  installer_default_mode: dry-run
  purge_confirmation: "PURGE DAIRYOS DATA"
  require_target_device: true
  require_apply_switch: true
network:
  deployment_modes:
    - usb
    - local-storage
    - pxe
    - ipxe
  wan_required_for_first_boot: false
  offline_mirror:
    protocol: http
    host: 192.168.50.1
    path: /debian
    security_path: /debian-security
application:
  data_dir: /var/lib/dairyos
  service: dairyos.service
  firstboot_service: dairyos-firstboot.service
acceptance:
  artifact_hash: sha256
  artifact_signature: detached-asc-or-gpg
  minimum_evidence:
    - build
    - boot-uefi
    - boot-bios
    - install-vm
    - install-physical
    - offline-install
    - pxe-install
    - power-loss-recovery
    - keep-data-uninstall
    - purge-uninstall
