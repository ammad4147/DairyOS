name: Temporary DairyOS Milk Remediation

on:
  push:
    paths:
      - .dairyos-remediation-trigger

permissions:
  contents: write

jobs:
  remediate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source remediations
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          def replace(path, old, new):
              p = root / path
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found: {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1. Per-animal milk sequencing: a production session recorded for
          # one animal must never settle that same session for every animal.
          service = 'src/dairyos/milk/services/milk_session_sequence_service.py'
          replace(service,
              '''    def as_operator_guidance(self) -> dict:\n        if self.reason == "UNSCHEDULED_SESSION":\n''',
              '''    def as_operator_guidance(self) -> dict:\n        if self.reason == "SESSION_ALREADY_SETTLED":\n            return {\n                "error": "MILKING_SESSION_ALREADY_RECORDED",\n                "message": (\n                    f"{self.attempted_session} has already been recorded for "\n                    f"{_isoformat(self.operational_date)} for this animal."\n                ),\n                "operational_date": _isoformat(self.operational_date),\n                "attempted_session": self.attempted_session,\n                "outstanding_sessions": [],\n                "next_session": None,\n                "resolutions": [\n                    {\n                        "action": "VOID_EXISTING_ENTRY",\n                        "description": (\n                            "Void the incorrect production entry before "\n                            "recording a replacement."\n                        ),\n                        "endpoint": "POST /farm/milk/production/{id}/void",\n                    }\n                ],\n            }\n\n        if self.reason == "UNSCHEDULED_SESSION":\n''')
          replace(service,
              '''        # A whole-farm session declaration settles the same occurrence\n        # for every animal. This is essential for both shared MORNING\n        # settlement and NOT_MILKED unblocking.\n        settled.update(\n            self.ledger.settled_sessions_on(\n                operational_date\n            )\n        )\n\n        return settled\n''',
              '''        # Ordinary production belongs to the individual animal. The\n        # herd-level ledger is only authoritative when the farm explicitly\n        # declared that the whole session was NOT_MILKED. A normal production\n        # settlement for animal A must never make that session appear settled\n        # for animal B.\n        for record in self.ledger.get_by_date(operational_date):\n            if str(getattr(record, "status", "") or "").upper() == "NOT_MILKED":\n                settled.add(str(record.milking_session))\n\n        return settled\n''')
          replace(service,
              '''        outstanding = self.outstanding_before(\n            operational_date,\n            milking_session,\n            animal=animal,\n        )\n\n        if outstanding:\n''',
              '''        settled = self._animal_settled_sessions(\n            operational_date,\n            animal,\n        )\n\n        if milking_session in settled:\n            raise SequenceViolation(\n                operational_date=operational_date,\n                attempted_session=milking_session,\n                outstanding=[],\n                reason="SESSION_ALREADY_SETTLED",\n            )\n\n        outstanding = self.outstanding_before(\n            operational_date,\n            milking_session,\n            animal=animal,\n        )\n\n        if outstanding:\n''')

          # 2. A voided daily ledger row becomes recordable again on replacement.
          repo = 'src/dairyos/data/repositories/milk_production_repository.py'
          replace(repo,
              '''        for field in (\n            "morning_yield",\n            "afternoon_yield",\n            "evening_yield",\n        ):\n''',
              '''        if str(getattr(existing, "status", "") or "").upper() == "VOID":\n            existing.status = "RECORDED"\n\n        for field in (\n            "morning_yield",\n            "afternoon_yield",\n            "evening_yield",\n        ):\n''')

          # 3. Calves must carry an actual maternal link to an existing female.
          reg = 'src/dairyos/api/animal_registration.py'
          replace(reg,
              '''    repository = container.animal_repository\n\n    animal_id = _new_animal_id(\n''',
              '''    repository = container.animal_repository\n\n    selected_category = str(\n        payload.get("animal_category") or payload.get("category") or ""\n    ).strip().lower()\n    is_calf = selected_category in {"female calf", "male calf"}\n\n    if is_calf:\n        dam_id = str(payload.get("dam_id") or "").strip()\n        if not dam_id:\n            raise HTTPException(\n                status_code=422,\n                detail="Mother / Dam ID is required when registering a calf.",\n            )\n\n        dam = repository.get_by_animal_id(dam_id)\n        if dam is None:\n            raise HTTPException(\n                status_code=422,\n                detail=f"Mother / Dam ID '{dam_id}' does not exist in the Animal Register.",\n            )\n\n        if str(getattr(dam, "sex", "") or "").upper() != "FEMALE":\n            raise HTTPException(\n                status_code=422,\n                detail=f"Mother / Dam ID '{dam_id}' is not a female animal.",\n            )\n\n    animal_id = _new_animal_id(\n''')

          # 4. Animal Passport UI: make the maternal relationship explicit.
          passport = 'src/DairyOS.Web/src/components/AnimalPassportModal.tsx'
          replace(passport,
              '<Field label="Dam ID"><input value={form.dam} onChange={e=>setForm({...form,dam:e.target.value})} style={input}/></Field>',
              '<Field label={form.category===\'Female Calf\'||form.category===\'Male Calf\'?\'Mother / Dam ID\':\'Dam ID\'}><input value={form.dam} required={form.category===\'Female Calf\'||form.category===\'Male Calf\'} placeholder={form.category===\'Female Calf\'||form.category===\'Male Calf\'?\'Required: Mother animal ID\':undefined} onChange={e=>setForm({...form,dam:e.target.value})} style={input}/></Field>')

          # 5. Daily Milk Register: keep the existing register structure but
          # replace session-as-identity with animal + type and show each
          # entered session followed by the daily aggregate.
          milk = 'src/DairyOS.Web/src/components/MilkTab.tsx'
          replace(milk, '<th>\n                        Type / Animal\n                      </th>', '<th>\n                        Animal / Type\n                      </th>')
          replace(milk, """label:\n                            `${row.animal_id} · ${row.milking_session || 'SYSTEM'}`,\n                          qty:\n                            row.total_yield,\n                          row,""",
              """label:\n                            `${row.animal_id} · ${herdMasterList.find((animal) => animal.id === row.animal_id)?.category || 'Milking Cow'}`,\n                          detail:\n                            [\n                              row.morning_yield != null ? `Morning ${litre(row.morning_yield)}` : null,\n                              row.afternoon_yield != null ? `Afternoon ${litre(row.afternoon_yield)}` : null,\n                              row.evening_yield != null ? `Evening ${litre(row.evening_yield)}` : null,\n                            ].filter(Boolean).join(' + '),\n                          qty:\n                            row.total_yield,\n                          row,""")
          replace(milk, """label:\n                            row.disposition_type,\n                          qty:\n                            row.quantity_litres,\n                          row,""",
              """label:\n                            row.disposition_type,\n                          detail:\n                            '',\n                          qty:\n                            row.quantity_litres,\n                          row,""")
          replace(milk,
              '''                              {litre(\n                                entry.qty,\n                              )}\n''',
              '''                              {entry.kind === 'PRODUCTION' ? (\n                                <div style={{display:'grid',gap:2}}>\n                                  <div style={{fontSize:9,color:'#cbd5e1'}}>{entry.detail || 'No individual session figures'}</div>\n                                  <strong style={{color:'#38bdf8'}}>{`Total ${litre(entry.qty)}`}</strong>\n                                </div>\n                              ) : (\n                                litre(entry.qty)\n                              )}\n''')

          # 6. COML must never fabricate a value when no official monthly\n          # calculation exists. The dashboard already treats missing COML as 0;
          # the COML screen now makes the absence explicit too.
          coml = 'src/DairyOS.Web/src/components/COML.tsx'
          replace(coml,
              "{official.record&&<div style={{marginTop:7,fontSize:11}}>Feed/L: <strong>{money(Number(official.record.feed_cost_per_liter))}</strong>  |  OPEX/L: <strong>{money(Number(official.record.opex_cost_per_liter))}</strong>  |  COML/L: <strong>{money(Number(official.record.total_coml_per_liter))}</strong></div>}",
              "{official.record&&<div style={{marginTop:7,fontSize:11}}>Feed/L: <strong>{money(Number(official.record.feed_cost_per_liter))}</strong>  |  OPEX/L: <strong>{money(Number(official.record.opex_cost_per_liter))}</strong>  |  COML/L: <strong>{money(Number(official.record.total_coml_per_liter))}</strong></div>}{!official.record&&<div style={{marginTop:7,fontSize:10,color:'#fbbf24'}}>No official COML is recorded for this month. DairyOS will not assume or fabricate a PKR/L cost.</div>}")

          # 7. Add focused regression tests without changing the existing test suite.
          test_path = root / 'tests' / 'milk' / 'test_practical_milk_remediation.py'
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text('''from datetime import date\n\nfrom dairyos.milk.services.milk_session_sequence_service import (\n    MilkSessionSequenceService,\n    SequenceViolation,\n)\n\n\nclass Record:\n    def __init__(self, session, status):\n        self.milking_session = session\n        self.status = status\n\n\nclass Ledger:\n    def __init__(self):\n        self.by_date = []\n\n    def get_by_date(self, _day):\n        return list(self.by_date)\n\n    def settled_sessions_on(self, _day):\n        return {r.milking_session for r in self.by_date if r.status == 'RECORDED'}\n\n    def has_any(self):\n        return True\n\n    def has_session_ever(self, _session):\n        return True\n\n    def earliest_date(self):\n        return date(2026, 1, 1)\n\n\nclass Schedule: \n    def get_expected_sessions(self, _animal, _day):\n        return ['MORNING', 'EVENING']\n\n\nclass Animal:\n    animal_id = 'TD-002'\n\n\nclass MilkRepo:\n    def __init__(self, row=None):\n        self.row = row\n\n    def ledger_row_for_animal_day(self, _animal_id, _day):\n        return self.row\n\n\ndef test_other_animal_production_does_not_settle_session():\n    ledger = Ledger()\n    ledger.by_date.append(Record('EVENING', 'RECORDED'))\n    service = MilkSessionSequenceService(ledger, schedule_service=Schedule(), milk_repository=MilkRepo())\n    settled = service.settled_sessions_on(date(2026, 8, 31), animal=Animal())\n    assert settled == []\n\n\ndef test_same_animal_cannot_record_same_session_twice():\n    ledger = Ledger()\n    service = MilkSessionSequenceService(ledger, schedule_service=Schedule(), milk_repository=MilkRepo(RecordDay()))\n\n''', encoding='utf-8')

          # Replace the intentionally compact test scaffold with executable tests.
          test_path.write_text(test_path.read_text(encoding='utf-8').replace("service = MilkSessionSequenceService(ledger, schedule_service=Schedule(), milk_repository=MilkRepo(RecordDay()))\n\n", "ledger = Ledger()\n    repo = MilkRepo(type('Row', (), {'status':'RECORDED','morning_yield':10,'afternoon_yield':None,'evening_yield':None})())\n    service = MilkSessionSequenceService(ledger, schedule_service=Schedule(), milk_repository=repo)\n    try:\n        service.assert_can_record(date(2026, 8, 31), 'MORNING', animal=Animal())\n    except SequenceViolation as exc:\n        assert exc.reason == 'SESSION_ALREADY_SETTLED'\n    else:\n        raise AssertionError('duplicate session was accepted')\n"), encoding='utf-8')

          # Remove the temporary workflow and trigger after successful edits.
          workflow = root / '.github/workflows/temporary-milk-remediation.yml'
          trigger = root / '.dairyos-remediation-trigger'
          trigger.unlink(missing_ok=True)
          workflow.unlink(missing_ok=True)

      - name: Validate changed sources
        run: |
          python -m compileall -q src/dairyos
          cd src/DairyOS.Web
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Remediate practical milk register and calf lineage rules"
          git push origin main
