name: DairyOS Admin Windows

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  admin-windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        shell: pwsh
        run: python -m pip install --upgrade pip && pip install -e ".[test]"

      - name: Build standalone Admin Tool
        shell: pwsh
        run: ./scripts/Build-DairyOS-Admin.ps1

      - name: Verify Windows credential and migration isolation contracts
        shell: pwsh
        run: |
          python -m pytest --confcutdir=tests/windows tests/windows/test_system_postgres_admin.py tests/windows/test_migration_gate.py tests/windows/test_supervisor_startup.py tests/windows/test_admin_auth.py tests/windows/test_admin_complete_contract.py -q

      - name: Verify frozen executable exists
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\DairyOS-Admin\DairyOS-Admin.exe"
          if (-not (Test-Path $exe)) {
            throw "DairyOS-Admin.exe was not produced: $exe"
          }
          Get-Item $exe | Format-List FullName,Length

      - name: Verify Admin CLI entry point
        shell: pwsh
        run: |
          $result = python -m dairyos.admin.cli --help 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Admin CLI help failed: $result" }
          $result | Out-Host

      - name: Verify frozen Admin Tool starts and exits cleanly
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\DairyOS-Admin\DairyOS-Admin.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--help" -NoNewWindow -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            throw "Frozen DairyOS Admin Tool --help exited with code $($proc.ExitCode)"
          }

      - name: Verify frozen Admin Tool serves the Administration page
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\DairyOS-Admin\DairyOS-Admin.exe"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "dairyos-admin-runtime"
          $stdout = Join-Path $env:RUNNER_TEMP "dairyos-admin.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "dairyos-admin.stderr.log"
          New-Item -ItemType Directory -Force -Path $runtimeRoot | Out-Null
          $env:DAIRYOS_DATA_DIR = $runtimeRoot

          $proc = Start-Process -FilePath $exe -ArgumentList "--no-browser","--host","127.0.0.1","--port","18082" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru

          try {
            $response = $null
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if ($proc.HasExited) {
                $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
                $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
                throw "Frozen DairyOS Admin exited before serving HTTP. Exit=$($proc.ExitCode) STDOUT=$out STDERR=$err"
              }

              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:18082/" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { break }
              }
              catch {
                Start-Sleep -Milliseconds 250
              }
            }

            if ($null -eq $response -or $response.StatusCode -ne 200) {
              throw "Frozen DairyOS Admin did not return HTTP 200 from the loopback endpoint."
            }

            if ($response.Content -notmatch "DairyOS Administration") {
              throw "Frozen DairyOS Admin returned HTTP 200 but not the Administration page."
            }

            Write-Host "Frozen DairyOS Admin HTTP runtime: PASS"
          }
          finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
              $proc.WaitForExit()
            }
          }

      - name: Publish Admin Tool artifact
        uses: actions/upload-artifact@v4
        with:
          name: DairyOS-Admin-Windows
          path: dist/DairyOS-Admin/
          if-no-files-found: error
