name: DairyOS Admin Windows

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  admin-windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        shell: pwsh
        run: python -m pip install --upgrade pip && pip install -e ".[test]"

      - name: Build standalone Admin Tool
        shell: pwsh
        run: ./scripts/Build-DairyOS-Admin.ps1

      - name: Verify Windows credential and migration isolation contracts
        shell: pwsh
        run: |
          python -m pytest --confcutdir=tests/windows tests/windows/test_system_postgres_admin.py tests/windows/test_migration_gate.py tests/windows/test_supervisor_startup.py -q

      - name: Verify frozen executable exists
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\DairyOS-Admin\DairyOS-Admin.exe"
          if (-not (Test-Path $exe)) {
            throw "DairyOS-Admin.exe was not produced: $exe"
          }
          Get-Item $exe | Format-List FullName,Length

      - name: Verify Admin CLI entry point
        shell: pwsh
        run: |
          $result = python -m dairyos.admin.cli --help 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Admin CLI help failed: $result" }
          $result | Out-Host

      - name: Verify frozen Admin Tool starts and exits cleanly
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\DairyOS-Admin\DairyOS-Admin.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--help" -NoNewWindow -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            throw "Frozen DairyOS Admin Tool --help exited with code $($proc.ExitCode)"
          }

      - name: Publish Admin Tool artifact
        uses: actions/upload-artifact@v4
        with:
          name: DairyOS-Admin-Windows
          path: dist/DairyOS-Admin/
          if-no-files-found: error
