name: One-shot withdrawal CI regression repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-withdrawal-ci-regressions-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dairyos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dairyos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DAIRYOS_DB_HOST: localhost
      DAIRYOS_DB_PORT: 5432
      DAIRYOS_DB_USER: postgres
      DAIRYOS_DB_PASSWORD: postgres
      DAIRYOS_DB_NAME: dairyos_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e . pytest httpx PyYAML

      - name: Apply exact CI regression repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match in {path}, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'src/DairyOS.Web/src/components/MilkTab.tsx'
          replace_once(
              path,
              'entry.row as DispositionRow,',
              'entry.row as unknown as DispositionRow,',
              'TypeScript disposition cast',
          )

          path = 'src/dairyos/farm/production/services/milk_inventory_capacity_service.py'
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          start = text.index('def overall_saleable_capacity(')
          replacement = '''def overall_saleable_capacity(\n    through_date: date,\n    *,\n    exclude_disposition_id: int | None = None,\n    factory=None,\n) -> dict[str, float]:\n    \"\"\"Return the governed carried milk balance through ``through_date``.\n\n    New withdrawal milk remains RECORDED biological production and is removed\n    from the saleable pool by its automatic WASTAGE disposition. Historical\n    production rows already marked WITHDRAWAL remain biological production but\n    are excluded from saleable production for backward compatibility.\n    \"\"\"\n\n    working_factory = factory or RepositoryFactory.create()\n    owns_factory = factory is None\n\n    try:\n        production_rows = working_factory.milk().get_all() or []\n        disposition_rows = working_factory.milk_dispositions().get_all() or []\n\n        saleable_by_date: dict[date, float] = defaultdict(float)\n        biological = 0.0\n        withdrawal = 0.0\n\n        for row in production_rows:\n            row_date = _as_date(getattr(row, \"production_date\", None))\n            if row_date is None or row_date > through_date:\n                continue\n\n            status = str(\n                getattr(row, \"status\", \"RECORDED\") or \"RECORDED\"\n            ).upper()\n            if status in INACTIVE_STATUSES or status == \"NOT_MILKED\":\n                continue\n\n            litres = max(_production_litres(row), 0.0)\n            biological += litres\n            if status == \"WITHDRAWAL\":\n                withdrawal += litres\n            else:\n                saleable_by_date[row_date] += litres\n\n        ordinary_disposition_by_date: dict[date, float] = defaultdict(float)\n        withdrawal_accounted = 0.0\n\n        for row in disposition_rows:\n            row_date = _as_date(getattr(row, \"production_date\", None))\n            if row_date is None or row_date > through_date:\n                continue\n            if (\n                exclude_disposition_id is not None\n                and getattr(row, \"id\", None) == exclude_disposition_id\n            ):\n                continue\n\n            status = str(\n                getattr(row, \"status\", \"RECORDED\") or \"RECORDED\"\n            ).upper()\n            if status in INACTIVE_STATUSES:\n                continue\n\n            litres = max(\n                float(getattr(row, \"quantity_litres\", 0.0) or 0.0),\n                0.0,\n            )\n            kind = str(\n                getattr(row, \"disposition_type\", \"\") or \"\"\n            ).upper()\n            if kind == \"WITHDRAWAL\":\n                withdrawal_accounted += litres\n            else:\n                ordinary_disposition_by_date[row_date] += litres\n\n        available = 0.0\n        ordinary_accounted = 0.0\n        unbacked_dispositions = 0.0\n\n        dates = sorted(set(saleable_by_date) | set(ordinary_disposition_by_date))\n        for operational_date in dates:\n            available += saleable_by_date.get(operational_date, 0.0)\n            requested = ordinary_disposition_by_date.get(operational_date, 0.0)\n            applied = min(requested, available)\n            ordinary_accounted += applied\n            unbacked_dispositions += max(requested - applied, 0.0)\n            available -= applied\n\n        saleable_production = max(biological - withdrawal, 0.0)\n        legacy_implicit_wastage = max(\n            withdrawal - withdrawal_accounted,\n            0.0,\n        )\n\n        return {\n            \"biological_production_litres\": round(biological, 3),\n            \"recorded_production_litres\": round(biological, 3),\n            \"withdrawal_litres\": round(withdrawal, 3),\n            \"saleable_production_litres\": round(saleable_production, 3),\n            \"ordinary_accounted_litres\": round(ordinary_accounted, 3),\n            \"withdrawal_accounted_litres\": round(withdrawal_accounted, 3),\n            \"legacy_implicit_wastage_litres\": round(legacy_implicit_wastage, 3),\n            \"unbacked_disposition_litres\": round(unbacked_dispositions, 3),\n            \"available_saleable_litres\": round(max(available, 0.0), 3),\n        }\n    finally:\n        if owns_factory:\n            working_factory.close()\n'''
          p.write_text(text[:start] + replacement, encoding='utf-8')

          path = 'tests/remediation/test_milk_core_closure_contract.py'
          replace_once(
              path,
              "assert 'ID &amp; Type' in s;",
              "assert 'Animal ID' in s; assert 'ID &amp; Type' not in s;",
              'M-13 register contract',
          )
          PY

      - name: Verify targeted backend and contract tests
        run: |
          python -m pytest -q \
            tests/farm/test_milk_inventory_capacity_service.py \
            tests/remediation/test_milk_core_closure_contract.py \
            tests/milk/test_withdrawal_milk_wastage_service.py \
            tests/milk/test_milk_entry.py

      - name: Frontend typecheck and build
        working-directory: src/DairyOS.Web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Repository check and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-withdrawal-ci-regressions-once.yml
          git add \
            src/DairyOS.Web/src/components/MilkTab.tsx \
            src/dairyos/farm/production/services/milk_inventory_capacity_service.py \
            tests/remediation/test_milk_core_closure_contract.py \
            .github/workflows/fix-withdrawal-ci-regressions-once.yml
          git commit -m "fix: close withdrawal milk CI regressions"
          git push origin main
