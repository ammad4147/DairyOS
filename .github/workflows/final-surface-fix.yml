name: DairyOS Final Surface Remediation

on:
  push:
    paths:
      - .dairyos-final-surface-remediation-trigger

permissions:
  contents: write

jobs:
  remediate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx2

      - name: Apply final surface corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_text, old, new, label):
              if old not in path_text:
                  raise SystemExit(f'Expected source fragment not found: {label}')
              return path_text.replace(old, new, 1)

          root = Path('.')

          path = root / 'src/dairyos/milk/services/milk_session_sequence_service.py'
          text = path.read_text(encoding='utf-8-sig')
          old = '''    def _animal_settled_sessions(\n        self,\n        operational_date,\n        animal=None,\n    ) -> set[str]:\n        """Return settled farm sessions plus the animal's persisted production.\n\n        The farm session ledger settles a real milking occurrence once it has\n        been recorded or explicitly declared NOT_MILKED. That occurrence is\n        shared across the herd, while duplicate-entry protection remains\n        animal-specific through ``_animal_recorded_sessions``.\n        """\n        operational_date = _as_date(operational_date)\n\n        settled = set(\n            self.ledger.settled_sessions_on(\n                operational_date\n            )\n        )\n\n        settled.update(\n            self._animal_recorded_sessions(\n                operational_date,\n                animal,\n            )\n        )\n\n        return settled\n'''
          new = '''    def _animal_settled_sessions(\n        self,\n        operational_date,\n        animal=None,\n    ) -> set[str]:\n        """Return sessions settled for this animal/day only.\n\n        Ordinary production is animal-specific. A whole-farm NOT_MILKED\n        declaration is the one farm-level settlement that legitimately\n        applies to every animal. Farm RECORDED rows remain ordering evidence,\n        but are not reported here as another animal's settlement.\n        """\n        operational_date = _as_date(operational_date)\n\n        settled = self._animal_recorded_sessions(\n            operational_date,\n            animal,\n        )\n\n        for record in self.ledger.get_by_date(operational_date):\n            if str(getattr(record, "status", "") or "").upper() == "NOT_MILKED":\n                settled.add(str(record.milking_session))\n\n        return settled\n'''
          text = replace_once(text, old, new, 'animal settled sessions')
          old = '''        settled = self._animal_settled_sessions(\n            operational_date,\n            animal,\n        )\n\n        if self.schedule_service is not None and animal is not None:\n'''
          new = '''        settled = self._animal_settled_sessions(\n            operational_date,\n            animal,\n        )\n\n        ordering_settled = set(settled)\n        if animal is not None:\n            ordering_settled.update(\n                self.ledger.settled_sessions_on(operational_date)\n            )\n\n        if self.schedule_service is not None and animal is not None:\n'''
          text = replace_once(text, old, new, 'ordering settlement setup')
          old = '''                return [\n                    session\n                    for session in expected[:position]\n                    if session not in settled\n                ]\n'''
          new = '''                return [\n                    session\n                    for session in expected[:position]\n                    if session not in ordering_settled\n                ]\n'''
          text = replace_once(text, old, new, 'animal ordering check')
          old = '''            if SESSION_ORDER.index(session) < position\n            and session not in settled\n'''
          new = '''            if SESSION_ORDER.index(session) < position\n            and session not in ordering_settled\n'''
          text = replace_once(text, old, new, 'fallback ordering check')
          anchor = '''    def next_outstanding_session(\n        self,\n        operational_date,\n    ) -> str | None:\n'''
          insertion = '''    def next_session_for_animal(\n        self,\n        operational_date,\n        animal,\n    ) -> str | None:\n        """Return the next expected session for an animal."""\n        operational_date = _as_date(operational_date)\n        if self.schedule_service is None or animal is None:\n            return self.next_outstanding_session(operational_date)\n        expected = tuple(self.schedule_service.get_expected_sessions(animal, operational_date))\n        if not expected:\n            return None\n        animal_settled = self._animal_settled_sessions(operational_date, animal)\n        farm_settled = set(self.ledger.settled_sessions_on(operational_date))\n        farm_next = self.next_outstanding_session(operational_date)\n        if farm_next is None:\n            return next((session for session in expected if session not in animal_settled), None)\n        farm_position = SESSION_ORDER.index(farm_next)\n        for session in expected:\n            if session in animal_settled or session in farm_settled:\n                continue\n            if SESSION_ORDER.index(session) >= farm_position:\n                return session\n        return next((session for session in expected if session not in animal_settled), None)\n\n'''
          text = replace_once(text, anchor, insertion + anchor, 'animal next-session method')
          path.write_text(text, encoding='utf-8')

          path = root / 'src/dairyos/application/application_runtime.py'
          text = path.read_text(encoding='utf-8-sig')
          old = '''            else MilkProductionIntelligenceService(\n                self._operational_state_service\n            )\n'''
          new = '''            else MilkProductionIntelligenceService(\n                self._operational_state_service,\n                milk_repository=self._milk_repository,\n            )\n'''
          text = replace_once(text, old, new, 'milk intelligence runtime wiring')
          path.write_text(text, encoding='utf-8')

          path = root / 'src/dairyos/farm/operations/services/milk_production_intelligence_service.py'
          text = path.read_text(encoding='utf-8-sig')
          old = '''        total_litres = 0.0\n        shift_production = {\n'''
          new = '''        session = getattr(repository, "session", None)\n        if session is not None:\n            session.rollback()\n            session.expire_all()\n\n        total_litres = 0.0\n        shift_production = {\n'''
          text = replace_once(text, old, new, 'milk intelligence session refresh')
          path.write_text(text, encoding='utf-8')

          path = root / 'src/dairyos/dashboard/services/dashboard_projection_service.py'
          text = path.read_text(encoding='utf-8-sig')
          old = '''        feed_repository = repository_factory.feed()\n        records = feed_repository.get_all() or []\n'''
          new = '''        feed_repository = repository_factory.feed()\n        session = getattr(feed_repository, "session", None)\n        if session is not None:\n            session.rollback()\n            session.expire_all()\n        records = feed_repository.get_all() or []\n'''
          text = replace_once(text, old, new, 'feed dashboard session refresh')
          path.write_text(text, encoding='utf-8')

          path = root / 'src/dairyos/api/farm_data_entry.py'
          text = path.read_text(encoding='utf-8-sig')
          old = '''        settled = set(sequence.settled_sessions_on(target, animal=animal))\n\n        next_session = next(\n            (\n                session\n                for session in expected\n                if session not in settled\n            ),\n            None,\n        )\n'''
          new = '''        settled = set(sequence.settled_sessions_on(target, animal=animal))\n\n        next_session = sequence.next_session_for_animal(\n            target,\n            animal,\n        )\n'''
          text = replace_once(text, old, new, 'animal next-session endpoint')
          path.write_text(text, encoding='utf-8')

          (root / '.dairyos-final-surface-remediation-trigger').unlink(missing_ok=True)
          (root / '.github/workflows/final-surface-fix.yml').unlink(missing_ok=True)

      - name: Validate targeted surfaces
        run: |
          python -m compileall -q src/dairyos
          pytest -q tests/api/test_milk_next_session_animal_authority.py tests/milk/test_practical_milk_remediation.py tests/lifecycle/test_feed_surface_certification.py tests/lifecycle/test_milk_surface_certification.py tests/lifecycle/test_milk_operational_lifecycle.py

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dairyos/milk/services/milk_session_sequence_service.py src/dairyos/application/application_runtime.py src/dairyos/farm/operations/services/milk_production_intelligence_service.py src/dairyos/dashboard/services/dashboard_projection_service.py src/dairyos/api/farm_data_entry.py .github/workflows/final-surface-fix.yml .dairyos-final-surface-remediation-trigger
          git commit -m "Fix remaining Milk and Feed Dashboard surface reconciliation"
          git push origin main
