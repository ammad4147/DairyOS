name: Security checks

on:
  pull_request:
  push:
    branches: ["post-dashboard-reconciliation"]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/DairyOS.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/DairyOS.Web
        run: npm ci

      - name: Audit production frontend dependencies
        working-directory: src/DairyOS.Web
        run: npm audit --omit=dev

  workflow-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate workflow files exist
        run: |
          test -f .github/workflows/python-tests.yml
          test -f .github/workflows/security.yml
          test -f .github/dependabot.yml
          test -f .github/CODEOWNERS
          test -f SECURITY.md

      - name: Reject committed environment and backup artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\.|.*\.(dump|backup|sqlite|sqlite3|db))$'; then
            echo "Tracked environment or database artifact detected."
            exit 1
          fi
