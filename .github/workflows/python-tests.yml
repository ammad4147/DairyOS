name: Python tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test runner
        run: python -m pip install --upgrade pip && pip install -e . pytest httpx2
      - name: Run tests
        run: pytest -q
