name: Forensic source snapshot

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-audit-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and archive audited SHA
        shell: bash
        env:
          AUDIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${AUDIT_SHA}^{commit}"
          actual_tree="$(git show -s --format=%T "${AUDIT_SHA}")"
          git archive --format=zip --output="DairyOS-${AUDIT_SHA}.zip" "${AUDIT_SHA}"
          sha256sum "DairyOS-${AUDIT_SHA}.zip" > "DairyOS-${AUDIT_SHA}.zip.sha256"
          {
            printf '%s\n' "commit=${AUDIT_SHA}" "tree=${actual_tree}"
            printf '%s\n' "workflow=${GITHUB_WORKFLOW}" "run=${GITHUB_RUN_ID}" "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > forensic-source-provenance.txt

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: DairyOS-forensic-source-${{ github.sha }}
          path: |
            DairyOS-${{ github.sha }}.zip
            DairyOS-${{ github.sha }}.zip.sha256
            forensic-source-provenance.txt
          if-no-files-found: error
          retention-days: 7
