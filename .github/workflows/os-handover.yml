name: DairyOS OS handover

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  os-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install YAML test dependency
        run: python -m pip install --upgrade pip PyYAML pytest

      - name: Bash syntax validation
        shell: bash
        run: |
          set -euo pipefail
          find os -type f -name '*.sh' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done

      - name: OS artifact contract tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/platform/test_os_distribution_artifacts.py

      - name: Validate required artifact set
        shell: bash
        run: |
          set -euo pipefail
          required=(
            os/manifest.yaml
            os/partitioning/dairyos.sfdisk
            os/boot/grub/grub.cfg
            os/installer/install.sh
            os/installer/rollback.sh
            os/installer/preseed/dairyos.seed
            os/installer/hooks/firstboot.sh
            os/installer/hooks/validate.sh
            os/build/build-iso.sh
            os/build/release-manifest.sh
            os/pxe/dnsmasq.conf
            os/pxe/grub.cfg
            os/pxe/ipxe/dairyos.ipxe
            os/services/dairyos.service
            os/services/dairyos-firstboot.service
          )
          for path in "${required[@]}"; do
            test -f "$path"
          done

      - name: Static OS contract checks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MODE="dry-run"' os/installer/install.sh
          grep -Fq -- '--apply' os/installer/install.sh
          grep -Fq 'sfdisk "$TARGET_DEVICE"' os/installer/install.sh
          grep -Fq 'grub-install --target=x86_64-efi' os/installer/install.sh
          grep -Fq 'grub-install --target=i386-pc' os/installer/install.sh
          grep -Fq 'enable-tftp' os/pxe/dnsmasq.conf
          grep -Fq 'preseed/url=' os/pxe/grub.cfg
          grep -Fq '#!ipxe' os/pxe/ipxe/dairyos.ipxe
