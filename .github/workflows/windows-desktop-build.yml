name: Windows Desktop build

on:
  push:
    branches:
      - "release-candidate/**"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  windows-desktop-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/DairyOS.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/DairyOS.Web
        run: npm ci

      - name: Build frontend
        working-directory: src/DairyOS.Web
        run: npm run build

      - name: Install Desktop build dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[desktop-build]"

      - name: Build Desktop bundle
        run: pyinstaller --clean --noconfirm .\DairyOS.spec

      - name: Verify Desktop executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\DairyOS\DairyOS.exe"
          if (-not (Test-Path $exe)) {
            throw "Desktop executable was not produced: $exe"
          }
          $hash = Get-FileHash -Algorithm SHA256 $exe
          Write-Host "DairyOS.exe SHA256: $($hash.Hash)"

      - name: Upload Desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: DairyOS-Windows-Desktop-${{ github.sha }}
          path: dist/DairyOS/
          if-no-files-found: error
