name: Windows Desktop build

on:
  push:
    branches:
      - "release-candidate/**"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  windows-desktop-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/DairyOS.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/DairyOS.Web
        run: npm ci

      - name: Build frontend
        working-directory: src/DairyOS.Web
        run: npm run build

      - name: Install Desktop build dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[desktop-build]"

      - name: Build Desktop bundle
        run: pyinstaller --clean --noconfirm .\DairyOS.spec

      - name: Verify Desktop bundle contract
        shell: pwsh
        run: |
          $root = Join-Path $PWD "dist\DairyOS"
          $exe = Join-Path $root "DairyOS.exe"
          $postgres = Join-Path $root "runtime\PostgreSQL\bin\postgres.exe"
          $migrations = Join-Path $root "db_migrations"
          $web = Join-Path $root "src\DairyOS.Web\dist"

          if (-not (Test-Path $exe)) { throw "Desktop executable was not produced: $exe" }
          if (-not (Test-Path $postgres)) { throw "Private PostgreSQL runtime was not packaged: $postgres" }
          if (-not (Test-Path $migrations)) { throw "Database migrations were not packaged: $migrations" }
          if (-not (Test-Path $web)) { throw "Frontend distribution was not packaged: $web" }

          $version = & $postgres --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Bundled PostgreSQL executable did not run: $version" }
          Write-Host "Bundled PostgreSQL: $version"

          $hash = Get-FileHash -Algorithm SHA256 $exe
          Write-Host "DairyOS.exe SHA256: $($hash.Hash)"

          $legacyFiles = Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in @('.py', '.pyc') }
          $legacyImport = $legacyFiles | Select-String -Pattern 'from src\.dairyos\.herd\.dashboard|import src\.dairyos\.herd\.dashboard' -ErrorAction SilentlyContinue
          if ($legacyImport) {
            throw "Legacy dairyos.herd.dashboard import was found in the packaged Desktop bundle."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          if (-not $candidates) {
            choco install innosetup --yes --no-progress
          }
          $iscc = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found after installation." }
          Write-Host "Inno Setup: $iscc"
          & $iscc .\installer\DairyOS.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist\installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer executable was produced." }
          $hash = Get-FileHash -Algorithm SHA256 $installer.FullName
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Installer SHA256: $($hash.Hash)"

      - name: Upload Desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: DairyOS-Windows-Desktop-${{ github.sha }}
          path: dist/DairyOS/
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DairyOS-Windows-Installer-${{ github.sha }}
          path: dist/installer/*.exe
          if-no-files-found: error
