name: One-shot withdrawal milk accounting remediation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remediate-withdrawal-milk-accounting-once.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match in {path}, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # --------------------------------------------------------------
          # Milk write boundary: active treatment withdrawal => real
          # production + automatic WASTAGE for this specific session.
          # --------------------------------------------------------------
          path = 'src/dairyos/api/farm_data_entry.py'
          replace_once(
              path,
              'from dairyos.operations.intelligence.services.withdrawal_service import (\n    WithdrawalPeriod,\n)\n',
              'from dairyos.operations.intelligence.services.withdrawal_service import (\n    WithdrawalPeriod,\n)\nfrom dairyos.farm.production.services.withdrawal_milk_wastage_service import (\n    animal_withdrawn_on_date,\n    ensure_withdrawal_wastage,\n)\n',
              'withdrawal wastage imports',
          )

          old = '''    # Milk production state is governed independently from veterinary treatment state.\n    #\n    # Veterinary treatment remains a health-domain fact. Whether an animal\n    # belongs to the active milk population is governed by the veterinary\n    # NonMilkingDirective, not by treatment withdrawal periods.\n    #\n    # Therefore a valid milk entry is always RECORDED here. Non-milking\n    # directives remove zero-expected animals from the governed population;\n    # MILK_SEPARATELY remains a veterinary/operational instruction for milk\n    # handling outside the normal sale-milk herd.\n    status = "RECORDED"\n    withdrawal_warning = False\n    safety_message = None\n'''
          new = '''    # Treatment withdrawal does not erase biological production. The milk\n    # entry remains RECORDED for the animal's production history, while the\n    # same session quantity is automatically posted to WASTAGE below.\n    withdrawal_svc = getattr(container, "withdrawal_service", None)\n    withdrawal_warning = animal_withdrawn_on_date(\n        withdrawal_svc,\n        str(governed_entry.animal_id),\n        operational_date,\n    )\n    status = "RECORDED"\n    safety_message = (\n        "Withdrawal active — milk is recorded in total production and the "\n        "animal record, and is automatically posted to WASTAGE. It is not "\n        "available for sale."\n        if withdrawal_warning\n        else None\n    )\n'''
          replace_once(path, old, new, 'milk withdrawal classification')

          old = '''    result = _record(\n        container,\n        "milk_production",\n        payload,\n        current_user,\n    )\n\n    if sequenced:\n'''
          new = '''    result = _record(\n        container,\n        "milk_production",\n        payload,\n        current_user,\n    )\n\n    if withdrawal_warning and total is not None and float(total) > 0:\n        wastage = ensure_withdrawal_wastage(\n            repository_factory=container.repository_factory,\n            withdrawal_service=withdrawal_svc,\n            animal_id=str(governed_entry.animal_id),\n            production_date=operational_date,\n            milking_session=governed_entry.milking_session.value,\n            quantity_litres=float(total),\n            recorded_by=_operator(payload, current_user),\n        )\n        result["withdrawal_warning"] = True\n        result["withdrawal_wastage_litres"] = float(total)\n        result["safety_message"] = safety_message\n        if wastage is not None:\n            result["withdrawal_wastage_id"] = getattr(wastage, "id", None)\n\n    if sequenced:\n'''
          replace_once(path, old, new, 'automatic withdrawal wastage write')

          # --------------------------------------------------------------
          # Total production reporting: withdrawal milk is still milk.
          # --------------------------------------------------------------
          path = 'src/dairyos/api/milk_production_summary.py'
          old = '''        if str(getattr(record, "status", "") or "").upper() == "WITHDRAWAL":\n            continue\n\n'''
          replace_once(path, old, '', 'include withdrawal in production summary')

          # --------------------------------------------------------------
          # Daily reconciliation: gross recorded production is the physical
          # pool. Withdrawal is handled by WASTAGE; legacy WITHDRAWAL rows
          # receive an implicit compatibility wastage until old data is repaired.
          # --------------------------------------------------------------
          path = 'src/dairyos/farm/production/services/milk_reconciliation_service.py'
          old = '''            saleable = max(\n                total - withdrawal,\n                0.0,\n            )\n'''
          new = '''            # All physically produced milk remains production. Treatment\n            # withdrawal is reconciled as WASTAGE, not by deleting litres\n            # from the production side of the ledger.\n            saleable = max(total, 0.0)\n'''
          replace_once(path, old, new, 'gross production reconciliation basis')

          old = '''        ordinary_active = sum(\n            float(item.quantity_litres or 0.0)\n            for item in active\n            if str(item.disposition_type).upper()\n            != "WITHDRAWAL"\n        )\n'''
          new = '''        ordinary_active = sum(\n            float(item.quantity_litres or 0.0)\n            for item in active\n        )\n'''
          replace_once(path, old, new, 'all dispositions consume milk capacity')

          old = '''            ordinary_accounted = sold + non_sale\n\n            accounted = (\n                ordinary_accounted\n                + withdrawal_accounted\n            )\n'''
          new = '''            ordinary_accounted = sold + non_sale\n\n            # Compatibility for historical production rows written with\n            # status WITHDRAWAL before automatic WASTAGE existed. An old\n            # explicit WITHDRAWAL disposition, if present, already accounts\n            # for that volume and is not counted twice.\n            legacy_implicit_wastage = max(\n                withdrawal_litres - withdrawal_accounted,\n                0.0,\n            )\n            non_sale_effective = (\n                non_sale\n                + withdrawal_accounted\n                + legacy_implicit_wastage\n            )\n            accounted = sold + non_sale_effective\n'''
          replace_once(path, old, new, 'legacy withdrawal compatibility accounting')

          old = '''            saleable_delta = (\n                float(produced)\n                - ordinary_accounted\n            )\n\n            withdrawal_delta = (\n                withdrawal_litres\n                - withdrawal_accounted\n            )\n\n            delta = (\n                saleable_delta\n                + withdrawal_delta\n            )\n'''
          new = '''            saleable_delta = (\n                float(produced)\n                - accounted\n            )\n\n            # Withdrawal is no longer a second physical pool. It is a\n            # production fact reconciled through WASTAGE.\n            withdrawal_delta = 0.0\n            delta = saleable_delta\n'''
          replace_once(path, old, new, 'single physical milk pool delta')

          # Two return sites expose non-sale accounted litres.
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          old = '''                    "non_sale_accounted_litres":\n                        round(non_sale, 3),'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'non-sale effective output: expected 2 matches, found {count}')
          text = text.replace(
              old,
              '''                    "non_sale_accounted_litres":\n                        round(non_sale_effective, 3),''',
          )
          p.write_text(text, encoding='utf-8')

          # --------------------------------------------------------------
          # Expose the one authoritative carried balance to Milk UI/Finance.
          # --------------------------------------------------------------
          path = 'src/dairyos/api/milk_traceability.py'
          replace_once(
              path,
              'from dairyos.farm.production.services.milk_reconciliation_service import (\n    MilkReconciliationService,\n)\n',
              'from dairyos.farm.production.services.milk_reconciliation_service import (\n    MilkReconciliationService,\n)\nfrom dairyos.farm.production.services.milk_inventory_capacity_service import (\n    overall_saleable_capacity,\n)\n',
              'capacity import',
          )
          old = '''@router.get("/reconciliation")\ndef milk_reconciliation(\n    production_date: date | None = Query(default=None),\n):\n    target = _production_date(production_date)\n    return MilkReconciliationService().reconcile(target, raise_finding=False)\n\n\n'''
          new = '''@router.get("/reconciliation")\ndef milk_reconciliation(\n    production_date: date | None = Query(default=None),\n):\n    target = _production_date(production_date)\n    return MilkReconciliationService().reconcile(target, raise_finding=False)\n\n\n@router.get("/capacity")\ndef milk_capacity(\n    through_date: date | None = Query(default=None),\n    container=Depends(get_container),\n):\n    target = _production_date(through_date)\n    return overall_saleable_capacity(\n        target,\n        factory=container.repository_factory,\n    )\n\n\n'''
          replace_once(path, old, new, 'capacity endpoint')

          # --------------------------------------------------------------
          # Milk UI: Overall Reconciliation comes from backend capacity and
          # withdrawal save displays a small notice. No layout redesign.
          # --------------------------------------------------------------
          path = 'src/DairyOS.Web/src/components/MilkTab.tsx'
          replace_once(
              path,
              '''type NextSession = {\n''',
              '''type MilkCapacity = {\n  recorded_production_litres: number;\n  ordinary_accounted_litres: number;\n  available_saleable_litres: number;\n};\n\ntype NextSession = {\n''',
              'Milk capacity type',
          )

          old = '''  const [finance, setFinance] =\n    useState<FinanceRow[]>([]);\n'''
          new = '''  const [capacity, setCapacity] =\n    useState<MilkCapacity | null>(null);\n\n  const [finance, setFinance] =\n    useState<FinanceRow[]>([]);\n'''
          replace_once(path, old, new, 'capacity state')

          old = '''        rec,\n        quality,\n        financeLedger,\n      ] = await Promise.all([\n'''
          new = '''        rec,\n        quality,\n        financeLedger,\n        carriedCapacity,\n      ] = await Promise.all([\n'''
          replace_once(path, old, new, 'capacity load destructuring')

          old = '''        request<{\n          transactions: FinanceRow[];\n        }>(\n          '/farm/finance-ledger',\n        ),\n      ]);\n'''
          new = '''        request<{\n          transactions: FinanceRow[];\n        }>(\n          '/farm/finance-ledger',\n        ),\n\n        request<MilkCapacity>(\n          `/farm/milk/capacity?through_date=${bounds.end}`,\n        ),\n      ]);\n'''
          replace_once(path, old, new, 'capacity request')

          old = '''      setReconciliation(rec);\n      setFinance(\n'''
          new = '''      setReconciliation(rec);\n      setCapacity(carriedCapacity);\n      setFinance(\n'''
          replace_once(path, old, new, 'capacity state load')

          old = '''  const monthRecon =\n    monthProduced -\n    monthSold -\n    monthDomestic -\n    monthCalves -\n    monthWastage;\n'''
          new = '''  const monthRecon =\n    capacity?.available_saleable_litres ??\n    (\n      monthProduced -\n      monthSold -\n      monthDomestic -\n      monthCalves -\n      monthWastage\n    );\n'''
          replace_once(path, old, new, 'backend authoritative overall reconciliation')

          old = '''        await request('/farm/milk', {\n'''
          new = '''        const saved = await request<{\n          withdrawal_warning?: boolean;\n          withdrawal_wastage_litres?: number;\n          safety_message?: string;\n        }>('/farm/milk', {\n'''
          replace_once(path, old, new, 'capture milk save result')

          old = '''        setMessage(\n          `Milk production recorded for ${productionAnimal}.`,\n        );\n'''
          new = '''        setMessage(\n          saved.withdrawal_warning\n            ? (\n                saved.safety_message ||\n                `Withdrawal active — milk recorded in production and automatically posted to WASTAGE; it is not available for sale.`\n              )\n            : `Milk production recorded for ${productionAnimal}.`,\n        );\n'''
          replace_once(path, old, new, 'withdrawal UI notice')
          PY

      - name: Source assertions
        shell: bash
        run: |
          grep -F 'ensure_withdrawal_wastage(' src/dairyos/api/farm_data_entry.py
          grep -F 'Automatically recorded because animal' src/dairyos/farm/production/services/withdrawal_milk_wastage_service.py
          grep -F '@router.get("/capacity")' src/dairyos/api/milk_traceability.py
          grep -F 'capacity?.available_saleable_litres' src/DairyOS.Web/src/components/MilkTab.tsx
          grep -F 'saved.withdrawal_warning' src/DairyOS.Web/src/components/MilkTab.tsx
          if grep -F 'status", "") or "").upper() == "WITHDRAWAL"' src/dairyos/api/milk_production_summary.py; then
            echo 'Withdrawal exclusion still present in production summary'
            exit 1
          fi
          git diff --check

      - name: Focused backend regression
        run: |
          python -m pytest -q \
            tests/milk/test_milk_inventory_capacity_service.py \
            tests/milk/test_withdrawal_milk_wastage_service.py \
            tests/milk/test_milk_entry.py

      - name: Frontend production build
        working-directory: src/DairyOS.Web
        run: |
          npm ci
          npm run build

      - name: Commit remediation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/remediate-withdrawal-milk-accounting-once.yml
          git add \
            src/dairyos/api/farm_data_entry.py \
            src/dairyos/api/milk_production_summary.py \
            src/dairyos/farm/production/services/milk_reconciliation_service.py \
            src/dairyos/api/milk_traceability.py \
            src/DairyOS.Web/src/components/MilkTab.tsx \
            .github/workflows/remediate-withdrawal-milk-accounting-once.yml
          git commit -m "fix: reconcile withdrawal milk through automatic wastage"
          git push origin main
