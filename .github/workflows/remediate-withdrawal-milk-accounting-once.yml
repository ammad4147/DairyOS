name: One-shot withdrawal milk accounting remediation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remediate-withdrawal-milk-accounting-once.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dairyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dairyos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DAIRYOS_DB_HOST: localhost
      DAIRYOS_DB_PORT: "5432"
      DAIRYOS_DB_NAME: dairyos
      DAIRYOS_DB_USER: postgres
      DAIRYOS_DB_PASSWORD: postgres
      DAIRYOS_ENV: development
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test runner
        run: python -m pip install --upgrade pip && pip install -e . pytest httpx PyYAML

      - name: Apply guarded remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match in {path}, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'src/dairyos/api/farm_data_entry.py'
          replace_once(
              path,
              'from dairyos.operations.intelligence.services.withdrawal_service import (\n    WithdrawalPeriod,\n)\n',
              'from dairyos.operations.intelligence.services.withdrawal_service import (\n    WithdrawalPeriod,\n)\nfrom dairyos.farm.production.services.withdrawal_milk_wastage_service import (\n    animal_withdrawn_on_date,\n    ensure_withdrawal_wastage,\n)\n',
              'withdrawal wastage imports',
          )
          replace_once(
              path,
              '''    # Milk production state is governed independently from veterinary treatment state.\n    #\n    # Veterinary treatment remains a health-domain fact. Whether an animal\n    # belongs to the active milk population is governed by the veterinary\n    # NonMilkingDirective, not by treatment withdrawal periods.\n    #\n    # Therefore a valid milk entry is always RECORDED here. Non-milking\n    # directives remove zero-expected animals from the governed population;\n    # MILK_SEPARATELY remains a veterinary/operational instruction for milk\n    # handling outside the normal sale-milk herd.\n    status = "RECORDED"\n    withdrawal_warning = False\n    safety_message = None\n''',
              '''    # Treatment withdrawal does not erase biological production. The milk\n    # entry remains RECORDED for the animal's production history, while the\n    # same session quantity is automatically posted to WASTAGE below.\n    withdrawal_svc = getattr(container, "withdrawal_service", None)\n    withdrawal_warning = animal_withdrawn_on_date(\n        withdrawal_svc,\n        str(governed_entry.animal_id),\n        operational_date,\n    )\n    status = "RECORDED"\n    safety_message = (\n        "Withdrawal active — milk is recorded in total production and the "\n        "animal record, and is automatically posted to WASTAGE. It is not "\n        "available for sale."\n        if withdrawal_warning\n        else None\n    )\n''',
              'milk withdrawal classification',
          )
          replace_once(
              path,
              '''    result = _record(\n        container,\n        "milk_production",\n        payload,\n        current_user,\n    )\n\n    if sequenced:\n''',
              '''    result = _record(\n        container,\n        "milk_production",\n        payload,\n        current_user,\n    )\n\n    if withdrawal_warning and total is not None and float(total) > 0:\n        wastage = ensure_withdrawal_wastage(\n            repository_factory=container.repository_factory,\n            withdrawal_service=withdrawal_svc,\n            animal_id=str(governed_entry.animal_id),\n            production_date=operational_date,\n            milking_session=governed_entry.milking_session.value,\n            quantity_litres=float(total),\n            recorded_by=_operator(payload, current_user),\n        )\n        result["withdrawal_warning"] = True\n        result["withdrawal_wastage_litres"] = float(total)\n        result["safety_message"] = safety_message\n        if wastage is not None:\n            result["withdrawal_wastage_id"] = getattr(wastage, "id", None)\n\n    if sequenced:\n''',
              'automatic withdrawal wastage write',
          )

          path = 'src/dairyos/api/milk_production_summary.py'
          replace_once(
              path,
              '''        if str(getattr(record, "status", "") or "").upper() == "WITHDRAWAL":\n            continue\n\n''',
              '',
              'include withdrawal in total production summary',
          )

          path = 'src/dairyos/farm/production/services/milk_reconciliation_service.py'
          replace_once(
              path,
              '''            saleable = max(\n                total - withdrawal,\n                0.0,\n            )\n''',
              '''            # All physically produced milk remains production. Treatment\n            # withdrawal is reconciled as WASTAGE rather than removed from\n            # the production side of the ledger.\n            saleable = max(total, 0.0)\n''',
              'gross production reconciliation basis',
          )
          replace_once(
              path,
              '''        ordinary_active = sum(\n            float(item.quantity_litres or 0.0)\n            for item in active\n            if str(item.disposition_type).upper()\n            != "WITHDRAWAL"\n        )\n''',
              '''        ordinary_active = sum(\n            float(item.quantity_litres or 0.0)\n            for item in active\n        )\n''',
              'all dispositions consume physical milk capacity',
          )
          replace_once(
              path,
              '''            ordinary_accounted = sold + non_sale\n\n            accounted = (\n                ordinary_accounted\n                + withdrawal_accounted\n            )\n''',
              '''            ordinary_accounted = sold + non_sale\n\n            # Historical compatibility only: older rows stored withdrawal\n            # milk as production status WITHDRAWAL instead of creating the\n            # automatic WASTAGE disposition used for new entries. Preserve\n            # those rows and treat the unmatched quantity as implicit waste.\n            legacy_implicit_wastage = max(\n                withdrawal_litres - withdrawal_accounted,\n                0.0,\n            )\n            non_sale_effective = (\n                non_sale\n                + withdrawal_accounted\n                + legacy_implicit_wastage\n            )\n            accounted = sold + non_sale_effective\n''',
              'legacy withdrawal compatibility accounting',
          )
          replace_once(
              path,
              '''            saleable_delta = (\n                float(produced)\n                - ordinary_accounted\n            )\n\n            withdrawal_delta = (\n                withdrawal_litres\n                - withdrawal_accounted\n            )\n\n            delta = (\n                saleable_delta\n                + withdrawal_delta\n            )\n''',
              '''            saleable_delta = (\n                float(produced)\n                - accounted\n            )\n\n            # There is one physical milk pool. Withdrawal milk is production\n            # that is disposed to WASTAGE, not a second reconciliation pool.\n            withdrawal_delta = 0.0\n            delta = saleable_delta\n''',
              'single physical milk pool delta',
          )
          replace_once(
              path,
              '''                    "non_sale_accounted_litres":\n                        round(non_sale, 3),''',
              '''                    "non_sale_accounted_litres":\n                        round(non_sale_effective, 3),''',
              'effective non-sale output',
          )

          path = 'src/dairyos/api/milk_traceability.py'
          replace_once(
              path,
              'from dairyos.farm.production.services.milk_reconciliation_service import (\n    MilkReconciliationService,\n)\n',
              'from dairyos.farm.production.services.milk_reconciliation_service import (\n    MilkReconciliationService,\n)\nfrom dairyos.farm.production.services.milk_inventory_capacity_service import (\n    overall_saleable_capacity,\n)\n',
              'capacity import',
          )
          replace_once(
              path,
              '''@router.get("/reconciliation")\ndef milk_reconciliation(\n    production_date: date | None = Query(default=None),\n):\n    target = _production_date(production_date)\n    return MilkReconciliationService().reconcile(target, raise_finding=False)\n\n\n''',
              '''@router.get("/reconciliation")\ndef milk_reconciliation(\n    production_date: date | None = Query(default=None),\n):\n    target = _production_date(production_date)\n    return MilkReconciliationService().reconcile(target, raise_finding=False)\n\n\n@router.get("/capacity")\ndef milk_capacity(\n    through_date: date | None = Query(default=None),\n    container=Depends(get_container),\n):\n    target = _production_date(through_date)\n    return overall_saleable_capacity(\n        target,\n        factory=container.repository_factory,\n    )\n\n\n''',
              'capacity endpoint',
          )

          path = 'src/DairyOS.Web/src/components/MilkTab.tsx'
          replace_once(
              path,
              '''type NextSession = {\n''',
              '''type MilkCapacity = {\n  recorded_production_litres: number;\n  ordinary_accounted_litres: number;\n  available_saleable_litres: number;\n};\n\ntype NextSession = {\n''',
              'Milk capacity type',
          )
          replace_once(
              path,
              '''  const [finance, setFinance] =\n    useState<FinanceRow[]>([]);\n''',
              '''  const [capacity, setCapacity] =\n    useState<MilkCapacity | null>(null);\n\n  const [finance, setFinance] =\n    useState<FinanceRow[]>([]);\n''',
              'capacity state',
          )
          replace_once(
              path,
              '''        rec,\n        quality,\n        financeLedger,\n      ] = await Promise.all([\n''',
              '''        rec,\n        quality,\n        financeLedger,\n        carriedCapacity,\n      ] = await Promise.all([\n''',
              'capacity load destructuring',
          )
          replace_once(
              path,
              '''        request<{\n          transactions: FinanceRow[];\n        }>(\n          '/farm/finance-ledger',\n        ),\n      ]);\n''',
              '''        request<{\n          transactions: FinanceRow[];\n        }>(\n          '/farm/finance-ledger',\n        ),\n\n        request<MilkCapacity>(\n          `/farm/milk/capacity?through_date=${bounds.end}`,\n        ),\n      ]);\n''',
              'capacity request',
          )
          replace_once(
              path,
              '''      setReconciliation(rec);\n      setFinance(\n''',
              '''      setReconciliation(rec);\n      setCapacity(carriedCapacity);\n      setFinance(\n''',
              'capacity state load',
          )
          replace_once(
              path,
              '''  const monthRecon =\n    monthProduced -\n    monthSold -\n    monthDomestic -\n    monthCalves -\n    monthWastage;\n''',
              '''  const monthRecon =\n    capacity?.available_saleable_litres ??\n    (\n      monthProduced -\n      monthSold -\n      monthDomestic -\n      monthCalves -\n      monthWastage\n    );\n''',
              'backend authoritative overall reconciliation',
          )
          replace_once(
              path,
              '''        await request('/farm/milk', {\n''',
              '''        const saved = await request<{\n          withdrawal_warning?: boolean;\n          withdrawal_wastage_litres?: number;\n          safety_message?: string;\n        }>('/farm/milk', {\n''',
              'capture milk save result',
          )
          replace_once(
              path,
              '''        setMessage(\n          `Milk production recorded for ${productionAnimal}.`,\n        );\n''',
              '''        setMessage(\n          saved.withdrawal_warning\n            ? (\n                saved.safety_message ||\n                `Withdrawal active — milk recorded in production and automatically posted to WASTAGE; it is not available for sale.`\n              )\n            : `Milk production recorded for ${productionAnimal}.`,\n        );\n''',
              'withdrawal UI notice',
          )
          PY

      - name: Source assertions
        shell: bash
        run: |
          grep -F 'ensure_withdrawal_wastage(' src/dairyos/api/farm_data_entry.py
          grep -F 'Automatically recorded because animal' src/dairyos/farm/production/services/withdrawal_milk_wastage_service.py
          grep -F '@router.get("/capacity")' src/dairyos/api/milk_traceability.py
          grep -F 'capacity?.available_saleable_litres' src/DairyOS.Web/src/components/MilkTab.tsx
          grep -F 'saved.withdrawal_warning' src/DairyOS.Web/src/components/MilkTab.tsx
          git diff --check

      - name: Focused backend regression
        run: |
          python -m pytest -q \
            tests/milk/test_milk_inventory_capacity_service.py \
            tests/milk/test_withdrawal_milk_wastage_service.py \
            tests/milk/test_milk_entry.py

      - name: Frontend production build
        working-directory: src/DairyOS.Web
        run: |
          npm ci
          npm run build

      - name: Commit remediation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/remediate-withdrawal-milk-accounting-once.yml
          git add \
            src/dairyos/api/farm_data_entry.py \
            src/dairyos/api/milk_production_summary.py \
            src/dairyos/farm/production/services/milk_reconciliation_service.py \
            src/dairyos/api/milk_traceability.py \
            src/DairyOS.Web/src/components/MilkTab.tsx \
            .github/workflows/remediate-withdrawal-milk-accounting-once.yml
          git commit -m "fix: reconcile withdrawal milk through automatic wastage"
          git push origin main
