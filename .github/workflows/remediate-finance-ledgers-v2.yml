name: Remediate Finance Ledgers V2

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/remediate-finance-ledgers-v2.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dairyos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dairyos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DAIRYOS_DB_HOST: localhost
      DAIRYOS_DB_PORT: "5432"
      DAIRYOS_DB_NAME: dairyos_test
      DAIRYOS_DB_USER: postgres
      DAIRYOS_DB_PASSWORD: postgres
      DAIRYOS_ENV: development

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply Finance remediation
        shell: python
        run: |
          from pathlib import Path

          def load(path):
              return Path(path).read_text(encoding="utf-8-sig")

          def save(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          api_path = "src/dairyos/api/finance_ledger.py"
          api = load(api_path)
          api = once(api, '    "RECEIVED": frozenset({"RECEIVED"}),\n', '    "RECEIVED": frozenset({"RECEIVED", "VOID"}),\n', "RECEIVED -> VOID")
          old_milk_void = '''    elif status == "VOID":
                  disposition.status = "VOID"
                  disposition.quantity_litres = 0.0
                  disposition.amount_due = 0.0
                  disposition.amount_received = 0.0
          '''
          # Normalize indentation from the literal above to the source indentation.
          old_milk_void = old_milk_void.replace("                ", "        ")
          new_milk_void = '''    elif status == "VOID":
                  disposition.status = "VOID"
                  disposition.notes = transaction.notes
          '''.replace("                ", "        ")
          api = once(api, old_milk_void, new_milk_void, "Milk VOID fact preservation")
          payables = '''

          @router.get("/payables")
          def list_payables(
              container=Depends(get_container),
          ):
              factory = _factory(container)
              rows = factory.finance().get_all()

              return _ageing_payload(
                  [
                      row
                      for row in rows
                      if row.status == "PAYABLE"
                  ]
              )
          '''
          payables = "\n".join(line[10:] if line.startswith("          ") else line for line in payables.splitlines()) + "\n"
          api = once(api, payables, "", "duplicate Payables endpoint")
          save(api_path, api)

          edit_path = "tests/api/test_finance_edit_payables.py"
          edit = load(edit_path).replace('client.get("/farm/finance-ledger/payables")', 'client.get("/farm/finance-ledger/ageing")')
          if "/farm/finance-ledger/payables" in edit:
              raise SystemExit("legacy Payables endpoint remains in API tests")
          save(edit_path, edit)

          transitions_path = "tests/api/test_finance_state_transitions.py"
          transitions = load(transitions_path)
          transitions = once(transitions, '        ("PAID", "VOID"),\n', '        ("PAID", "VOID"),\n        ("RECEIVED", "VOID"),\n', "RECEIVED VOID regression")
          save(transitions_path, transitions)

          ui_path = "src/DairyOS.Web/src/components/FinanceTab.tsx"
          ui = load(ui_path)
          ui = once(ui, ",[revRef,setRevRef]=useState(''),[revNotes,setRevNotes]=useState(''),", ",[revRef,setRevRef]=useState(''),[revCounterparty,setRevCounterparty]=useState(''),[revNotes,setRevNotes]=useState(''),", "revenue counterparty state")
          ui = once(ui, "payment_method:revStatus==='RECEIVABLE'?'CREDIT':'CASH',status:revStatus,", "payment_method:revStatus==='RECEIVABLE'?'CREDIT':'CASH',counterparty:revCounterparty||null,status:revStatus,", "revenue counterparty payload")
          ui = once(ui, "buyer_or_counterparty:null,amount,", "buyer_or_counterparty:revCounterparty||null,amount,", "animal-sale buyer")
          ui = once(ui, "setRevAmount('');setRevQty('');setRevRef('');setRevNotes('');", "setRevAmount('');setRevQty('');setRevRef('');setRevCounterparty('');setRevNotes('');", "revenue reset")
          ui = once(ui, "{revStatus==='RECEIVABLE'&&<input value={revRef} onChange={e=>setRevRef(e.target.value)} style={{...inputStyle,marginTop:6}} placeholder=\"Reference\"/>}<input value={revNotes}", "{revStatus==='RECEIVABLE'&&<input value={revRef} onChange={e=>setRevRef(e.target.value)} style={{...inputStyle,marginTop:6}} placeholder=\"Reference\"/>}<input value={revCounterparty} onChange={e=>setRevCounterparty(e.target.value)} style={{...inputStyle,marginTop:6}} placeholder=\"Customer / Buyer\"/><input value={revNotes}", "revenue counterparty input")

          header = "<div style={{...ledgerLine,color:'#64748b',fontSize:8,fontWeight:800,textTransform:'uppercase',borderBottom:'1px solid #1f2937',padding:'0 8px 5px'}}><span style={{width:76,flex:'0 0 76px'}}>Date</span><span style={ledgerEllipsis}>Particulars</span><span style={{...ledgerEllipsis,flexBasis:100}}>Counterparty</span><span style={{...ledgerEllipsis,flexBasis:100}}>Reference</span><span style={{width:76,flex:'0 0 76px'}}>Status</span><span style={{width:118,flex:'0 0 118px',textAlign:'right'}}>Amount</span></div>"
          ui = once(ui, '<section style={card}><div style={sectionTitle}>Revenue Ledger</div>{revenueRows.slice(0,50)', '<section style={card}><div style={sectionTitle}>Revenue Ledger</div>'+header+'{revenueRows.slice(0,50)', "revenue header")
          toolbar = "<button onClick={()=>window.print()} style={smallButton}><Printer size={11}/></button></div>{loading?"
          ui = once(ui, toolbar, "<button onClick={()=>window.print()} style={smallButton}><Printer size={11}/></button></div>"+header+"{loading?", "expense header")
          ui = once(ui, "<span title={r.notes||r.category} style={ledgerEllipsis}>{r.notes||r.category}</span><span title={r.reference||''} style={{...ledgerEllipsis,flexBasis:100}}>{r.reference||'—'}</span>", "<span title={r.notes||r.category} style={ledgerEllipsis}>{r.category||'OTHER_REVENUE'}</span><span title={r.counterparty||''} style={{...ledgerEllipsis,flexBasis:100}}>{r.counterparty||'—'}</span><span title={r.reference||''} style={{...ledgerEllipsis,flexBasis:100}}>{r.reference||'—'}</span>", "revenue columns")
          ui = once(ui, "<span title={`${r.vendor_name||'No vendor'} · ${r.reference||'No reference'}`} style={{...ledgerEllipsis,flexBasis:120}}>{r.vendor_name||'No vendor'} · {r.reference||'—'}</span>", "<span title={r.vendor_name||r.counterparty||''} style={{...ledgerEllipsis,flexBasis:100}}>{r.vendor_name||r.counterparty||'—'}</span><span title={r.reference||''} style={{...ledgerEllipsis,flexBasis:100}}>{r.reference||'—'}</span>", "expense columns")
          ui = once(ui, "{isVoid?<span title={reason||'Reason recorded in audit trail'} style={{...voidReasonStyle,maxWidth:190}}>VOID: {reason||'See audit trail'}</span>:r.status==='RECEIVABLE'?<button onClick={()=>void updateStatus(r,'RECEIVED')} style={smallButton}>Paid</button>:null}", "{isVoid?<span title={reason||'Reason recorded in audit trail'} style={{...voidReasonStyle,maxWidth:190}}>VOID: {reason||'See audit trail'}</span>:<><>{r.status==='RECEIVABLE'&&<button onClick={()=>void updateStatus(r,'RECEIVED')} style={smallButton}>Received</button>}</><button onClick={()=>setVoidTarget(r)} style={{...smallButton,color:'#f87171'}}><Ban size={10}/>Void</button></>}", "revenue void action")
          save(ui_path, ui)

          contract_path = "tests/architecture/test_finance_surface_contract.py"
          contract = load(contract_path)
          contract = once(contract, 'FINANCE_TAB = ROOT / "src" / "DairyOS.Web" / "src" / "components" / "FinanceTab.tsx"\n', 'FINANCE_TAB = ROOT / "src" / "DairyOS.Web" / "src" / "components" / "FinanceTab.tsx"\nFINANCE_API = ROOT / "src" / "dairyos" / "api" / "finance_ledger.py"\n', "finance API contract path")
          contract += '''

          def test_finance_backend_has_no_duplicate_payables_endpoint():
              api = FINANCE_API.read_text(encoding="utf-8-sig")
              assert '@router.get("/payables")' not in api


          def test_finance_ledgers_use_standard_accounting_columns_and_revenue_void():
              text = FINANCE_TAB.read_text(encoding="utf-8-sig")
              for label in ("Date", "Particulars", "Counterparty", "Reference", "Status", "Amount"):
                  assert label in text
              assert "Customer / Buyer" in text
              assert ">Received</button>" in text
              assert "setVoidTarget(r)" in text


          def test_linked_milk_sale_void_preserves_original_values():
              api = FINANCE_API.read_text(encoding="utf-8-sig")
              assert '"RECEIVED": frozenset({"RECEIVED", "VOID"})' in api
              assert 'elif status == "VOID":\n        disposition.status = "VOID"\n        disposition.notes = transaction.notes' in api
              destructive = 'elif status == "VOID":\n        disposition.status = "VOID"\n        disposition.quantity_litres = 0.0\n        disposition.amount_due = 0.0\n        disposition.amount_received = 0.0'
              assert destructive not in api
          '''
          contract = "\n".join(line[10:] if line.startswith("          ") else line for line in contract.splitlines()) + "\n"
          save(contract_path, contract)

      - name: Enforce remediation contract
        shell: python
        run: |
          from pathlib import Path
          api = Path("src/dairyos/api/finance_ledger.py").read_text(encoding="utf-8-sig")
          ui = Path("src/DairyOS.Web/src/components/FinanceTab.tsx").read_text(encoding="utf-8-sig")
          assert '"RECEIVED": frozenset({"RECEIVED", "VOID"})' in api
          assert '@router.get("/payables")' not in api
          assert 'elif status == "VOID":\n        disposition.status = "VOID"\n        disposition.notes = transaction.notes' in api
          assert "['Payables',payableTotal" in ui
          assert "Customer / Buyer" in ui
          assert "buyer_or_counterparty:revCounterparty||null" in ui
          assert all(label in ui for label in ("Particulars", "Counterparty", "Reference"))
          assert ">Received</button>" in ui

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend and tests
        run: python -m pip install --upgrade pip && pip install -e . pytest httpx PyYAML

      - name: Run Finance focused regression
        run: pytest -q tests/api/test_finance_state_transitions.py tests/api/test_finance_edit_payables.py tests/architecture/test_finance_surface_contract.py tests/api/test_finance_transaction_integrity.py

      - name: Run full backend regression
        run: pytest -q tests

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/DairyOS.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/DairyOS.Web
        run: npm ci

      - name: Typecheck frontend
        working-directory: src/DairyOS.Web
        run: npm run typecheck

      - name: Build frontend
        working-directory: src/DairyOS.Web
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remediate-finance-ledgers.yml
          git rm .github/workflows/remediate-finance-ledgers-v2.yml
          git add -A
          git commit -m "fix(finance): normalize ledgers and preserve void audit facts"
          git push origin HEAD:main
