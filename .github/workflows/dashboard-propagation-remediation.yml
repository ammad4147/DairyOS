name: DairyOS Dashboard Propagation Remediation

on:
  push:
    paths:
      - .dairyos-dashboard-propagation-trigger

permissions:
  contents: write

jobs:
  remediate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Apply dashboard propagation correction
        shell: python
        run: |
          from pathlib import Path
          root = Path('.')
          path = root / 'src/dairyos/dashboard/services/dashboard_projection_service.py'
          text = path.read_text(encoding='utf-8-sig')
          old_milk = '''    @staticmethod\n    def _milk_read_model(container):\n        """Read existing authoritative milk intelligence without recalculating it here."""\n\n        service = getattr(\n            container,\n            "daily_milk_production_command_view_service",\n            None,\n        )\n\n        if service is None:\n            return {}\n\n        try:\n            return service.summary()\n        except Exception:\n            return {}\n'''
          new_milk = '''    @staticmethod\n    def _milk_read_model(container):\n        """Build the compatibility Milk projection from persisted Milk records."""\n\n        repository_factory = getattr(container, "repository_factory", None)\n        if repository_factory is None:\n            return {}\n\n        try:\n            from dairyos.farm.settings.services.operational_date_authority import OperationalDateAuthority\n            operational_date = OperationalDateAuthority(repository_factory=repository_factory).current_date()\n            target_day = operational_date.isoformat()\n            records = repository_factory.milk().get_all() or []\n            matching = []\n            for record in records:\n                status = str(getattr(record, "status", "RECORDED") or "RECORDED").upper()\n                if status == "VOID":\n                    continue\n                production_date = getattr(record, "production_date", None)\n                if production_date is None:\n                    continue\n                record_day = str(production_date.isoformat() if hasattr(production_date, "isoformat") else production_date)[:10]\n                if record_day == target_day:\n                    matching.append(record)\n            shift_production = {"MORNING": 0.0, "AFTERNOON": 0.0, "EVENING": 0.0}\n            total_litres = 0.0\n            for record in matching:\n                values = {\n                    "MORNING": getattr(record, "morning_yield", None),\n                    "AFTERNOON": getattr(record, "afternoon_yield", None),\n                    "EVENING": getattr(record, "evening_yield", None),\n                }\n                for session, value in values.items():\n                    if value is not None:\n                        shift_production[session] += float(value or 0.0)\n                total = getattr(record, "total_yield", None)\n                total_litres += float(total if total is not None else sum(float(v or 0.0) for v in values.values()))\n            return {\n                "total_litres": round(total_litres, 3),\n                "group_yield": {\n                    "shift_production": {key: round(value, 3) for key, value in shift_production.items()},\n                    "shift_contribution": ({key: round((value / total_litres) * 100.0, 3) for key, value in shift_production.items()} if total_litres else {}),\n                },\n                "data_status": "LIVE_PERSISTED_DATA",\n            }\n        except Exception:\n            return {}\n'''
          if old_milk not in text:
              raise SystemExit('Expected _milk_read_model source fragment not found')
          text = text.replace(old_milk, new_milk, 1)
          old_feed = '''        farm_state = (\n            farm_state_service.get_state()\n            if farm_state_service is not None\n            else None\n        )\n\n        operational_date = getattr(\n            farm_state,\n            "operational_date",\n            None,\n        )\n\n        if operational_date is None:\n            return {}\n'''
          new_feed = '''        try:\n            from dairyos.farm.settings.services.operational_date_authority import OperationalDateAuthority\n            operational_date = OperationalDateAuthority(repository_factory=repository_factory).current_date()\n        except Exception:\n            farm_state = (\n                farm_state_service.get_state()\n                if farm_state_service is not None\n                else None\n            )\n            operational_date = getattr(farm_state, "operational_date", None)\n\n        if operational_date is None:\n            return {}\n'''
          if old_feed not in text:
              raise SystemExit('Expected _feed_read_model date source fragment not found')
          text = text.replace(old_feed, new_feed, 1)
          path.write_text(text, encoding='utf-8')
          (root / '.dairyos-dashboard-propagation-trigger').unlink(missing_ok=True)
          (root / '.github/workflows/dashboard-propagation-remediation.yml').unlink(missing_ok=True)

      - name: Validate failing surface certifications
        run: |
          python -m compileall -q src/dairyos
          pytest -q tests/lifecycle/test_feed_surface_certification.py tests/lifecycle/test_milk_surface_certification.py

      - name: Commit dashboard propagation correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dairyos/dashboard/services/dashboard_projection_service.py
          git commit -m "Fix Dashboard propagation from persisted Milk and Feed records"
          git push origin main
