name: DairyOS Dashboard Propagation Remediation

on:
  push:
    paths:
      - .dairyos-dashboard-propagation-trigger

permissions:
  contents: write

jobs:
  remediate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dashboard propagation correction
        shell: python
        run: |
          from pathlib import Path
          root = Path('.')

          path = root / 'src/dairyos/dashboard/services/dashboard_projection_service.py'
          text = path.read_text(encoding='utf-8-sig')

          old_milk = '''    @staticmethod\n    def _milk_read_model(container):\n        """Read existing authoritative milk intelligence without recalculating it here."""\n\n        service = getattr(\n            container,\n            "daily_milk_production_command_view_service",\n            None,\n        )\n\n        if service is None:\n            return {}\n\n        try:\n            return service.summary()\n        except Exception:\n            return {}\n'''

          new_milk = '''    @staticmethod\n    def _milk_read_model(container):\n        """Build the compatibility Milk projection from persisted Milk records."""\n\n        repository_factory = getattr(container, "repository_factory", None)\n        if repository_factory is None:\n            return {}\n\n        try:\n            from dairyos.farm.settings.services.operational_date_authority import (\n                OperationalDateAuthority,\n            )\n\n            operational_date = OperationalDateAuthority(\n                repository_factory=repository_factory,\n            ).current_date()\n            target_day = operational_date.isoformat()\n\n            records = repository_factory.milk().get_all() or []\n            matching = []\n\n            for record in records:\n                status = str(getattr(record, "status", "RECORDED") or "RECORDED").upper()\n                if status == "VOID":\n                    continue\n\n                production_date = getattr(record, "production_date", None)\n                if production_date is None:\n                    continue\n\n                record_day = str(\n                    production_date.isoformat()\n                    if hasattr(production_date, "isoformat")\n                    else production_date\n                )[:10]\n\n                if record_day == target_day:\n                    matching.append(record)\n\n            shift_production = {\n                "MORNING": 0.0,\n                "AFTERNOON": 0.0,\n                "EVENING": 0.0,\n            }\n\n            total_litres = 0.0\n            for record in matching:\n                values = {\n                    "MORNING": getattr(record, "morning_yield", None),\n                    "AFTERNOON": getattr(record, "afternoon_yield", None),\n                    "EVENING": getattr(record, "evening_yield", None),\n                }\n                for session, value in values.items():\n                    if value is not None:\n                        shift_production[session] += float(value or 0.0)\n                total = getattr(record, "total_yield", None)\n                total_litres += float(total if total is not None else sum(float(v or 0.0) for v in values.values()))\n\n            return {\n                "total_litres": round(total_litres, 3),\n                "group_yield": {\n                    "shift_production": {\n                        key: round(value, 3) for key, value in shift_production.items()\n                    },\n                    "shift_contribution": ({\n                        key: round((value / total_litres) * 100.0, 3)\n                        for key, value in shift_production.items()\n                    } if total_litres else {}),\n                },\n                "data_status": "LIVE_PERSISTED_DATA",\n            }\n        except Exception:\n            return {}\n'''

          if old_milk not in text:
              raise SystemExit('Expected _milk_read_model source fragment not found')
          text = text.replace(old_milk, new_milk, 1)

          old_feed_date = '''        farm_state = (\n            farm_state_service.get_state()\n            if farm_state_service is not None\n            else None\n        )\n\n        operational_date = getattr(\n            farm_state,\n            "operational_date",\n            None,\n        )\n\n        if operational_date is None:\n            return {}\n'''

          new_feed_date = '''        try:\n            from dairyos.farm.settings.services.operational_date_authority import (\n                OperationalDateAuthority,\n            )\n\n            operational_date = OperationalDateAuthority(\n                repository_factory=repository_factory,\n            ).current_date()\n        except Exception:\n            farm_state = (\n                farm_state_service.get_state()\n                if farm_state_service is not None\n                else None\n            )\n            operational_date = getattr(farm_state, "operational_date", None)\n\n        if operational_date is None:\n            return {}\n'''

          if old_feed_date not in text:
              raise SystemExit('Expected _feed_read_model date source fragment not found')
          text = text.replace(old_feed_date, new_feed_date, 1)
          path.write_text(text, encoding='utf-8')

          trigger = root / '.dairyos-dashboard-propagation-trigger'
          if trigger.exists():
              trigger.unlink()
          workflow = root / '.github/workflows/dashboard-propagation-remediation.yml'
          if workflow.exists():
              workflow.unlink()

      - name: Validate failing surface certifications
        shell: bash
        run: |
          python -m compileall -q src/dairyos
          pytest -q tests/lifecycle/test_feed_surface_certification.py tests/lifecycle/test_milk_surface_certification.py

      - name: Commit dashboard propagation correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dairyos/dashboard/services/dashboard_projection_service.py
          git commit -m "Fix Dashboard propagation from persisted Milk and Feed records"
          git push origin main
