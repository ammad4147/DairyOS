name: Remediate Finance Ledgers V3

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/remediate-finance-ledgers-v3.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dairyos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dairyos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DAIRYOS_DB_HOST: localhost
      DAIRYOS_DB_PORT: "5432"
      DAIRYOS_DB_NAME: dairyos_test
      DAIRYOS_DB_USER: postgres
      DAIRYOS_DB_PASSWORD: postgres
      DAIRYOS_ENV: development

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply Finance remediation
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8-sig")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          api_path = "src/dairyos/api/finance_ledger.py"
          api = read(api_path)
          api = replace_once(
              api,
              '    "RECEIVED": frozenset({"RECEIVED"}),\n',
              '    "RECEIVED": frozenset({"RECEIVED", "VOID"}),\n',
              "RECEIVED -> VOID transition",
          )
          api = replace_once(
              api,
              '    elif status == "VOID":\n        disposition.status = "VOID"\n        disposition.quantity_litres = 0.0\n        disposition.amount_due = 0.0\n        disposition.amount_received = 0.0\n',
              '    elif status == "VOID":\n        disposition.status = "VOID"\n        disposition.notes = transaction.notes\n',
              "linked Milk sale VOID preservation",
          )
          api, n = re.subn(
              r'\n\n@router\.get\("/payables"\)\ndef list_payables\([\s\S]*?\n\n@router\.get\("/taxonomy"\)',
              '\n\n@router.get("/taxonomy")',
              api,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"duplicate Payables endpoint removal: expected one match, found {n}")
          write(api_path, api)

          edit_test = "tests/api/test_finance_edit_payables.py"
          edit = read(edit_test).replace(
              'client.get("/farm/finance-ledger/payables")',
              'client.get("/farm/finance-ledger/ageing")',
          )
          if "/farm/finance-ledger/payables" in edit:
              raise SystemExit("legacy Payables endpoint remains in API tests")
          write(edit_test, edit)

          transition_test = "tests/api/test_finance_state_transitions.py"
          transitions = read(transition_test)
          transitions = replace_once(
              transitions,
              '        ("PAID", "VOID"),\n',
              '        ("PAID", "VOID"),\n        ("RECEIVED", "VOID"),\n',
              "RECEIVED -> VOID regression",
          )
          write(transition_test, transitions)

          ui_path = "src/DairyOS.Web/src/components/FinanceTab.tsx"
          ui = read(ui_path)
          ui = replace_once(
              ui,
              ",[revRef,setRevRef]=useState(''),[revNotes,setRevNotes]=useState(''),",
              ",[revRef,setRevRef]=useState(''),[revCounterparty,setRevCounterparty]=useState(''),[revNotes,setRevNotes]=useState(''),",
              "revenue counterparty state",
          )
          ui = replace_once(
              ui,
              "payment_method:revStatus==='RECEIVABLE'?'CREDIT':'CASH',status:revStatus,",
              "payment_method:revStatus==='RECEIVABLE'?'CREDIT':'CASH',counterparty:revCounterparty||null,status:revStatus,",
              "revenue counterparty payload",
          )
          ui = replace_once(
              ui,
              "buyer_or_counterparty:null,amount,",
              "buyer_or_counterparty:revCounterparty||null,amount,",
              "animal sale counterparty linkage",
          )
          ui = replace_once(
              ui,
              "setRevAmount('');setRevQty('');setRevRef('');setRevNotes('');",
              "setRevAmount('');setRevQty('');setRevRef('');setRevCounterparty('');setRevNotes('');",
              "revenue counterparty reset",
          )
          ui = replace_once(
              ui,
              "{revStatus==='RECEIVABLE'&&<input value={revRef} onChange={e=>setRevRef(e.target.value)} style={{...inputStyle,marginTop:6}} placeholder=\"Reference\"/>}<input value={revNotes}",
              "{revStatus==='RECEIVABLE'&&<input value={revRef} onChange={e=>setRevRef(e.target.value)} style={{...inputStyle,marginTop:6}} placeholder=\"Reference\"/>}<input value={revCounterparty} onChange={e=>setRevCounterparty(e.target.value)} style={{...inputStyle,marginTop:6}} placeholder=\"Customer / Buyer\"/><input value={revNotes}",
              "revenue counterparty input",
          )

          header = "<div style={{...ledgerLine,color:'#64748b',fontSize:8,fontWeight:800,textTransform:'uppercase',borderBottom:'1px solid #1f2937',padding:'0 8px 5px'}}><span style={{width:76,flex:'0 0 76px'}}>Date</span><span style={ledgerEllipsis}>Particulars</span><span style={{...ledgerEllipsis,flexBasis:100}}>Counterparty</span><span style={{...ledgerEllipsis,flexBasis:100}}>Reference</span><span style={{width:76,flex:'0 0 76px'}}>Status</span><span style={{width:118,flex:'0 0 118px',textAlign:'right'}}>Amount</span></div>"
          ui = replace_once(
              ui,
              '<section style={card}><div style={sectionTitle}>Revenue Ledger</div>{revenueRows.slice(0,50)',
              '<section style={card}><div style={sectionTitle}>Revenue Ledger</div>' + header + '{revenueRows.slice(0,50)',
              "revenue ledger header",
          )
          toolbar = "<button onClick={()=>window.print()} style={smallButton}><Printer size={11}/></button></div>{loading?"
          ui = replace_once(
              ui,
              toolbar,
              "<button onClick={()=>window.print()} style={smallButton}><Printer size={11}/></button></div>" + header + "{loading?",
              "expense ledger header",
          )
          ui = replace_once(
              ui,
              "<span title={r.notes||r.category} style={ledgerEllipsis}>{r.notes||r.category}</span><span title={r.reference||''} style={{...ledgerEllipsis,flexBasis:100}}>{r.reference||'—'}</span>",
              "<span title={r.notes||r.category} style={ledgerEllipsis}>{r.category||'OTHER_REVENUE'}</span><span title={r.counterparty||''} style={{...ledgerEllipsis,flexBasis:100}}>{r.counterparty||'—'}</span><span title={r.reference||''} style={{...ledgerEllipsis,flexBasis:100}}>{r.reference||'—'}</span>",
              "revenue ledger standard columns",
          )
          ui = replace_once(
              ui,
              "<span title={`${r.vendor_name||'No vendor'} · ${r.reference||'No reference'}`} style={{...ledgerEllipsis,flexBasis:120}}>{r.vendor_name||'No vendor'} · {r.reference||'—'}</span>",
              "<span title={r.vendor_name||r.counterparty||''} style={{...ledgerEllipsis,flexBasis:100}}>{r.vendor_name||r.counterparty||'—'}</span><span title={r.reference||''} style={{...ledgerEllipsis,flexBasis:100}}>{r.reference||'—'}</span>",
              "expense ledger standard columns",
          )
          ui = replace_once(
              ui,
              "{isVoid?<span title={reason||'Reason recorded in audit trail'} style={{...voidReasonStyle,maxWidth:190}}>VOID: {reason||'See audit trail'}</span>:r.status==='RECEIVABLE'?<button onClick={()=>void updateStatus(r,'RECEIVED')} style={smallButton}>Paid</button>:null}",
              "{isVoid?<span title={reason||'Reason recorded in audit trail'} style={{...voidReasonStyle,maxWidth:190}}>VOID: {reason||'See audit trail'}</span>:<><>{r.status==='RECEIVABLE'&&<button onClick={()=>void updateStatus(r,'RECEIVED')} style={smallButton}>Received</button>}</><button onClick={()=>setVoidTarget(r)} style={{...smallButton,color:'#f87171'}}><Ban size={10}/>Void</button></>}",
              "revenue ledger void action",
          )
          write(ui_path, ui)

          contract = textwrap.dedent(r'''
              from pathlib import Path

              ROOT = Path(__file__).resolve().parents[2]
              API = ROOT / "src" / "dairyos" / "api" / "finance_ledger.py"
              UI = ROOT / "src" / "DairyOS.Web" / "src" / "components" / "FinanceTab.tsx"


              def test_duplicate_payables_endpoint_is_retired():
                  api = API.read_text(encoding="utf-8-sig")
                  assert '@router.get("/payables")' not in api
                  assert '@router.get("/ageing")' in api


              def test_received_revenue_is_governedly_voidable():
                  api = API.read_text(encoding="utf-8-sig")
                  assert '"RECEIVED": frozenset({"RECEIVED", "VOID"})' in api


              def test_linked_milk_sale_void_preserves_original_business_facts():
                  api = API.read_text(encoding="utf-8-sig")
                  preserved = 'elif status == "VOID":\n        disposition.status = "VOID"\n        disposition.notes = transaction.notes'
                  destructive = 'elif status == "VOID":\n        disposition.status = "VOID"\n        disposition.quantity_litres = 0.0\n        disposition.amount_due = 0.0\n        disposition.amount_received = 0.0'
                  assert preserved in api
                  assert destructive not in api


              def test_finance_ledgers_share_clean_accounting_columns_and_revenue_void_action():
                  ui = UI.read_text(encoding="utf-8-sig")
                  for label in ("Date", "Particulars", "Counterparty", "Reference", "Status", "Amount"):
                      assert label in ui
                  assert "Customer / Buyer" in ui
                  assert "buyer_or_counterparty:revCounterparty||null" in ui
                  assert ">Received</button>" in ui
                  assert "setVoidTarget(r)" in ui
                  assert "['Payables',payableTotal" in ui
                  assert "/farm/finance-ledger/payables" not in ui
          ''').lstrip()
          write("tests/architecture/test_finance_void_and_ledger_contract.py", contract)

      - name: Remove retired Digital Twin artifacts
        run: |
          git rm tests/architecture/test_digital_twin_architecture.py
          git rm tests/architecture/test_digital_twin_operational_contract.py
          git rm tests/platform/integration/test_twin_knowledge_integration.py
          git rm src/dairyos/platform/knowledge_graph/integration/twin_adapter.py

      - name: Enforce remediation and artifact contract
        shell: python
        run: |
          from pathlib import Path
          api = Path("src/dairyos/api/finance_ledger.py").read_text(encoding="utf-8-sig")
          ui = Path("src/DairyOS.Web/src/components/FinanceTab.tsx").read_text(encoding="utf-8-sig")
          assert '"RECEIVED": frozenset({"RECEIVED", "VOID"})' in api
          assert '@router.get("/payables")' not in api
          assert '@router.get("/ageing")' in api
          assert 'elif status == "VOID":\n        disposition.status = "VOID"\n        disposition.notes = transaction.notes' in api
          assert "['Payables',payableTotal" in ui
          assert "Customer / Buyer" in ui
          assert "buyer_or_counterparty:revCounterparty||null" in ui
          assert all(label in ui for label in ("Particulars", "Counterparty", "Reference"))
          assert ">Received</button>" in ui
          retired = [
              "tests/architecture/test_digital_twin_architecture.py",
              "tests/architecture/test_digital_twin_operational_contract.py",
              "tests/platform/integration/test_twin_knowledge_integration.py",
              "src/dairyos/platform/knowledge_graph/integration/twin_adapter.py",
          ]
          assert all(not Path(path).exists() for path in retired)
          forbidden = ("dairyos.platform.digital_twin", "TwinKnowledgeAdapter")
          for base in (Path("src"), Path("tests")):
              for path in base.rglob("*.py"):
                  text = path.read_text(encoding="utf-8-sig", errors="ignore")
                  for token in forbidden:
                      assert token not in text, f"{token} remains in {path}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend and tests
        run: python -m pip install --upgrade pip && pip install -e . pytest httpx PyYAML

      - name: Run Finance focused regression
        run: pytest -q tests/api/test_finance_state_transitions.py tests/api/test_finance_edit_payables.py tests/architecture/test_finance_surface_contract.py tests/architecture/test_finance_void_and_ledger_contract.py tests/api/test_finance_transaction_integrity.py

      - name: Run full backend regression
        run: pytest -q tests

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/DairyOS.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/DairyOS.Web
        run: npm ci

      - name: Typecheck frontend
        working-directory: src/DairyOS.Web
        run: npm run typecheck

      - name: Build frontend
        working-directory: src/DairyOS.Web
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remediate-finance-ledgers.yml
          git rm .github/workflows/remediate-finance-ledgers-v2.yml
          git rm .github/workflows/remediate-finance-ledgers-v3.yml
          git add -A
          git commit -m "fix(finance): normalize ledgers and remove retired twin artifacts"
          git push origin HEAD:main
