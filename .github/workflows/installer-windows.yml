name: DairyOS Installer Windows

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  installer-windows-certification:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/DairyOS.Web/package-lock.json

      - name: Install Python project and desktop dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,test]"

      - name: Install frontend dependencies
        shell: pwsh
        run: npm --prefix src/DairyOS.Web ci

      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $programFiles = [Environment]::GetFolderPath("ProgramFiles")
          $pf86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $knownCandidates = @()
          foreach ($programFilesRoot in @($programFiles, $pf86)) {
            if ([string]::IsNullOrWhiteSpace($programFilesRoot)) {
              continue
            }
            foreach ($innoVersion in @("7", "6")) {
              $knownCandidates += Join-Path $programFilesRoot "Inno Setup $innoVersion\ISCC.exe"
            }
          }
          $known = $knownCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $known) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Unable to install Inno Setup." }
          }

      - name: Build certified desktop bundle
        shell: pwsh
        run: ./scripts/Build-DairyOS-Desktop.ps1

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/Build-DairyOS-Installer.ps1

      - name: Verify exact source and release manifest binding
        shell: pwsh
        run: |
          $head = (& git rev-parse HEAD).Trim()
          $tree = (& git rev-parse "HEAD^{tree}").Trim()
          $bundleManifestPath = Join-Path $PWD "dist\DairyOS-Release\DairyOS\release-manifest.json"
          $artifactManifestPath = Join-Path $PWD "dist\DairyOS-Release\DairyOS-Windows-Installer.release.json"
          foreach ($path in @($bundleManifestPath, $artifactManifestPath)) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Release manifest missing: $path" }
          }
          $bundleManifest = Get-Content $bundleManifestPath -Raw | ConvertFrom-Json
          $artifactManifest = Get-Content $artifactManifestPath -Raw | ConvertFrom-Json
          if ($bundleManifest.source_commit -ne $head -or $artifactManifest.source_commit -ne $head) { throw "Release manifest source commit does not equal HEAD." }
          if ($bundleManifest.source_tree -ne $tree -or $artifactManifest.source_tree -ne $tree) { throw "Release manifest source tree does not equal HEAD tree." }
          $desktopHash = (Get-FileHash (Join-Path $PWD "dist\DairyOS-Release\DairyOS\DairyOS.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          $backupHash = (Get-FileHash (Join-Path $PWD "dist\DairyOS-Release\DairyOS\DairyOSBackup.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerHash = (Get-FileHash (Join-Path $PWD "dist\DairyOS-Release\DairyOS-Windows-Installer.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bundleManifest.desktop_exe_sha256 -ne $desktopHash -or $artifactManifest.desktop_exe_sha256 -ne $desktopHash) { throw "DairyOS.exe hash is not bound consistently." }
          if ($bundleManifest.backup_exe_sha256 -ne $backupHash -or $artifactManifest.backup_exe_sha256 -ne $backupHash) { throw "DairyOSBackup.exe hash is not bound consistently." }
          if ($artifactManifest.installer_sha256 -ne $installerHash) { throw "Installer hash is not bound consistently." }
          Write-Host "EXACT SOURCE / BINARY / INSTALLER MANIFEST: PASS"

      - name: Certify silent install and keep-data uninstall
        shell: pwsh
        timeout-minutes: 8
        run: |
          $installer = Join-Path $PWD "dist\DairyOS-Release\DairyOS-Windows-Installer.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "DairyOS-Installer-Cert"
          $dataRoot = Join-Path $env:ProgramData "DairyOS"
          $marker = Join-Path $dataRoot "installer-certification-marker.txt"

          if (Test-Path $installRoot) { Remove-Item $installRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          Remove-Item $marker -Force -ErrorAction SilentlyContinue

          $setupArgs = @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$installRoot")
          $setup = Start-Process -FilePath $installer -ArgumentList $setupArgs -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Silent installer exited with code $($setup.ExitCode)." }

          # lifecycle.json is created by elevated Setup but is intentionally
          # mutable by the normal non-elevated DairyOS application runtime.
          $lifecyclePath = Join-Path $dataRoot "lifecycle.json"
          if (-not (Test-Path $lifecyclePath -PathType Leaf)) {
            throw "Installer did not provision lifecycle.json."
          }

          # The one-shot installation choice is created by elevated Setup,
          # then consumed by the ordinary packaged supervisor. Verify that
          # the runtime can clear/replace this control file without granting
          # it access to the database or other farm records.
          $pendingChoicePath = Join-Path $dataRoot "pending-installation-choice.json"
          if (-not (Test-Path $pendingChoicePath -PathType Leaf)) {
            throw "Installer did not provision pending installation choice."
          }

          $usersSid = "S-1-5-32-545"
          $modify = [System.Security.AccessControl.FileSystemRights]::Modify
          $lifecycleAllowsModify = $false

          foreach ($rule in (Get-Acl $lifecyclePath).Access) {
            try {
              $ruleSid = $rule.IdentityReference.Translate(
                [System.Security.Principal.SecurityIdentifier]
              ).Value
            }
            catch {
              continue
            }

            if (
              $ruleSid -eq $usersSid -and
              $rule.AccessControlType -eq
                [System.Security.AccessControl.AccessControlType]::Allow -and
              (($rule.FileSystemRights -band $modify) -eq $modify)
            ) {
              $lifecycleAllowsModify = $true
              break
            }
          }

          if (-not $lifecycleAllowsModify) {
            throw "Installed lifecycle.json is not modifiable by the built-in Users group."
          }

          Write-Host "LIFECYCLE MANIFEST ACL CERTIFICATION: PASS"

          $pendingChoiceAllowsModify = $false
          foreach ($rule in (Get-Acl $pendingChoicePath).Access) {
            try {
              $ruleSid = $rule.IdentityReference.Translate(
                [System.Security.Principal.SecurityIdentifier]
              ).Value
            }
            catch {
              continue
            }

            if (
              $ruleSid -eq $usersSid -and
              $rule.AccessControlType -eq
                [System.Security.AccessControl.AccessControlType]::Allow -and
              (($rule.FileSystemRights -band $modify) -eq $modify)
            ) {
              $pendingChoiceAllowsModify = $true
              break
            }
          }

          if (-not $pendingChoiceAllowsModify) {
            throw "Installed pending installation choice is not modifiable by the built-in Users group."
          }

          Write-Host "INSTALLATION CHOICE ACL CERTIFICATION: PASS"


          # Bootstrap the actual ProgramData private cluster before seeding any
          # operational storage fixtures. A non-empty storage tree is rightly
          # treated by the packaged startup-integrity gate as existing farm
          # state; the first preflight must therefore see a genuinely fresh
          # data root so it can create the application schema safely.
          $installedExe = Join-Path $installRoot "DairyOS.exe"
          $env:DAIRYOS_DATA_DIR = $dataRoot
          $programDataInstallationState = Join-Path $env:RUNNER_TEMP "DairyOS-ProgramData-installation-state.json"
          Remove-Item $programDataInstallationState -Force -ErrorAction SilentlyContinue
          $env:DAIRYOS_INSTALLATION_STATE = $programDataInstallationState
          $env:DAIRYOS_PREFLIGHT_REPORT = Join-Path $env:RUNNER_TEMP "dairyos-programdata-preflight.txt"
          Remove-Item $env:DAIRYOS_PREFLIGHT_REPORT -Force -ErrorAction SilentlyContinue
          $programDataPreflight = Start-Process -FilePath $installedExe -ArgumentList @("--database-preflight","--postgres-timeout","60") -PassThru
          if (-not $programDataPreflight.WaitForExit(180000)) {
            Stop-Process -Id $programDataPreflight.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $env:DAIRYOS_PREFLIGHT_REPORT -PathType Leaf) {
              Get-Content $env:DAIRYOS_PREFLIGHT_REPORT
            }
            throw "ProgramData database preflight exceeded 180 seconds."
          }
          $programDataPreflight.Refresh()
          if ($programDataPreflight.ExitCode -ne 0) {
            if (Test-Path $env:DAIRYOS_PREFLIGHT_REPORT -PathType Leaf) {
              Get-Content $env:DAIRYOS_PREFLIGHT_REPORT
            }
            throw "ProgramData database preflight failed with code $($programDataPreflight.ExitCode)."
          }
          Write-Host "PROGRAMDATA DATABASE PREFLIGHT: PASS"


          # Operational projections are written by the ordinary runtime. The
          # storage tree must remain writable after elevated Setup creates it,
          # including files that already existed before a later non-elevated
          # atomic replacement.
          $storageRoot = Join-Path $dataRoot "storage"
          $operationalInputs = Join-Path $storageRoot "operational_inputs.json"
          if (-not (Test-Path $storageRoot -PathType Container)) {
            throw "Installer did not provision DairyOS operational storage root."
          }
          if (-not (Test-Path $operationalInputs -PathType Leaf)) {
            '{"status":"SEEDED_BY_CERTIFICATION"}' | Set-Content -Path $operationalInputs -Encoding utf8
          }
          $storageAcl = Get-Acl $storageRoot
          $storageAllowsModify = $false
          foreach ($rule in $storageAcl.Access) {
            try {
              $ruleSid = $rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value
            } catch {
              continue
            }
            if (
              $ruleSid -eq $usersSid -and
              $rule.AccessControlType -eq [System.Security.AccessControl.AccessControlType]::Allow -and
              (($rule.FileSystemRights -band $modify) -eq $modify)
            ) {
              $storageAllowsModify = $true
              break
            }
          }
          if (-not $storageAllowsModify) {
            throw "Installed operational storage tree is not modifiable by the built-in Users group."
          }
          $storageFileAcl = Get-Acl $operationalInputs
          $storageFileAllowsModify = $false
          foreach ($rule in $storageFileAcl.Access) {
            try {
              $ruleSid = $rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value
            } catch {
              continue
            }
            if (
              $ruleSid -eq $usersSid -and
              $rule.AccessControlType -eq [System.Security.AccessControl.AccessControlType]::Allow -and
              (($rule.FileSystemRights -band $modify) -eq $modify)
            ) {
              $storageFileAllowsModify = $true
              break
            }
          }
          if (-not $storageFileAllowsModify) {
            throw "Existing operational_inputs.json is not modifiable by the built-in Users group."
          }
          Write-Host "OPERATIONAL STORAGE ACL CERTIFICATION: PASS"


          # Automatic backup runs with a limited user token. Certify that the
          # mutable backup tree and an existing elevated-created health file
          # are modifiable by built-in Users before exercising the task.
          $backupRoot = Join-Path $dataRoot "backups"
          $backupHealth = Join-Path $backupRoot "backup-health.json"
          if (-not (Test-Path $backupRoot -PathType Container)) {
            throw "Installer did not provision DairyOS backup root."
          }

          # Seed retained/elevated metadata to reproduce the real-world ACL
          # boundary that previously allowed dump creation but blocked atomic
          # health replacement.
          if (-not (Test-Path $backupHealth -PathType Leaf)) {
            '{"status":"SEEDED_BY_CERTIFICATION"}' | Set-Content -Path $backupHealth -Encoding utf8
          }

          $backupAcl = Get-Acl $backupRoot
          $backupAllowsModify = $false
          foreach ($rule in $backupAcl.Access) {
            try {
              $ruleSid = $rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value
            } catch {
              continue
            }
            if (
              $ruleSid -eq $usersSid -and
              $rule.AccessControlType -eq [System.Security.AccessControl.AccessControlType]::Allow -and
              (($rule.FileSystemRights -band $modify) -eq $modify)
            ) {
              $backupAllowsModify = $true
              break
            }
          }
          if (-not $backupAllowsModify) {
            throw "Installed backups tree is not modifiable by the built-in Users group."
          }

          $healthAcl = Get-Acl $backupHealth
          $healthAllowsModify = $false
          foreach ($rule in $healthAcl.Access) {
            try {
              $ruleSid = $rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value
            } catch {
              continue
            }
            if (
              $ruleSid -eq $usersSid -and
              $rule.AccessControlType -eq [System.Security.AccessControl.AccessControlType]::Allow -and
              (($rule.FileSystemRights -band $modify) -eq $modify)
            ) {
              $healthAllowsModify = $true
              break
            }
          }
          if (-not $healthAllowsModify) {
            throw "Existing backup-health.json is not modifiable by the built-in Users group."
          }
          Write-Host "BACKUP TREE ACL CERTIFICATION: PASS"

          $task = Get-ScheduledTask -TaskName "DairyOS-Automatic-Backup" -ErrorAction Stop
          $expectedBackupExe = Join-Path $installRoot "DairyOSBackup.exe"
          $actions = @($task.Actions)
          if ($actions.Count -ne 1) {
            throw "Automatic backup task must contain exactly one action; found $($actions.Count)."
          }
          $taskExecute = ([string]$actions[0].Execute).Trim('"')
          $taskArguments = ([string]$actions[0].Arguments).Trim()
          if ($taskExecute -ne $expectedBackupExe) {
            throw "Automatic backup task executable is malformed. Expected '$expectedBackupExe', got '$taskExecute'."
          }
          if ($taskArguments) {
            throw "Automatic backup task must not carry command-line arguments. Got: '$taskArguments'"
          }
          Write-Host "AUTOMATIC BACKUP TASK STRUCTURED ACTION: PASS"

          $required = @(
            (Join-Path $installRoot "DairyOS.exe"),
            (Join-Path $installRoot "DairyOSBackup.exe"),
            (Join-Path $installRoot "release-manifest.json"),
            (Join-Path $installRoot "runtime\PostgreSQL\bin\postgres.exe"),
            (Join-Path $installRoot "runtime\PostgreSQL\bin\pg_ctl.exe"),
            (Join-Path $installRoot "runtime\PostgreSQL\bin\initdb.exe"),
            (Join-Path $installRoot "runtime\PostgreSQL\bin\createdb.exe"),
            (Join-Path $installRoot "runtime\PostgreSQL\bin\psql.exe"),
            (Join-Path $installRoot "runtime\postgresql.version"),
            (Join-Path $installRoot "_internal\src\DairyOS.Web\dist\index.html")
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Installed DairyOS component is missing: $path" }
          }

          $installedManifest = Get-Content (Join-Path $installRoot "release-manifest.json") -Raw | ConvertFrom-Json
          $expectedHead = (& git rev-parse HEAD).Trim()
          if ($installedManifest.source_commit -ne $expectedHead) { throw "Installed release manifest source commit does not equal the certified checkout." }
          $installedDesktopHash = (Get-FileHash (Join-Path $installRoot "DairyOS.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installedManifest.desktop_exe_sha256 -ne $installedDesktopHash) { throw "Installed DairyOS.exe does not match its embedded release manifest." }

          $declaredVersion = (Get-Content (Join-Path $installRoot "runtime\postgresql.version") -Raw).Trim()
          $reportedVersionText = & (Join-Path $installRoot "runtime\PostgreSQL\bin\postgres.exe") --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Installed postgres.exe --version failed with code $LASTEXITCODE." }
          $versionMatch = [regex]::Match([string]$reportedVersionText, 'PostgreSQL\)?\s+([0-9]+(?:\.[0-9]+){1,3})', [Text.RegularExpressions.RegexOptions]::IgnoreCase)
          if (-not $versionMatch.Success) { throw "Unable to parse installed PostgreSQL version: $reportedVersionText" }
          if ($versionMatch.Groups[1].Value -ne $declaredVersion) {
            throw "Installed PostgreSQL version mismatch: binary=$($versionMatch.Groups[1].Value) declared=$declaredVersion"
          }

          # Use disposable farm state and deliberately poison inherited install
          # path variables. A frozen DairyOS.exe must locate its private
          # PostgreSQL beside itself, never through stale machine/session state.
          $certDataRoot = Join-Path $env:RUNNER_TEMP "DairyOS-Installed-Preflight-Data"
          $certInstallationState = Join-Path $env:RUNNER_TEMP "DairyOS-Installed-Preflight-installation-state.json"
          if (Test-Path $certDataRoot) { Remove-Item $certDataRoot -Recurse -Force }
          Remove-Item $certInstallationState -Force -ErrorAction SilentlyContinue
          $env:DAIRYOS_DATA_DIR = $certDataRoot
          $env:DAIRYOS_INSTALLATION_STATE = $certInstallationState
          $env:DAIRYOS_ENV = "production"
          $env:DAIRYOS_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP "STALE-DAIRYOS-INSTALL-ROOT"
          $env:DAIRYOS_PRIVATE_POSTGRES_RUNTIME = Join-Path $env:RUNNER_TEMP "STALE-POSTGRES-RUNTIME"
          $env:DAIRYOS_PREFLIGHT_REPORT = Join-Path $env:RUNNER_TEMP "dairyos-installed-preflight.txt"

          foreach ($cycle in 1..2) {
            Remove-Item $env:DAIRYOS_PREFLIGHT_REPORT -Force -ErrorAction SilentlyContinue
            $preflight = Start-Process -FilePath $installedExe -ArgumentList @("--database-preflight","--postgres-timeout","60") -PassThru
            if (-not $preflight.WaitForExit(180000)) {
              Stop-Process -Id $preflight.Id -Force -ErrorAction SilentlyContinue
              if (Test-Path $env:DAIRYOS_PREFLIGHT_REPORT -PathType Leaf) {
                Write-Host "=== INSTALLED DATABASE PREFLIGHT TIMEOUT DIAGNOSTIC ==="
                Get-Content $env:DAIRYOS_PREFLIGHT_REPORT
              }
              throw "Installed DairyOS database preflight cycle $cycle exceeded 180 seconds."
            }
            $preflight.Refresh()
            if ($preflight.ExitCode -ne 0) {
              if (Test-Path $env:DAIRYOS_PREFLIGHT_REPORT -PathType Leaf) {
                Write-Host "=== INSTALLED DATABASE PREFLIGHT DIAGNOSTIC ==="
                Get-Content $env:DAIRYOS_PREFLIGHT_REPORT
              }
              throw "Installed DairyOS database preflight cycle $cycle failed with code $($preflight.ExitCode)."
            }
          }

          $runtimeState = Join-Path $certDataRoot "postgres\runtime.json"
          $securityState = Join-Path $certDataRoot "postgres\security.json"
          $clusterVersion = Join-Path $certDataRoot "postgres\data\PG_VERSION"
          foreach ($path in @($runtimeState, $securityState, $clusterVersion)) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Installed DairyOS preflight did not persist required private database state: $path"
            }
          }

          $backupWorker = Join-Path $installRoot "DairyOSBackup.exe"
          $backupHealth = Join-Path $dataRoot "backups\backup-health.json"
          $beforeBackupWrite = if (Test-Path $backupHealth -PathType Leaf) {
            (Get-Item $backupHealth).LastWriteTimeUtc
          } else {
            [datetime]::MinValue
          }

          # Exercise the installed Scheduled Task itself. A direct worker run
          # cannot certify Task Scheduler action quoting or registration.
          $taskStartedAt = Get-Date
          Start-ScheduledTask -TaskName "DairyOS-Automatic-Backup"

          $deadline = (Get-Date).AddMinutes(3)
          do {
            Start-Sleep -Seconds 2
            $taskInfo = Get-ScheduledTaskInfo -TaskName "DairyOS-Automatic-Backup"
            $taskState = (Get-ScheduledTask -TaskName "DairyOS-Automatic-Backup").State
            if (
              $taskState -ne "Running" -and
              $taskInfo.LastRunTime -ge $taskStartedAt.AddSeconds(-2)
            ) {
              break
            }
          } while ((Get-Date) -lt $deadline)

          $taskInfo = Get-ScheduledTaskInfo -TaskName "DairyOS-Automatic-Backup"
          if ($taskInfo.LastRunTime -lt $taskStartedAt.AddSeconds(-2)) {
            throw "Installed DairyOS scheduled backup task did not run within the certification timeout."
          }
          if ($taskInfo.LastTaskResult -ne 0) {
            if (Test-Path $backupHealth -PathType Leaf) { Get-Content $backupHealth }
            throw "Installed DairyOS scheduled backup task failed with result $($taskInfo.LastTaskResult)."
          }
          if (-not (Test-Path $backupHealth -PathType Leaf)) {
            throw "Installed DairyOS scheduled backup task did not produce backup-health.json."
          }
          if ((Get-Item $backupHealth).LastWriteTimeUtc -le $beforeBackupWrite) {
            throw "Scheduled backup task completed without refreshing backup-health.json."
          }
          $backupHealthPayload = Get-Content $backupHealth -Raw | ConvertFrom-Json
          if ($backupHealthPayload.status -notin @("HEALTHY","DEGRADED")) {
            throw "Installed DairyOS backup protection is not successful: $($backupHealthPayload.status)"
          }
          Write-Host "INSTALLED SCHEDULED BACKUP EXECUTION: PASS"

          $programDataCluster = Join-Path $dataRoot "postgres"
          $programDataPgData = Join-Path $programDataCluster "data"
          $runtimeStatePath = Join-Path $programDataCluster "runtime.json"
          if (-not (Test-Path $runtimeStatePath -PathType Leaf)) {
            throw "ProgramData runtime.json missing before uninstall certification."
          }
          $runtimeState = Get-Content $runtimeStatePath -Raw | ConvertFrom-Json
          $programDataPort = [int]$runtimeState.port
          if ($programDataPort -lt 1 -or $programDataPort -gt 65535) {
            throw "ProgramData private PostgreSQL port is invalid: $programDataPort"
          }

          $pgCtl = Join-Path $installRoot "runtime\PostgreSQL\bin\pg_ctl.exe"
          $pgLog = Join-Path $env:RUNNER_TEMP "dairyos-uninstall-running-postgres.log"
          & $pgCtl -D $programDataPgData -l $pgLog -o "-p $programDataPort -h 127.0.0.1" -w -t 30 start
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $pgLog -PathType Leaf) { Get-Content $pgLog }
            throw "Unable to start ProgramData private PostgreSQL for running-uninstall certification."
          }
          if (-not (Test-Path (Join-Path $programDataPgData "postmaster.pid") -PathType Leaf)) {
            throw "Private PostgreSQL did not create postmaster.pid before uninstall certification."
          }

          # Create the keep-data sentinel only after the real ProgramData farm
          # has been initialized. Uninstall must leave ProgramData untouched.
          "preserve-me" | Set-Content -Path $marker -Encoding ascii
          if (-not (Test-Path $marker -PathType Leaf)) {
            throw "Unable to create ProgramData retention marker before uninstall."
          }

          $uninstaller = Join-Path $installRoot "unins000.exe"
          if (-not (Test-Path $uninstaller -PathType Leaf)) { throw "Inno Setup uninstaller is missing." }
          $uninstallLog = Join-Path $env:RUNNER_TEMP "dairyos-uninstall.log"
          Remove-Item $uninstallLog -Force -ErrorAction SilentlyContinue
          $uninstallArgs = @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$uninstallLog")
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList $uninstallArgs -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) {
            if (Test-Path $uninstallLog -PathType Leaf) {
              Write-Host "UNINSTALL LOG:" -ForegroundColor Yellow
              Get-Content $uninstallLog
            }
            throw "Silent uninstaller exited with code $($uninstall.ExitCode)."
          }

          if (Test-Path $installRoot) {
            $remaining = Get-ChildItem $installRoot -Force -ErrorAction SilentlyContinue
            if ($remaining) { throw "Application runtime remains after uninstall: $installRoot" }
          }
          if (Test-Path (Join-Path $programDataPgData "postmaster.pid") -PathType Leaf) {
            throw "Private PostgreSQL remained running after uninstall."
          }
          $task = schtasks.exe /Query /TN "DairyOS-Automatic-Backup" 2>&1
          $taskExit = $LASTEXITCODE
          if ($taskExit -eq 0) { throw "DairyOS automatic backup scheduled task remained after uninstall." }
          if (-not (Test-Path $marker -PathType Leaf)) { throw "DairyOS ProgramData marker was deleted by uninstall." }
          if ((Get-Content $marker -Raw).Trim() -ne "preserve-me") { throw "DairyOS ProgramData marker was altered by uninstall." }

          Remove-Item $marker -Force
          Write-Host "INSTALL / UNINSTALL KEEP-DATA CERTIFICATION: PASS"
          exit 0

      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DairyOS-Windows-Installer
          path: |
            dist/DairyOS-Release/DairyOS-Windows-Installer.exe
            dist/DairyOS-Release/DairyOS-Windows-Installer.release.json
          if-no-files-found: error
