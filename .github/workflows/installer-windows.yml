name: DairyOS Installer Windows

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  installer-windows-certification:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/DairyOS.Web/package-lock.json

      - name: Install Python project and desktop dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,test]"

      - name: Install frontend dependencies
        shell: pwsh
        run: npm --prefix src/DairyOS.Web ci

      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $pf86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $known = @(
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
            (Join-Path $pf86 "Inno Setup 7\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path $pf86 "Inno Setup 6\ISCC.exe")
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $known) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Unable to install Inno Setup." }
          }

      - name: Build certified desktop bundle
        shell: pwsh
        run: ./scripts/Build-DairyOS-Desktop.ps1

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/Build-DairyOS-Installer.ps1

      - name: Certify silent install and keep-data uninstall
        shell: pwsh
        timeout-minutes: 8
        run: |
          $installer = Join-Path $PWD "dist\DairyOS-Installer\DairyOS-Windows-Installer.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "DairyOS-Installer-Cert"
          $dataRoot = Join-Path $env:ProgramData "DairyOS"
          $marker = Join-Path $dataRoot "installer-certification-marker.txt"

          if (Test-Path $installRoot) { Remove-Item $installRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          "preserve-me" | Set-Content -Path $marker -Encoding ascii

          $setupArgs = @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$installRoot")
          $setup = Start-Process -FilePath $installer -ArgumentList $setupArgs -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Silent installer exited with code $($setup.ExitCode)." }

          $required = @(
            (Join-Path $installRoot "DairyOS.exe"),
            (Join-Path $installRoot "DairyOSBackup.exe"),
            (Join-Path $installRoot "DairyOS-Admin.exe"),
            (Join-Path $installRoot "runtime\PostgreSQL\bin\postgres.exe"),
            (Join-Path $installRoot "runtime\PostgreSQL\bin\pg_ctl.exe"),
            (Join-Path $installRoot "runtime\PostgreSQL\bin\initdb.exe"),
            (Join-Path $installRoot "runtime\PostgreSQL\bin\createdb.exe"),
            (Join-Path $installRoot "runtime\PostgreSQL\bin\psql.exe"),
            (Join-Path $installRoot "runtime\postgresql.version"),
            (Join-Path $installRoot "_internal\src\DairyOS.Web\dist\index.html")
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Installed DairyOS component is missing: $path" }
          }

          $adminHelp = & (Join-Path $installRoot "DairyOS-Admin.exe") --help 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Installed DairyOS-Admin.exe --help failed with code $LASTEXITCODE." }

          $declaredVersion = (Get-Content (Join-Path $installRoot "runtime\postgresql.version") -Raw).Trim()
          $reportedVersionText = & (Join-Path $installRoot "runtime\PostgreSQL\bin\postgres.exe") --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Installed postgres.exe --version failed with code $LASTEXITCODE." }
          $versionMatch = [regex]::Match([string]$reportedVersionText, 'PostgreSQL\)?\s+([0-9]+(?:\.[0-9]+){1,3})', [Text.RegularExpressions.RegexOptions]::IgnoreCase)
          if (-not $versionMatch.Success) { throw "Unable to parse installed PostgreSQL version: $reportedVersionText" }
          if ($versionMatch.Groups[1].Value -ne $declaredVersion) {
            throw "Installed PostgreSQL version mismatch: binary=$($versionMatch.Groups[1].Value) declared=$declaredVersion"
          }

          # Use disposable farm state and deliberately poison inherited install
          # path variables. A frozen DairyOS.exe must locate its private
          # PostgreSQL beside itself, never through stale machine/session state.
          $certDataRoot = Join-Path $env:RUNNER_TEMP "DairyOS-Installed-Preflight-Data"
          if (Test-Path $certDataRoot) { Remove-Item $certDataRoot -Recurse -Force }
          $env:DAIRYOS_DATA_DIR = $certDataRoot
          $env:DAIRYOS_ENV = "production"
          $env:DAIRYOS_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP "STALE-DAIRYOS-INSTALL-ROOT"
          $env:DAIRYOS_PRIVATE_POSTGRES_RUNTIME = Join-Path $env:RUNNER_TEMP "STALE-POSTGRES-RUNTIME"
          $env:DAIRYOS_PREFLIGHT_REPORT = Join-Path $env:RUNNER_TEMP "dairyos-installed-preflight.txt"

          $installedExe = Join-Path $installRoot "DairyOS.exe"
          foreach ($cycle in 1..2) {
            Remove-Item $env:DAIRYOS_PREFLIGHT_REPORT -Force -ErrorAction SilentlyContinue
            $preflight = Start-Process -FilePath $installedExe -ArgumentList @("--database-preflight","--postgres-timeout","60") -PassThru
            if (-not $preflight.WaitForExit(180000)) {
              Stop-Process -Id $preflight.Id -Force -ErrorAction SilentlyContinue
              if (Test-Path $env:DAIRYOS_PREFLIGHT_REPORT -PathType Leaf) {
                Write-Host "=== INSTALLED DATABASE PREFLIGHT TIMEOUT DIAGNOSTIC ==="
                Get-Content $env:DAIRYOS_PREFLIGHT_REPORT
              }
              throw "Installed DairyOS database preflight cycle $cycle exceeded 180 seconds."
            }
            $preflight.Refresh()
            if ($preflight.ExitCode -ne 0) {
              if (Test-Path $env:DAIRYOS_PREFLIGHT_REPORT -PathType Leaf) {
                Write-Host "=== INSTALLED DATABASE PREFLIGHT DIAGNOSTIC ==="
                Get-Content $env:DAIRYOS_PREFLIGHT_REPORT
              }
              throw "Installed DairyOS database preflight cycle $cycle failed with code $($preflight.ExitCode)."
            }
          }

          $runtimeState = Join-Path $certDataRoot "postgres\runtime.json"
          $securityState = Join-Path $certDataRoot "postgres\security.json"
          $clusterVersion = Join-Path $certDataRoot "postgres\data\PG_VERSION"
          foreach ($path in @($runtimeState, $securityState, $clusterVersion)) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Installed DairyOS preflight did not persist required private database state: $path"
            }
          }

          # Initialize the actual ProgramData private cluster through the
          # packaged DairyOS database path. Do not clone a PostgreSQL cluster
          # by filesystem copy: runtime/config state is bound to its data root.
          $env:DAIRYOS_DATA_DIR = $dataRoot
          $env:DAIRYOS_PREFLIGHT_REPORT = Join-Path $env:RUNNER_TEMP "dairyos-programdata-preflight.txt"
          Remove-Item $env:DAIRYOS_PREFLIGHT_REPORT -Force -ErrorAction SilentlyContinue
          $programDataPreflight = Start-Process -FilePath $installedExe -ArgumentList @("--database-preflight","--postgres-timeout","60") -PassThru
          if (-not $programDataPreflight.WaitForExit(180000)) {
            Stop-Process -Id $programDataPreflight.Id -Force -ErrorAction SilentlyContinue
            throw "ProgramData database preflight exceeded 180 seconds."
          }
          $programDataPreflight.Refresh()
          if ($programDataPreflight.ExitCode -ne 0) {
            if (Test-Path $env:DAIRYOS_PREFLIGHT_REPORT -PathType Leaf) {
              Get-Content $env:DAIRYOS_PREFLIGHT_REPORT
            }
            throw "ProgramData database preflight failed with code $($programDataPreflight.ExitCode)."
          }

          $programDataCluster = Join-Path $dataRoot "postgres"
          $programDataPgData = Join-Path $programDataCluster "data"
          $runtimeStatePath = Join-Path $programDataCluster "runtime.json"
          if (-not (Test-Path $runtimeStatePath -PathType Leaf)) {
            throw "ProgramData runtime.json missing before uninstall certification."
          }
          $runtimeState = Get-Content $runtimeStatePath -Raw | ConvertFrom-Json
          $programDataPort = [int]$runtimeState.port
          if ($programDataPort -lt 1 -or $programDataPort -gt 65535) {
            throw "ProgramData private PostgreSQL port is invalid: $programDataPort"
          }

          $pgCtl = Join-Path $installRoot "runtime\PostgreSQL\bin\pg_ctl.exe"
          $pgLog = Join-Path $env:RUNNER_TEMP "dairyos-uninstall-running-postgres.log"
          & $pgCtl -D $programDataPgData -l $pgLog -o "-p $programDataPort -h 127.0.0.1" -w -t 30 start
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $pgLog -PathType Leaf) { Get-Content $pgLog }
            throw "Unable to start ProgramData private PostgreSQL for running-uninstall certification."
          }
          if (-not (Test-Path (Join-Path $programDataPgData "postmaster.pid") -PathType Leaf)) {
            throw "Private PostgreSQL did not create postmaster.pid before uninstall certification."
          }

          $uninstaller = Join-Path $installRoot "unins000.exe"
          if (-not (Test-Path $uninstaller -PathType Leaf)) { throw "Inno Setup uninstaller is missing." }
          $uninstallArgs = @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART")
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList $uninstallArgs -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstaller exited with code $($uninstall.ExitCode)." }

          if (Test-Path $installRoot) {
            $remaining = Get-ChildItem $installRoot -Force -ErrorAction SilentlyContinue
            if ($remaining) { throw "Application runtime remains after uninstall: $installRoot" }
          }
          if (Test-Path (Join-Path $programDataPgData "postmaster.pid") -PathType Leaf) {
            throw "Private PostgreSQL remained running after uninstall."
          }
          $task = schtasks.exe /Query /TN "DairyOS-Automatic-Backup" 2>&1
          if ($LASTEXITCODE -eq 0) { throw "DairyOS automatic backup scheduled task remained after uninstall." }
          if (-not (Test-Path $marker -PathType Leaf)) { throw "DairyOS ProgramData marker was deleted by uninstall." }
          if ((Get-Content $marker -Raw).Trim() -ne "preserve-me") { throw "DairyOS ProgramData marker was altered by uninstall." }

          Remove-Item $marker -Force
          Write-Host "INSTALL / UNINSTALL DATA-PRESERVATION CERTIFICATION: PASS"

      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DairyOS-Windows-Installer
          path: dist/DairyOS-Installer/DairyOS-Windows-Installer.exe
          if-no-files-found: error
