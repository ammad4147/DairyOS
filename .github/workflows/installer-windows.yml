name: DairyOS Installer Windows

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  installer-windows-certification:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/DairyOS.Web/package-lock.json

      - name: Install Python project and desktop dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,test]"

      - name: Install frontend dependencies
        shell: pwsh
        run: npm --prefix src/DairyOS.Web ci

      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $programFiles = [Environment]::GetFolderPath("ProgramFiles")
          $pf86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $knownCandidates = @()
          foreach ($programFilesRoot in @($programFiles, $pf86)) {
            if ([string]::IsNullOrWhiteSpace($programFilesRoot)) {
              continue
            }
            foreach ($innoVersion in @("7", "6")) {
              $knownCandidates += Join-Path $programFilesRoot "Inno Setup $innoVersion\ISCC.exe"
            }
          }
          $known = $knownCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $known) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Unable to install Inno Setup." }
          }

      - name: Build certified desktop bundle
        shell: pwsh
        run: ./scripts/Build-DairyOS-Desktop.ps1

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/Build-DairyOS-Installer.ps1

      - name: Verify exact source and release manifest binding
        shell: pwsh
        run: |
          $head = (& git rev-parse HEAD).Trim()
          $tree = (& git rev-parse "HEAD^{tree}").Trim()
          $bundleManifestPath = Join-Path $PWD "dist\DairyOS-Release\DairyOS\release-manifest.json"
          $artifactManifestPath = Join-Path $PWD "dist\DairyOS-Release\DairyOS-Windows-Installer.release.json"
          foreach ($path in @($bundleManifestPath, $artifactManifestPath)) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Release manifest missing: $path" }
          }
          $bundleManifest = Get-Content $bundleManifestPath -Raw | ConvertFrom-Json
          $artifactManifest = Get-Content $artifactManifestPath -Raw | ConvertFrom-Json
          if ($bundleManifest.source_commit -ne $head -or $artifactManifest.source_commit -ne $head) { throw "Release manifest source commit does not equal HEAD." }
          if ($bundleManifest.source_tree -ne $tree -or $artifactManifest.source_tree -ne $tree) { throw "Release manifest source tree does not equal HEAD tree." }
          $desktopHash = (Get-FileHash (Join-Path $PWD "dist\DairyOS-Release\DairyOS\DairyOS.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          $backupHash = (Get-FileHash (Join-Path $PWD "dist\DairyOS-Release\DairyOS\DairyOSBackup.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerHash = (Get-FileHash (Join-Path $PWD "dist\DairyOS-Release\DairyOS-Windows-Installer.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bundleManifest.desktop_exe_sha256 -ne $desktopHash -or $artifactManifest.desktop_exe_sha256 -ne $desktopHash) { throw "DairyOS.exe hash is not bound consistently." }
          if ($bundleManifest.backup_exe_sha256 -ne $backupHash -or $artifactManifest.backup_exe_sha256 -ne $backupHash) { throw "DairyOSBackup.exe hash is not bound consistently." }
          if ($artifactManifest.installer_sha256 -ne $installerHash) { throw "Installer hash is not bound consistently." }
          Write-Host "EXACT SOURCE / BINARY / INSTALLER MANIFEST: PASS"

      - name: Certify simplified install and uninstall
        shell: pwsh
        timeout-minutes: 35
        run: |
          $installer = Join-Path $PWD "dist\DairyOS-Release\DairyOS-Windows-Installer.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "DairyOS-Installer-Simplified-Cert"
          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          $dataRoot = Join-Path $env:ProgramData "DairyOS"
          if ((Test-Path $dataRoot) -and (Get-ChildItem $dataRoot -Force | Select-Object -First 1)) {
            throw "Refusing to run installer lifecycle certification over existing ProgramData content: $dataRoot"
          }
          $setup = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR=' + $installRoot)) -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Silent installer exited with code $($setup.ExitCode)." }
          $installedExe = Join-Path $installRoot 'DairyOS.exe'
          if (-not (Test-Path $installedExe -PathType Leaf)) { throw 'Installed DairyOS.exe is missing.' }
          $taskXml = schtasks.exe /Query /TN 'DairyOS-Automatic-Backup' /XML 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'Automatic backup task was not registered.' }
          if (([string]$taskXml) -notmatch 'PT6H') { throw 'Automatic backup task is not configured for six-hour repetition.' }

          function Invoke-InstalledPreflight([string]$Label) {
            $preflight = Start-Process -FilePath $installedExe -ArgumentList @('--database-preflight','--postgres-timeout','60') -PassThru
            if (-not $preflight.WaitForExit(180000)) {
              Stop-Process -Id $preflight.Id -Force -ErrorAction SilentlyContinue
              throw "$Label installed database preflight exceeded 180 seconds."
            }
            if ($preflight.ExitCode -ne 0) { throw "$Label installed database preflight failed with code $($preflight.ExitCode)." }
            Write-Host "$Label INSTALLED RUNTIME PREFLIGHT: PASS"
          }

          Invoke-InstalledPreflight 'FIRST START'
          Invoke-InstalledPreflight 'SECOND START'

          # --- Checks ported from the retired "silent install and keep-data uninstall" step ---
          $usersSid = 'S-1-5-32-545'
          $modify = [System.Security.AccessControl.FileSystemRights]::Modify
          function Assert-UsersCanModify([string]$Path, [string]$Label) {
            foreach ($rule in (Get-Acl $Path).Access) {
              try { $ruleSid = $rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { continue }
              if ($ruleSid -eq $usersSid -and
                  $rule.AccessControlType -eq [System.Security.AccessControl.AccessControlType]::Allow -and
                  (($rule.FileSystemRights -band $modify) -eq $modify)) { return }
            }
            throw "$Label is not modifiable by the built-in Users group: $Path"
          }

          # lifecycle.json is created by elevated Setup but must stay mutable by
          # the ordinary non-elevated DairyOS runtime.
          $lifecycleJson = Join-Path $dataRoot 'lifecycle.json'
          if (-not (Test-Path $lifecycleJson -PathType Leaf)) { throw 'Installer did not provision lifecycle.json.' }
          Assert-UsersCanModify $lifecycleJson 'Installed lifecycle.json'
          Write-Host 'LIFECYCLE MANIFEST ACL CERTIFICATION: PASS'

          # Operational storage, including files that existed before a later
          # non-elevated atomic replacement, must remain writable.
          $storageRoot = Join-Path $dataRoot 'storage'
          if (-not (Test-Path $storageRoot -PathType Container)) { throw 'Installer did not provision DairyOS operational storage root.' }
          $operationalInputs = Join-Path $storageRoot 'operational_inputs.json'
          if (-not (Test-Path $operationalInputs -PathType Leaf)) { '{"status":"SEEDED_BY_CERTIFICATION"}' | Set-Content -Path $operationalInputs -Encoding utf8 }
          Assert-UsersCanModify $storageRoot 'Installed operational storage tree'
          Assert-UsersCanModify $operationalInputs 'Existing operational_inputs.json'
          Write-Host 'OPERATIONAL STORAGE ACL CERTIFICATION: PASS'

          # The automatic backup runs with a limited user token.
          $backupRoot = Join-Path $dataRoot 'backups'
          $backupHealth = Join-Path $backupRoot 'backup-health.json'
          if (-not (Test-Path $backupRoot -PathType Container)) { throw 'Installer did not provision DairyOS backup root.' }
          if (-not (Test-Path $backupHealth -PathType Leaf)) { '{"status":"SEEDED_BY_CERTIFICATION"}' | Set-Content -Path $backupHealth -Encoding utf8 }
          Assert-UsersCanModify $backupRoot 'Installed backups tree'
          Assert-UsersCanModify $backupHealth 'Existing backup-health.json'
          Write-Host 'BACKUP TREE ACL CERTIFICATION: PASS'

          $task = Get-ScheduledTask -TaskName 'DairyOS-Automatic-Backup' -ErrorAction Stop
          $expectedBackupExe = Join-Path $installRoot 'DairyOSBackup.exe'
          $actions = @($task.Actions)
          if ($actions.Count -ne 1) { throw "Automatic backup task must contain exactly one action; found $($actions.Count)." }
          $taskExecute = ([string]$actions[0].Execute).Trim('"')
          $taskArguments = ([string]$actions[0].Arguments).Trim()
          if ($taskExecute -ne $expectedBackupExe) { throw "Automatic backup task executable is malformed. Expected '$expectedBackupExe', got '$taskExecute'." }
          if ($taskArguments) { throw "Automatic backup task must not carry command-line arguments. Got: '$taskArguments'" }
          Write-Host 'AUTOMATIC BACKUP TASK STRUCTURED ACTION: PASS'

          foreach ($path in @(
            (Join-Path $installRoot 'DairyOS.exe'),
            (Join-Path $installRoot 'DairyOSBackup.exe'),
            (Join-Path $installRoot 'release-manifest.json'),
            (Join-Path $installRoot 'runtime\PostgreSQL\bin\postgres.exe'),
            (Join-Path $installRoot 'runtime\PostgreSQL\bin\pg_ctl.exe'),
            (Join-Path $installRoot 'runtime\PostgreSQL\bin\initdb.exe'),
            (Join-Path $installRoot 'runtime\PostgreSQL\bin\createdb.exe'),
            (Join-Path $installRoot 'runtime\PostgreSQL\bin\psql.exe'),
            (Join-Path $installRoot 'runtime\postgresql.version'),
            (Join-Path $installRoot '_internal\src\DairyOS.Web\dist\index.html')
          )) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Installed DairyOS component is missing: $path" }
          }
          $installedManifest = Get-Content (Join-Path $installRoot 'release-manifest.json') -Raw | ConvertFrom-Json
          $expectedHead = (& git rev-parse HEAD).Trim()
          if ($installedManifest.source_commit -ne $expectedHead) { throw 'Installed release manifest source commit does not equal the certified checkout.' }
          $installedDesktopHash = (Get-FileHash (Join-Path $installRoot 'DairyOS.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installedManifest.desktop_exe_sha256 -ne $installedDesktopHash) { throw 'Installed DairyOS.exe does not match its embedded release manifest.' }
          $declaredVersion = (Get-Content (Join-Path $installRoot 'runtime\postgresql.version') -Raw).Trim()
          $reportedVersionText = & (Join-Path $installRoot 'runtime\PostgreSQL\bin\postgres.exe') --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Installed postgres.exe --version failed with code $LASTEXITCODE." }
          $versionMatch = [regex]::Match([string]$reportedVersionText, 'PostgreSQL\)?\s+([0-9]+(?:\.[0-9]+){1,3})', [Text.RegularExpressions.RegexOptions]::IgnoreCase)
          if (-not $versionMatch.Success) { throw "Unable to parse installed PostgreSQL version: $reportedVersionText" }
          if ($versionMatch.Groups[1].Value -ne $declaredVersion) { throw "Installed PostgreSQL version mismatch: binary=$($versionMatch.Groups[1].Value) declared=$declaredVersion" }
          Write-Host 'INSTALLED COMPONENTS AND MANIFEST BINDING: PASS'

          # A frozen DairyOS.exe must find its private PostgreSQL beside itself,
          # never through stale install-path variables. Use a disposable data
          # root and restore the environment afterwards.
          $savedEnv = @{}
          foreach ($name in 'DAIRYOS_DATA_DIR','DAIRYOS_INSTALLATION_STATE','DAIRYOS_ENV','DAIRYOS_INSTALL_ROOT','DAIRYOS_PRIVATE_POSTGRES_RUNTIME','DAIRYOS_PREFLIGHT_REPORT') {
            $savedEnv[$name] = [Environment]::GetEnvironmentVariable($name, 'Process')
          }
          $certDataRoot = Join-Path $env:RUNNER_TEMP 'DairyOS-Installed-Preflight-Data'
          Remove-Item $certDataRoot -Recurse -Force -ErrorAction SilentlyContinue
          try {
            $env:DAIRYOS_DATA_DIR = $certDataRoot
            $env:DAIRYOS_INSTALLATION_STATE = Join-Path $env:RUNNER_TEMP 'DairyOS-Installed-Preflight-installation-state.json'
            $env:DAIRYOS_ENV = 'production'
            $env:DAIRYOS_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP 'STALE-DAIRYOS-INSTALL-ROOT'
            $env:DAIRYOS_PRIVATE_POSTGRES_RUNTIME = Join-Path $env:RUNNER_TEMP 'STALE-POSTGRES-RUNTIME'
            $env:DAIRYOS_PREFLIGHT_REPORT = Join-Path $env:RUNNER_TEMP 'dairyos-installed-preflight.txt'
            foreach ($cycle in 1..2) {
              Remove-Item $env:DAIRYOS_PREFLIGHT_REPORT -Force -ErrorAction SilentlyContinue
              $poisoned = Start-Process -FilePath $installedExe -ArgumentList @('--database-preflight','--postgres-timeout','60') -PassThru
              if (-not $poisoned.WaitForExit(180000)) {
                Stop-Process -Id $poisoned.Id -Force -ErrorAction SilentlyContinue
                if (Test-Path $env:DAIRYOS_PREFLIGHT_REPORT) { Get-Content $env:DAIRYOS_PREFLIGHT_REPORT }
                throw "Stale-environment preflight cycle $cycle exceeded 180 seconds."
              }
              $poisoned.Refresh()
              if ($poisoned.ExitCode -ne 0) {
                if (Test-Path $env:DAIRYOS_PREFLIGHT_REPORT) { Get-Content $env:DAIRYOS_PREFLIGHT_REPORT }
                throw "Stale-environment preflight cycle $cycle failed with code $($poisoned.ExitCode)."
              }
            }
            foreach ($path in @((Join-Path $certDataRoot 'postgres\runtime.json'), (Join-Path $certDataRoot 'postgres\security.json'), (Join-Path $certDataRoot 'postgres\data\PG_VERSION'))) {
              if (-not (Test-Path $path -PathType Leaf)) { throw "Stale-environment preflight did not persist private database state: $path" }
            }
            $certRuntime = Join-Path $certDataRoot 'postgres\data'
            if (Test-Path (Join-Path $certRuntime 'postmaster.pid')) {
              & (Join-Path $installRoot 'runtime\PostgreSQL\bin\pg_ctl.exe') -D $certRuntime stop -m fast -w -t 60 | Out-Host
            }
          } finally {
            foreach ($name in $savedEnv.Keys) { [Environment]::SetEnvironmentVariable($name, $savedEnv[$name], 'Process') }
          }
          Write-Host 'STALE-ENVIRONMENT INSTALLED PREFLIGHT: PASS'

          # Exercise the registered Scheduled Task itself; a direct worker run
          # cannot certify Task Scheduler action quoting or registration.
          $beforeBackupWrite = (Get-Item $backupHealth).LastWriteTimeUtc
          $taskStartedAt = Get-Date
          Start-ScheduledTask -TaskName 'DairyOS-Automatic-Backup'
          $taskDeadline = (Get-Date).AddMinutes(3)
          do {
            Start-Sleep -Seconds 2
            $taskInfo = Get-ScheduledTaskInfo -TaskName 'DairyOS-Automatic-Backup'
            $taskState = (Get-ScheduledTask -TaskName 'DairyOS-Automatic-Backup').State
            if ($taskState -ne 'Running' -and $taskInfo.LastRunTime -ge $taskStartedAt.AddSeconds(-2)) { break }
          } while ((Get-Date) -lt $taskDeadline)
          $taskInfo = Get-ScheduledTaskInfo -TaskName 'DairyOS-Automatic-Backup'
          if ($taskInfo.LastRunTime -lt $taskStartedAt.AddSeconds(-2)) { throw 'Installed DairyOS scheduled backup task did not run within the certification timeout.' }
          if ($taskInfo.LastTaskResult -ne 0) { Get-Content $backupHealth; throw "Installed DairyOS scheduled backup task failed with result $($taskInfo.LastTaskResult)." }
          if ((Get-Item $backupHealth).LastWriteTimeUtc -le $beforeBackupWrite) { throw 'Scheduled backup task completed without refreshing backup-health.json.' }
          $backupHealthPayload = Get-Content $backupHealth -Raw | ConvertFrom-Json
          if ($backupHealthPayload.status -notin @('HEALTHY','DEGRADED')) { throw "Installed DairyOS backup protection is not successful: $($backupHealthPayload.status)" }
          Write-Host 'INSTALLED SCHEDULED BACKUP EXECUTION: PASS'
          $marker = Join-Path $dataRoot 'lifecycle-certification-marker.txt'
          'preserve-me' | Set-Content -Path $marker -Encoding ascii
          $lifecyclePath = Join-Path $dataRoot 'lifecycle.json'
          if (-not (Test-Path $lifecyclePath -PathType Leaf)) { throw 'Installed lifecycle manifest is missing before uninstall.' }

          $uninstaller = Join-Path $installRoot 'unins000.exe'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'dairyos-simplified-uninstall.log'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/LOG=' + $uninstallLog)) -PassThru
          if (-not $uninstall.WaitForExit(120000)) {
            if (Test-Path $uninstallLog) { Get-Content $uninstallLog }
            Stop-Process -Id $uninstall.Id -Force -ErrorAction SilentlyContinue
            throw 'First installed uninstaller did not finish within 120 seconds.'
          }
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstaller exited with code $($uninstall.ExitCode)." }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $installRoot) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 1 }
          if (Test-Path $installRoot) { throw "Application runtime remains after uninstall: $installRoot" }
          $taskAfterUninstall = schtasks.exe /Query /TN 'DairyOS-Automatic-Backup' 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'DairyOS backup task remained after uninstall.' }
          if (-not (Test-Path $marker -PathType Leaf) -or -not (Test-Path $lifecyclePath -PathType Leaf)) { throw 'Uninstall failed to retain farm-data sentinel or lifecycle manifest.' }

          $reinstall = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR=' + $installRoot)) -PassThru -Wait
          if ($reinstall.ExitCode -ne 0) { throw "Reinstall over retained farm data exited with code $($reinstall.ExitCode)." }
          if (-not (Test-Path $installedExe -PathType Leaf)) { throw 'Reinstall did not restore DairyOS.exe.' }
          Invoke-InstalledPreflight 'REINSTALL'
          if ((Get-Content $marker -Raw).Trim() -ne 'preserve-me') { throw 'Reinstall altered retained farm data.' }

          # Exercise the durable recovery pg_ctl copy from ProgramData: the
          # package cluster stays active after offline backup; deleting only
          # the installed pg_ctl forces the uninstaller through its recovery path.
          $lifecycleBackup = Start-Process -FilePath $installedExe -ArgumentList @('--lifecycle','backup','--label','installer-certification') -PassThru
          if (-not $lifecycleBackup.WaitForExit(180000)) {
            Stop-Process -Id $lifecycleBackup.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged offline backup exceeded 180 seconds.'
          }
          if ($lifecycleBackup.ExitCode -ne 0) { throw "Packaged offline backup failed with code $($lifecycleBackup.ExitCode)." }
          $lifecycleLog = Join-Path $dataRoot 'logs\lifecycle-cli.log'
          if (-not (Test-Path $lifecycleLog -PathType Leaf) -or -not (Select-String -Path $lifecycleLog -Pattern 'finished with exit code 0' -Quiet)) { throw 'Packaged offline backup did not record its result in logs\lifecycle-cli.log.' }
          $recoveryRoot = Join-Path $env:ProgramData 'DairyOS-Recovery\PostgreSQL\bin'
          if (-not (Test-Path (Join-Path $recoveryRoot 'pg_ctl.exe') -PathType Leaf)) { throw "Recovery pg_ctl.exe is missing from $recoveryRoot." }
          if (Test-Path (Join-Path $dataRoot 'recovery')) { throw 'Recovery tools must never be placed inside the farm data root.' }
          $programFilesInBackups = Get-ChildItem (Join-Path $dataRoot 'backups') -Recurse -File -Include *.exe,*.dll -ErrorAction SilentlyContinue
          if ($programFilesInBackups) { throw "Farm backups contain program files: $($programFilesInBackups[0].FullName)" }
          Remove-Item (Join-Path $installRoot 'runtime\PostgreSQL\bin\pg_ctl.exe') -Force
          $uninstaller = Join-Path $installRoot 'unins000.exe'
          $recoveryUninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
          if (-not $recoveryUninstall.WaitForExit(120000)) {
            Stop-Process -Id $recoveryUninstall.Id -Force -ErrorAction SilentlyContinue
            throw 'Damaged-install recovery uninstaller did not finish within 120 seconds.'
          }
          if ($recoveryUninstall.ExitCode -ne 0) { throw "Damaged-install recovery uninstall exited with code $($recoveryUninstall.ExitCode)." }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $installRoot) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 1 }
          if (Test-Path $installRoot) { throw "Application runtime remains after damaged-install uninstall: $installRoot" }
          if ((Get-Content $marker -Raw).Trim() -ne 'preserve-me') { throw 'Damaged-install uninstall altered retained farm data.' }
          Write-Host 'DAMAGED PG_CTL, RUNNING CLUSTER: PASS'

          $dataDir = Join-Path $dataRoot 'postgres\data'
          $pidFile = Join-Path $dataDir 'postmaster.pid'
          $installedPgCtl = Join-Path $installRoot 'runtime\PostgreSQL\bin\pg_ctl.exe'

          function Invoke-Reinstall([string]$Label) {
            $step = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR=' + $installRoot)) -PassThru -Wait
            if ($step.ExitCode -ne 0) { throw "$Label reinstall exited with code $($step.ExitCode)." }
            Invoke-InstalledPreflight $Label
            if ((Get-Content $marker -Raw).Trim() -ne 'preserve-me') { throw "$Label reinstall altered retained farm data." }
          }

          function Stop-PrivateCluster([string]$Label) {
            if (Test-Path $pidFile -PathType Leaf) {
              & $installedPgCtl -D $dataDir stop -m fast -w -t 60 | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "$Label could not stop the private cluster." }
            }
            if (Test-Path $pidFile -PathType Leaf) { throw "$Label private cluster still has postmaster.pid after stop." }
          }

          function Invoke-DamagedUninstall([string]$Label) {
            Remove-Item $installedPgCtl -Force
            $log = Join-Path $env:RUNNER_TEMP ("dairyos-" + $Label.ToLowerInvariant().Replace(' ', '-') + "-uninstall.log")
            $run = Start-Process -FilePath (Join-Path $installRoot 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/LOG=' + $log)) -PassThru
            if (-not $run.WaitForExit(120000)) {
              if (Test-Path $log) { Get-Content $log }
              Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue
              throw "$Label uninstaller did not finish within 120 seconds."
            }
            if ($run.ExitCode -ne 0) { if (Test-Path $log) { Get-Content $log }; throw "$Label uninstall exited with code $($run.ExitCode)." }
            $deadline = (Get-Date).AddSeconds(30)
            while ((Test-Path $installRoot) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 1 }
            if (Test-Path $installRoot) { throw "$Label left the application runtime behind: $installRoot" }
            if ((Get-Content $marker -Raw).Trim() -ne 'preserve-me') { throw "$Label uninstall altered retained farm data." }
            if (-not (Test-Path $lifecyclePath -PathType Leaf)) { throw "$Label uninstall removed the lifecycle manifest." }
          }

          # Stopped cluster: pg_ctl.exe missing, nothing running, no PID file.
          Invoke-Reinstall 'STOPPED CLUSTER'
          Stop-PrivateCluster 'STOPPED CLUSTER'
          Invoke-DamagedUninstall 'STOPPED CLUSTER'
          Write-Host 'DAMAGED PG_CTL, STOPPED CLUSTER: PASS'

          # Stale marker: cluster stopped but an interrupted launch left a
          # postmaster.pid naming a process that does not exist. The uninstaller
          # may remove it only after pg_ctl status independently reports stopped.
          Invoke-Reinstall 'STALE MARKER'
          Stop-PrivateCluster 'STALE MARKER'
          @('999999', $dataDir, '0', '0', '', '', '', 'stopped') | Set-Content -Path $pidFile -Encoding ascii
          Invoke-DamagedUninstall 'STALE MARKER'
          if (Test-Path $pidFile -PathType Leaf) { throw 'Stale postmaster.pid was not recovered by the uninstaller.' }
          Write-Host 'DAMAGED PG_CTL, STALE POSTMASTER.PID: PASS'

          # Retained data must still start cleanly after all damaged uninstalls.
          Invoke-Reinstall 'FINAL'

          # Canonical data collision: a data root holding farm state that is not
          # tied to any DairyOS installation must make Setup fail closed. Uninstall
          # keeps farm data, so set the certified root aside and present a root
          # that holds only an unowned file.
          $finalUninstall = Start-Process -FilePath (Join-Path $installRoot 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
          if (-not $finalUninstall.WaitForExit(120000)) { Stop-Process -Id $finalUninstall.Id -Force -ErrorAction SilentlyContinue; throw 'Final uninstaller did not finish within 120 seconds.' }
          if ($finalUninstall.ExitCode -ne 0) { throw "Final uninstall exited with code $($finalUninstall.ExitCode)." }
          $heldRoot = Join-Path $env:ProgramData 'DairyOS-Certification-Held'
          Remove-Item $heldRoot -Recurse -Force -ErrorAction SilentlyContinue
          Move-Item -Path $dataRoot -Destination $heldRoot
          New-Item -ItemType Directory -Path $dataRoot -Force | Out-Null
          $unowned = Join-Path $dataRoot 'unowned-farm-state.txt'
          'preserve-me' | Set-Content -Path $unowned -Encoding ascii
          $collisionInstallRoot = Join-Path $env:RUNNER_TEMP 'DairyOS-Collision-Rejected'
          Remove-Item $collisionInstallRoot -Recurse -Force -ErrorAction SilentlyContinue
          $siblingRootsBefore = @(Get-ChildItem -Path $env:ProgramData -Directory -Filter 'DairyOS-New-*' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          $collisionLog = Join-Path $env:RUNNER_TEMP 'dairyos-collision-install.log'
          $collisionSetup = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR=' + $collisionInstallRoot),('/LOG=' + $collisionLog)) -PassThru -Wait
          if ($collisionSetup.ExitCode -eq 0) { if (Test-Path $collisionLog) { Get-Content $collisionLog }; throw 'Installer accepted a populated canonical DairyOS data root.' }
          if (-not (Test-Path $unowned -PathType Leaf) -or (Get-Content $unowned -Raw).Trim() -ne 'preserve-me') { throw 'Rejected collision install deleted or altered unowned farm state.' }
          $newSiblingRoots = @(Get-ChildItem -Path $env:ProgramData -Directory -Filter 'DairyOS-New-*' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Where-Object { $_ -notin $siblingRootsBefore })
          if ($newSiblingRoots.Count -ne 0) { throw "Rejected collision install allocated alternate DairyOS data root: $($newSiblingRoots -join ', ')" }
          if ((Test-Path $collisionInstallRoot) -and @(Get-ChildItem -Path $collisionInstallRoot -Force -ErrorAction SilentlyContinue).Count -ne 0) { throw "Rejected collision install left application files behind at $collisionInstallRoot" }
          Remove-Item $dataRoot -Recurse -Force
          Move-Item -Path $heldRoot -Destination $dataRoot
          Write-Host 'CANONICAL DATA COLLISION FAIL-CLOSED CERTIFICATION: PASS'
          Write-Host 'INSTALL / FIRST-SECOND START / KEEP-DATA UNINSTALL / REINSTALL / DAMAGED-PG_CTL RUNNING-STOPPED-STALE: PASS'
          @(
            '## DairyOS installed lifecycle checks',
            '- Passed: install, first/second/reinstall database preflight, keep-data uninstall, reinstall data retention, offline backup with logged result, recovery tools outside the farm data root, no program files in farm backups.',
            '- Passed: damaged installed `pg_ctl.exe` uninstall with the private cluster running, stopped, and with a stale `postmaster.pid`; retained data restarts afterwards.',
            '- Passed: lifecycle manifest, storage and backup tree ACLs; scheduled backup task structure and execution; installed components and manifest binding; stale-environment preflight; canonical data collision fail-closed.',
            '- Not run: interactive UI open/close/relaunch and rendered Animal Timeline acceptance.'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          $global:LASTEXITCODE = 0

      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DairyOS-Windows-Installer
          path: |
            dist/DairyOS-Release/DairyOS-Windows-Installer.exe
            dist/DairyOS-Release/DairyOS-Windows-Installer.release.json
          if-no-files-found: error
