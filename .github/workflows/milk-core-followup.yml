name: Milk Core Follow-up

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix_milk_core_followup:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dairyos
          POSTGRES_PASSWORD: dairyos
          POSTGRES_DB: dairyos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dairyos -d dairyos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DAIRYOS_DATABASE_URL: "postgresql+psycopg://dairyos:dairyos@127.0.0.1:5432/dairyos_test"
      DAIRYOS_DB_NAME: dairyos_test
      PYTHONPATH: src
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded Milk core follow-up corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          repo = Path("src/dairyos/data/repositories/milk_production_repository.py")
          text = repo.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?m)^(?P<i>\s*)if str\(getattr\(existing, "status", ""\) or ""\)\.upper\(\) == "VOID":\n'
              r'(?P=i)    existing\.status = "RECORDED"\n'
          )
          def replace_void_reactivation(match):
              indent = match.group("i")
              return (
                  f'{indent}if str(getattr(existing, "status", "") or "").upper() == "VOID":\n'
                  f'{indent}    # A voided ledger row is immutable audit history. Release its\n'
                  f'{indent}    # governed-day slot and persist the replacement as a new row.\n'
                  f'{indent}    existing.session_ledger = False\n'
                  f'{indent}    if self.session:\n'
                  f'{indent}        self.session.commit()\n'
                  f'{indent}    production.calculate_total()\n'
                  f'{indent}    return self.add(production)\n'
              )
          text2, count = pattern.subn(replace_void_reactivation, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one MilkProductionRepository VOID reactivation block, found {count}")
          repo.write_text(text2, encoding="utf-8")

          api = Path("src/dairyos/api/milk_traceability.py")
          text = api.read_text(encoding="utf-8")
          old = (
              '    record.notes = _append_void_note(record.notes, request.reason, snapshot)\n'
              '    record.morning_yield = None\n'
          )
          new = (
              '    record.notes = _append_void_note(record.notes, request.reason, snapshot)\n'
              '    # Keep the VOID row permanently visible as audit history while releasing\n'
              '    # the unique governed-day slot for a future replacement row.\n'
              '    record.session_ledger = False\n'
              '    record.morning_yield = None\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"Expected one milk VOID mutation block, found {text.count(old)}")
          api.write_text(text.replace(old, new, 1), encoding="utf-8")

          modal = Path("src/DairyOS.Web/src/components/AnimalPassportModal.tsx")
          text = modal.read_text(encoding="utf-8")
          old_start = " const load=async()=>{if(isNew)return;setLoading(true);setError('');try{const [a,p,d,h,t,v]=await Promise.all(["
          if text.count(old_start) != 1:
              raise SystemExit(f"Expected one AnimalPassportModal aggregate load function, found {text.count(old_start)}")
          pattern = re.compile(
              r" const load=async\(\)=>\{if\(isNew\)return;setLoading\(true\);setError\(''\);try\{const \[a,p,d,h,t,v\]=await Promise\.all\(\[.*?\]\);if\(!a\.ok\)throw new Error\(`Unable to load animal \(\$\{a\.status\}\)`\);if\(!p\.ok\)throw new Error\(`Unable to load lifetime passport \(\$\{p\.status\}\)`\);const animalData=await a\.json\(\) as BackendAnimal;setAnimal\(animalData\);setPassport\(await p\.json\(\)\);setExits\(d\.ok\?await d\.json\(\):\[\]\);setPassportHealth\(\{observations:h\.ok\?await h\.json\(\):null,treatments:t\.ok\?await t\.json\(\):null,vaccinations:v\.ok\?await v\.json\(\):\[\]\}\);setForm\((?P<form>\{.*?\})\)\}catch\(e\)\{setError\(e instanceof Error\?e\.message:'Unable to load passport'\)\}finally\{setLoading\(false\)\}\};",
              re.S,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit("AnimalPassportModal load function shape did not match expected source")
          form = match.group("form")
          replacement = (
              " const load=async()=>{if(isNew)return;setLoading(true);setError('');try{"
              "const [a,p]=await Promise.all([fetch(`${API_BASE}/farm/animals/${encodeURIComponent(animalId)}`),fetch(`${API_BASE}/farm/animals/${encodeURIComponent(animalId)}/passport`)]);"
              "if(!a.ok)throw new Error(`Unable to load animal (${a.status})`);if(!p.ok)throw new Error(`Unable to load lifetime passport (${p.status})`);"
              "const animalData=await a.json() as BackendAnimal;setAnimal(animalData);setPassport(await p.json());"
              "const safeFetch=async(url:string)=>{try{return await fetch(url)}catch{return null}};"
              "const [d,h,t,v]=await Promise.all([safeFetch(`${API_BASE}/farm/animals/${encodeURIComponent(animalId)}/disposition-history`),safeFetch(`${API_BASE}/farm/animals/${encodeURIComponent(animalId)}/health`),safeFetch(`${API_BASE}/farm/animals/${encodeURIComponent(animalId)}/treatments`),safeFetch(`${API_BASE}/farm/animals/${encodeURIComponent(animalId)}/vaccinations`)]);"
              "setExits(d?.ok?await d.json():[]);setPassportHealth({observations:h?.ok?await h.json():null,treatments:t?.ok?await t.json():null,vaccinations:v?.ok?await v.json():[]});"
              f"setForm({form})"
              "}catch(e){setError(e instanceof Error?e.message:'Unable to load passport')}finally{setLoading(false)}};"
          )
          modal.write_text(text[:match.start()] + replacement + text[match.end():], encoding="utf-8")
          PY

      - name: Add focused regression contracts
        run: |
          cat > tests/remediation/test_milk_core_followup_contract.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8-sig")

          def test_voided_milk_row_is_not_reactivated_in_place():
              source = read("src/dairyos/data/repositories/milk_production_repository.py")
              assert 'existing.status = "RECORDED"' not in source
              assert "existing.session_ledger = False" in source
              assert "return self.add(production)" in source

          def test_void_releases_governed_slot_but_preserves_audit_row():
              source = read("src/dairyos/api/milk_traceability.py")
              block = source[source.index("def void_milk_production"):source.index('@router.post("/dispositions")')]
              assert "record.session_ledger = False" in block
              assert 'record.status = "VOID"' in block
              assert "_append_void_note" in block

          def test_passport_core_does_not_depend_on_ancillary_fetches():
              source = read("src/DairyOS.Web/src/components/AnimalPassportModal.tsx")
              assert "const [a,p]=await Promise.all" in source
              assert "const safeFetch=async(url:string)" in source
              assert "setPassport(await p.json())" in source
              assert "const [a,p,d,h,t,v]=await Promise.all" not in source
          PY

      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run focused Milk core regression
        run: |
          python -m pytest -q tests/remediation/test_milk_core_closure_contract.py tests/remediation/test_milk_core_followup_contract.py tests/milk/test_animal_session_authority_remediation.py tests/api/test_animal_passport.py tests/api/test_milk_reconciliation_crud.py

      - name: Run full backend regression
        run: python -m pytest -q tests

      - name: Build frontend
        working-directory: src/DairyOS.Web
        run: |
          npm ci
          npm run build

      - name: Validate diff
        run: git diff --check

      - name: Remove temporary workflow and commit bounded follow-up
        run: |
          rm .github/workflows/milk-core-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dairyos/data/repositories/milk_production_repository.py
          git add src/dairyos/api/milk_traceability.py
          git add src/DairyOS.Web/src/components/AnimalPassportModal.tsx
          git add tests/remediation/test_milk_core_followup_contract.py
          git add .github/workflows/milk-core-followup.yml
          git commit -m "fix(milk): preserve void audit history and passport availability"
          git push origin HEAD:main
