name: Milk Core Follow-up

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix_milk_core_followup:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dairyos
          POSTGRES_PASSWORD: dairyos
          POSTGRES_DB: dairyos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dairyos -d dairyos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DAIRYOS_DATABASE_URL: "postgresql+psycopg://dairyos:dairyos@127.0.0.1:5432/dairyos_test"
      DAIRYOS_DB_NAME: dairyos_test
      PYTHONPATH: src
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded Milk core follow-up corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          repo = Path("src/dairyos/data/repositories/milk_production_repository.py")
          text = repo.read_text(encoding="utf-8")
          old = '''        if str(getattr(existing, "status", "") or "").upper() == "VOID":
              existing.status = "RECORDED"
          '''
          new = '''        if str(getattr(existing, "status", "") or "").upper() == "VOID":
              # A voided ledger row is immutable audit history. Release its
              # governed-day slot and persist the replacement as a new row.
              existing.session_ledger = False
              if self.session:
                  self.session.commit()
              production.calculate_total()
              return self.add(production)
          '''
          if old not in text:
              raise SystemExit("Expected MilkProductionRepository VOID reactivation block not found")
          repo.write_text(text.replace(old, new, 1), encoding="utf-8")

          api = Path("src/dairyos/api/milk_traceability.py")
          text = api.read_text(encoding="utf-8")
          old = '''    record.notes = _append_void_note(record.notes, request.reason, snapshot)
              record.morning_yield = None
          '''
          new = '''    record.notes = _append_void_note(record.notes, request.reason, snapshot)
              # Keep the VOID row permanently visible as audit history while releasing
              # the unique governed-day slot for a future replacement row.
              record.session_ledger = False
              record.morning_yield = None
          '''
          if old not in text:
              raise SystemExit("Expected milk VOID mutation block not found")
          api.write_text(text.replace(old, new, 1), encoding="utf-8")

          modal = Path("src/DairyOS.Web/src/components/AnimalPassportModal.tsx")
          text = modal.read_text(encoding="utf-8")
          pattern = re.compile(r" const load=async\(\)=>\{.*?\};\n useEffect\(\(\)=>\{void load\(\)\},\[animalId\]\);", re.S)
          replacement = ''' const load=async()=>{if(isNew)return;setLoading(true);setError('');try{const [a,p]=await Promise.all([fetch(`${API_BASE}/farm/animals/${encodeURIComponent(animalId)}`),fetch(`${API_BASE}/farm/animals/${encodeURIComponent(animalId)}/passport`)]);if(!a.ok)throw new Error(`Unable to load animal (${a.status})`);if(!p.ok)throw new Error(`Unable to load lifetime passport (${p.status})`);const animalData=await a.json() as BackendAnimal;setAnimal(animalData);setPassport(await p.json());const safeFetch=async(url:string)=>{try{return await fetch(url)}catch{return null}};const [d,h,t,v]=await Promise.all([safeFetch(`${API_BASE}/farm/animals/${encodeURIComponent(animalId)}/disposition-history`),safeFetch(`${API_BASE}/farm/animals/${encodeURIComponent(animalId)}/health`),safeFetch(`${API_BASE}/farm/animals/${encodeURIComponent(animalId)}/treatments`),safeFetch(`${API_BASE}/farm/animals/${encodeURIComponent(animalId)}/vaccinations`)]);setExits(d?.ok?await d.json():[]);setPassportHealth({observations:h?.ok?await h.json():null,treatments:t?.ok?await t.json():null,vaccinations:v?.ok?await v.json():[]});setForm({category:animalData.animal_category||'Unclassified',breed:animalData.breed||'',birthDate:animalData.date_of_birth||'',acquisitionDate:animalData.date_of_acquisition||'',sire:animalData.sire_id||'',dam:animalData.dam_id||'',rfid:animalData.rfid||'',frequency:animalData.milking_frequency||'TWICE_DAILY',legacyId:animalData.legacy_animal_id||'',earTag:animalData.ear_tag||'',location:animalData.location||'',productionGroup:animalData.production_group||''})}catch(e){setError(e instanceof Error?e.message:'Unable to load passport')}finally{setLoading(false)}};
          useEffect(()=>{void load()},[animalId]);'''
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one AnimalPassportModal load function, found {count}")
          modal.write_text(text2, encoding="utf-8")
          PY

      - name: Add focused regression contracts
        run: |
          cat > tests/remediation/test_milk_core_followup_contract.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8-sig")

          def test_voided_milk_row_is_not_reactivated_in_place():
              source = read("src/dairyos/data/repositories/milk_production_repository.py")
              assert 'existing.status = "RECORDED"' not in source
              assert "existing.session_ledger = False" in source
              assert "return self.add(production)" in source

          def test_void_releases_governed_slot_but_preserves_audit_row():
              source = read("src/dairyos/api/milk_traceability.py")
              block = source[source.index("def void_milk_production"):source.index('@router.post("/dispositions")')]
              assert "record.session_ledger = False" in block
              assert 'record.status = "VOID"' in block
              assert "_append_void_note" in block

          def test_passport_core_does_not_depend_on_ancillary_fetches():
              source = read("src/DairyOS.Web/src/components/AnimalPassportModal.tsx")
              assert "const [a,p]=await Promise.all" in source
              assert "const safeFetch=async(url:string)" in source
              assert "setPassport(await p.json())" in source
          PY

      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run focused Milk core regression
        run: |
          python -m pytest -q tests/remediation/test_milk_core_closure_contract.py tests/remediation/test_milk_core_followup_contract.py tests/milk/test_animal_session_authority_remediation.py tests/api/test_animal_passport.py tests/api/test_milk_reconciliation_crud.py

      - name: Run full backend regression
        run: python -m pytest -q tests

      - name: Build frontend
        working-directory: src/DairyOS.Web
        run: |
          npm ci
          npm run build

      - name: Validate diff
        run: git diff --check

      - name: Remove temporary workflow and commit bounded follow-up
        run: |
          rm .github/workflows/milk-core-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dairyos/data/repositories/milk_production_repository.py
          git add src/dairyos/api/milk_traceability.py
          git add src/DairyOS.Web/src/components/AnimalPassportModal.tsx
          git add tests/remediation/test_milk_core_followup_contract.py
          git add .github/workflows/milk-core-followup.yml
          git commit -m "fix(milk): preserve void audit history and passport availability"
          git push origin HEAD:main
