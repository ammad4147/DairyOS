name: Remote Production Extremes Diff Cleanup

on:
  push:
    branches:
      - fix/production-extremes-milking-cohorts
    paths:
      - .github/workflows/remote-production-extremes-diff-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-extremes-milking-cohorts
          fetch-depth: 0

      - name: Rebuild dashboard client from baseline while preserving newline style
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          BASE = 'e0173fcdbdc720afbc31f91977918abd76c9d3bb'
          path = 'src/DairyOS.Web/src/api/commandDashboardClient.ts'
          raw = subprocess.check_output(['git', 'show', f'{BASE}:{path}'])
          text = raw.decode('utf-8')
          nl = '\r\n' if '\r\n' in text else '\n'

          def block(lines):
              return nl.join(lines)

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              block([
                  '  productionExtremes: {',
                  '    highest: PerformerItem[];',
                  '    lowest: PerformerItem[];',
                  '  };',
              ]),
              block([
                  '  productionExtremes: {',
                  '    highest: PerformerItem[];',
                  '    lowest: PerformerItem[];',
                  '    cohorts: {',
                  '      THRICE_DAILY: { highest: PerformerItem[]; lowest: PerformerItem[] };',
                  '      TWICE_DAILY: { highest: PerformerItem[]; lowest: PerformerItem[] };',
                  '    };',
                  '  };',
              ]),
          )

          replace_once(
              block([
                  '  productionExtremes: {',
                  '    highest: [],',
                  '    lowest: [],',
                  '  },',
              ]),
              block([
                  '  productionExtremes: {',
                  '    highest: [],',
                  '    lowest: [],',
                  '    cohorts: {',
                  '      THRICE_DAILY: { highest: [], lowest: [] },',
                  '      TWICE_DAILY: { highest: [], lowest: [] },',
                  '    },',
                  '  },',
              ]),
          )

          old = block([
              '    productionExtremes: {',
              '      highest:',
              '        Array.isArray(',
              '          productionExtremes.highest,',
              '        )',
              '          ? productionExtremes.highest.map(',
              '              (item: any) => ({',
              '                id: String(',
              '                  item?.animal_id || "",',
              '                ),',
              '                yield: Number(',
              '                  item?.total_litres || 0,',
              '                ),',
              '              }),',
              '            )',
              '          : [],',
              '',
              '      lowest:',
              '        Array.isArray(',
              '          productionExtremes.lowest,',
              '        )',
              '          ? productionExtremes.lowest.map(',
              '              (item: any) => ({',
              '                id: String(',
              '                  item?.animal_id || "",',
              '                ),',
              '                yield: Number(',
              '                  item?.total_litres || 0,',
              '                ),',
              '              }),',
              '            )',
              '          : [],',
              '    },',
          ])
          new = block([
              '    productionExtremes: {',
              '      highest:',
              '        Array.isArray(productionExtremes.highest)',
              '          ? productionExtremes.highest.map((item: any) => ({',
              '              id: String(item?.animal_id || ""),',
              '              yield: Number(item?.total_litres || 0),',
              '            }))',
              '          : [],',
              '      lowest:',
              '        Array.isArray(productionExtremes.lowest)',
              '          ? productionExtremes.lowest.map((item: any) => ({',
              '              id: String(item?.animal_id || ""),',
              '              yield: Number(item?.total_litres || 0),',
              '            }))',
              '          : [],',
              '      cohorts: {',
              '        THRICE_DAILY: {',
              '          highest: Array.isArray(productionExtremes.cohorts?.THRICE_DAILY?.highest)',
              '            ? productionExtremes.cohorts.THRICE_DAILY.highest.map((item: any) => ({',
              '                id: String(item?.animal_id || ""),',
              '                yield: Number(item?.total_litres || 0),',
              '              }))',
              '            : [],',
              '          lowest: Array.isArray(productionExtremes.cohorts?.THRICE_DAILY?.lowest)',
              '            ? productionExtremes.cohorts.THRICE_DAILY.lowest.map((item: any) => ({',
              '                id: String(item?.animal_id || ""),',
              '                yield: Number(item?.total_litres || 0),',
              '              }))',
              '            : [],',
              '        },',
              '        TWICE_DAILY: {',
              '          highest: Array.isArray(productionExtremes.cohorts?.TWICE_DAILY?.highest)',
              '            ? productionExtremes.cohorts.TWICE_DAILY.highest.map((item: any) => ({',
              '                id: String(item?.animal_id || ""),',
              '                yield: Number(item?.total_litres || 0),',
              '              }))',
              '            : [],',
              '          lowest: Array.isArray(productionExtremes.cohorts?.TWICE_DAILY?.lowest)',
              '            ? productionExtremes.cohorts.TWICE_DAILY.lowest.map((item: any) => ({',
              '                id: String(item?.animal_id || ""),',
              '                yield: Number(item?.total_litres || 0),',
              '              }))',
              '            : [],',
              '        },',
              '      },',
              '    },',
          ])
          replace_once(old, new)

          Path(path).write_bytes(text.encode('utf-8'))
          PY

      - name: Confirm diff is scoped
        shell: bash
        run: |
          git diff --numstat e0173fcdbdc720afbc31f91977918abd76c9d3bb -- src/DairyOS.Web/src/api/commandDashboardClient.ts
          additions=$(git diff --numstat e0173fcdbdc720afbc31f91977918abd76c9d3bb -- src/DairyOS.Web/src/api/commandDashboardClient.ts | awk '{print $1}')
          deletions=$(git diff --numstat e0173fcdbdc720afbc31f91977918abd76c9d3bb -- src/DairyOS.Web/src/api/commandDashboardClient.ts | awk '{print $2}')
          test "$additions" -lt 120
          test "$deletions" -lt 80

      - name: Commit cleanup and remove staging workflow
        shell: bash
        run: |
          rm .github/workflows/remote-production-extremes-diff-cleanup.yml
          git config user.name "DairyOS Remediation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/DairyOS.Web/src/api/commandDashboardClient.ts .github/workflows/remote-production-extremes-diff-cleanup.yml
          git commit -m "chore: keep production extremes diff scoped"
          git push origin HEAD:fix/production-extremes-milking-cohorts
