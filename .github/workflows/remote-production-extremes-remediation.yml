name: Remote Production Extremes Remediation

on:
  push:
    branches:
      - fix/production-extremes-milking-cohorts
    paths:
      - .github/workflows/remote-production-extremes-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-extremes-milking-cohorts
          fetch-depth: 0

      - name: Apply frequency-cohort remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Backend: classify complete animal-days independently by governed frequency.
          path = Path("src/dairyos/api/milk_production_analytics.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def _production_extremes(\n")
          end = text.index("\n\ndef _yield_drop_watchlist(\n", start)
          new_function = '''def _production_extremes(
              *,
              service: MilkProductionTrendIntelligenceService,
              records,
              animals,
              histories,
              target_date: date,
          ) -> dict:
              """Return complete-day production extremes by governed milking frequency.

              Twice-daily and thrice-daily animals are deliberately never ranked in the
              same population. Each cohort independently uses its most recent completed
              production day within the prior week, so an incomplete thrice-daily day
              cannot appear artificially low beside a completed twice-daily animal-day.
              """

              def classify(snapshots, selected_date):
                  ordered = sorted(
                      snapshots,
                      key=lambda item: float(item.get("total_litres") or 0.0),
                  )

                  # Production Extremes must be mutually exclusive. The Dashboard
                  # displays whole litres, so classification uses the same displayed
                  # litre band rather than allowing visually identical values to
                  # appear in both Highest and Lowest.
                  def displayed_litre_band(item) -> int:
                      litres = float(item.get("total_litres") or 0.0)
                      return int(litres + 0.5)

                  yield_bands = sorted(
                      {displayed_litre_band(item) for item in ordered}
                  )

                  lowest_bands: set[int] = set()
                  highest_bands: set[int] = set()

                  if len(yield_bands) > 1:
                      split = len(yield_bands) // 2

                      if len(yield_bands) % 2:
                          lowest_bands = set(yield_bands[:split])
                          highest_bands = set(yield_bands[split + 1:])
                      else:
                          lowest_bands = set(yield_bands[:split])
                          highest_bands = set(yield_bands[split:])

                  highest = [
                      item
                      for item in reversed(ordered)
                      if displayed_litre_band(item) in highest_bands
                  ]
                  lowest = [
                      item
                      for item in ordered
                      if displayed_litre_band(item) in lowest_bands
                  ]

                  return {
                      "highest": highest,
                      "lowest": lowest,
                      "population_count": len(ordered),
                      "production_date": (
                          selected_date.isoformat() if selected_date else None
                      ),
                      "data_status": "LIVE_PERSISTED_DATA" if ordered else "NO_DATA",
                  }

              cohorts: dict[str, dict] = {}

              for frequency in ("THRICE_DAILY", "TWICE_DAILY"):
                  selected_date = None
                  snapshots = []

                  for offset in range(0, 7):
                      candidate_date = target_date - timedelta(days=offset)
                      candidate = []

                      for animal in animals:
                          animal_id = str(getattr(animal, "animal_id", ""))
                          snapshot = service._daily_animal_snapshot(
                              records,
                              animal,
                              histories.get(animal_id, []),
                              candidate_date,
                          )
                          if snapshot is None or not bool(snapshot.get("complete")):
                              continue

                          snapshot_frequency = snapshot.get("frequency")
                          snapshot_frequency = getattr(
                              snapshot_frequency,
                              "value",
                              snapshot_frequency,
                          )
                          if str(snapshot_frequency or "").upper() != frequency:
                              continue

                          if float(snapshot.get("total_litres") or 0.0) <= 0.0:
                              continue

                          candidate.append(snapshot)

                      if candidate:
                          selected_date = candidate_date
                          snapshots = candidate
                          break

                  cohorts[frequency] = classify(snapshots, selected_date)

              # Preserve the legacy top-level shape for callers that have not yet
              # adopted cohort selection. The Dashboard defaults to Thrice Milking.
              default = cohorts["THRICE_DAILY"]
              return {
                  **default,
                  "frequency": "THRICE_DAILY",
                  "cohorts": cohorts,
              }
          '''
          path.write_text(text[:start] + new_function + text[end:], encoding="utf-8")

          # Frontend data contract: retain legacy top-level extremes and expose both cohorts.
          path = Path("src/DairyOS.Web/src/api/commandDashboardClient.ts")
          replace_once(
              path,
              '''  productionExtremes: {\n    highest: PerformerItem[];\n    lowest: PerformerItem[];\n  };''',
              '''  productionExtremes: {\n    highest: PerformerItem[];\n    lowest: PerformerItem[];\n    cohorts: {\n      THRICE_DAILY: { highest: PerformerItem[]; lowest: PerformerItem[] };\n      TWICE_DAILY: { highest: PerformerItem[]; lowest: PerformerItem[] };\n    };\n  };''',
          )
          replace_once(
              path,
              '''  productionExtremes: {\n    highest: [],\n    lowest: [],\n  },''',
              '''  productionExtremes: {\n    highest: [],\n    lowest: [],\n    cohorts: {\n      THRICE_DAILY: { highest: [], lowest: [] },\n      TWICE_DAILY: { highest: [], lowest: [] },\n    },\n  },''',
          )

          old_return = '''    productionExtremes: {\n      highest:\n        Array.isArray(\n          productionExtremes.highest,\n        )\n          ? productionExtremes.highest.map(\n              (item: any) => ({\n                id: String(\n                  item?.animal_id || "",\n                ),\n                yield: Number(\n                  item?.total_litres || 0,\n                ),\n              }),\n            )\n          : [],\n\n      lowest:\n        Array.isArray(\n          productionExtremes.lowest,\n        )\n          ? productionExtremes.lowest.map(\n              (item: any) => ({\n                id: String(\n                  item?.animal_id || "",\n                ),\n                yield: Number(\n                  item?.total_litres || 0,\n                ),\n              }),\n            )\n          : [],\n    },'''
          new_return = '''    productionExtremes: {\n      highest:\n        Array.isArray(productionExtremes.highest)\n          ? productionExtremes.highest.map((item: any) => ({\n              id: String(item?.animal_id || ""),\n              yield: Number(item?.total_litres || 0),\n            }))\n          : [],\n      lowest:\n        Array.isArray(productionExtremes.lowest)\n          ? productionExtremes.lowest.map((item: any) => ({\n              id: String(item?.animal_id || ""),\n              yield: Number(item?.total_litres || 0),\n            }))\n          : [],\n      cohorts: {\n        THRICE_DAILY: {\n          highest: Array.isArray(productionExtremes.cohorts?.THRICE_DAILY?.highest)\n            ? productionExtremes.cohorts.THRICE_DAILY.highest.map((item: any) => ({\n                id: String(item?.animal_id || ""),\n                yield: Number(item?.total_litres || 0),\n              }))\n            : [],\n          lowest: Array.isArray(productionExtremes.cohorts?.THRICE_DAILY?.lowest)\n            ? productionExtremes.cohorts.THRICE_DAILY.lowest.map((item: any) => ({\n                id: String(item?.animal_id || ""),\n                yield: Number(item?.total_litres || 0),\n              }))\n            : [],\n        },\n        TWICE_DAILY: {\n          highest: Array.isArray(productionExtremes.cohorts?.TWICE_DAILY?.highest)\n            ? productionExtremes.cohorts.TWICE_DAILY.highest.map((item: any) => ({\n                id: String(item?.animal_id || ""),\n                yield: Number(item?.total_litres || 0),\n              }))\n            : [],\n          lowest: Array.isArray(productionExtremes.cohorts?.TWICE_DAILY?.lowest)\n            ? productionExtremes.cohorts.TWICE_DAILY.lowest.map((item: any) => ({\n                id: String(item?.animal_id || ""),\n                yield: Number(item?.total_litres || 0),\n              }))\n            : [],\n        },\n      },\n    },'''
          replace_once(path, old_return, new_return)

          # Dashboard: add in-card cohort tabs, preserve the card dimensions and ID/Liters rows.
          path = Path("src/DairyOS.Web/src/components/UnifiedDashboard.tsx")
          replace_once(
              path,
              '''  const [extremesCount, setExtremesCount] = useState(3);''',
              '''  const [extremesCount, setExtremesCount] = useState(3);\n  const [productionExtremesFrequency, setProductionExtremesFrequency] = useState<\n    'THRICE_DAILY' | 'TWICE_DAILY'\n  >('THRICE_DAILY');''',
          )
          replace_once(
              path,
              '''  const allTopPerformers = Array.isArray(data?.topPerformers) ? data.topPerformers : [];\n  const allBottomPerformers = Array.isArray(data?.bottomPerformers) ? data.bottomPerformers : [];''',
              '''  const selectedProductionExtremes =\n    data?.productionExtremes?.cohorts?.[productionExtremesFrequency] ??\n    data?.productionExtremes;\n  const allTopPerformers = Array.isArray(selectedProductionExtremes?.highest)\n    ? selectedProductionExtremes.highest\n    : [];\n  const allBottomPerformers = Array.isArray(selectedProductionExtremes?.lowest)\n    ? selectedProductionExtremes.lowest\n    : [];''',
          )

          old_card = '''          <div className="cmd-card" style={{flex:'0.9 1 0',...cardBase}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}><span\n  onClick={() => setExpandedMilkList('PRODUCTION_EXTREMES')}\n  title="Open complete Production Extremes"\n  style={{\n    display:'flex',\n    alignItems:'center',\n    gap:6,\n    color:'#34d399',\n    fontWeight:800,\n    fontSize:12,\n    cursor:'pointer',\n    textDecoration:'underline',\n  }}\n><Sparkles size={15}/> Production Extremes</span><select\n  value={Math.min(extremesCount, Math.max(maximumExtremePopulation, 1))}\n  onChange={e=>setExtremesCount(Number(e.target.value))}\n  disabled={maximumExtremePopulation === 0}\n  style={selectStyle}\n>{extremesOptions.map(n=><option key={n} value={n}>{n}</option>)}</select></div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,flex:1,minHeight:0,overflowY:'auto'}}><ExtremeList title="Highest" rows={displayedTop} color="#34d399" onOpen={openPassportHandler}/><ExtremeList title="Lowest" rows={displayedBottom} color="#f87171" onOpen={openPassportHandler}/></div></div>'''
          new_card = '''          <div className="cmd-card" style={{...cardBase,flex:'0.9 1 0',display:'flex',flexDirection:'column'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}><span\n  onClick={() => setExpandedMilkList('PRODUCTION_EXTREMES')}\n  title="Open complete Production Extremes"\n  style={{\n    display:'flex',\n    alignItems:'center',\n    gap:6,\n    color:'#34d399',\n    fontWeight:800,\n    fontSize:12,\n    cursor:'pointer',\n    textDecoration:'underline',\n  }}\n><Sparkles size={15}/> Production Extremes</span><select\n  value={Math.min(extremesCount, Math.max(maximumExtremePopulation, 1))}\n  onChange={e=>setExtremesCount(Number(e.target.value))}\n  disabled={maximumExtremePopulation === 0}\n  style={selectStyle}\n>{extremesOptions.map(n=><option key={n} value={n}>{n}</option>)}</select></div><div role="tablist" aria-label="Production extremes milking frequency" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4,marginBottom:5,flex:'0 0 auto'}}>{([['THRICE_DAILY','Thrice Milking'],['TWICE_DAILY','Twice Milking']] as const).map(([frequency,label])=><button key={frequency} type="button" role="tab" aria-selected={productionExtremesFrequency===frequency} onClick={()=>setProductionExtremesFrequency(frequency)} style={{border:productionExtremesFrequency===frequency?'1px solid #38bdf8':'1px solid #334155',background:productionExtremesFrequency===frequency?'rgba(56,189,248,.16)':'#111827',color:productionExtremesFrequency===frequency?'#7dd3fc':'#94a3b8',borderRadius:4,padding:'3px 4px',fontSize:8,fontWeight:800,cursor:'pointer',whiteSpace:'nowrap'}}>{label}</button>)}</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,flex:1,minHeight:0,overflowY:'auto'}}><ExtremeList title="Highest" rows={displayedTop} color="#34d399" onOpen={openPassportHandler}/><ExtremeList title="Lowest" rows={displayedBottom} color="#f87171" onOpen={openPassportHandler}/></div></div>'''
          replace_once(path, old_card, new_card)

          replace_once(
              path,
              '''              Complete non-overlapping production populations''',
              '''              {productionExtremesFrequency === 'THRICE_DAILY' ? 'Thrice Milking' : 'Twice Milking'} · complete non-overlapping production population''',
          )

          # Focused backend regression tests.
          test_path = Path("tests/test_production_extremes_milking_frequency_cohorts.py")
          test_path.write_text('''from datetime import date\nfrom types import SimpleNamespace\n\nfrom dairyos.api.milk_production_analytics import _production_extremes\n\n\nclass FakeTrendService:\n    def __init__(self, rows):\n        self.rows = rows\n\n    def _daily_animal_snapshot(self, records, animal, histories, target_date):\n        return self.rows.get((animal.animal_id, target_date.isoformat()))\n\n\ndef snapshot(animal_id, day, frequency, litres, *, complete=True):\n    return {\n        "animal_id": animal_id,\n        "date": day,\n        "frequency": frequency,\n        "complete": complete,\n        "missing_sessions": [] if complete else ["EVENING"],\n        "total_litres": litres,\n    }\n\n\ndef test_extremes_segregate_twice_and_thrice_and_exclude_incomplete_days():\n    day = date(2026, 9, 13)\n    animals = [SimpleNamespace(animal_id=value) for value in ("T1", "T2", "T3", "W1", "W2")]\n    rows = {\n        ("T1", day.isoformat()): snapshot("T1", day.isoformat(), "THRICE_DAILY", 31),\n        ("T2", day.isoformat()): snapshot("T2", day.isoformat(), "THRICE_DAILY", 24),\n        ("T3", day.isoformat()): snapshot("T3", day.isoformat(), "THRICE_DAILY", 5, complete=False),\n        ("W1", day.isoformat()): snapshot("W1", day.isoformat(), "TWICE_DAILY", 21),\n        ("W2", day.isoformat()): snapshot("W2", day.isoformat(), "TWICE_DAILY", 14),\n    }\n\n    result = _production_extremes(\n        service=FakeTrendService(rows),\n        records=[],\n        animals=animals,\n        histories={},\n        target_date=day,\n    )\n\n    thrice = result["cohorts"]["THRICE_DAILY"]\n    twice = result["cohorts"]["TWICE_DAILY"]\n\n    assert thrice["population_count"] == 2\n    assert twice["population_count"] == 2\n    assert {row["animal_id"] for row in thrice["highest"] + thrice["lowest"]} == {"T1", "T2"}\n    assert {row["animal_id"] for row in twice["highest"] + twice["lowest"]} == {"W1", "W2"}\n    assert "T3" not in {row["animal_id"] for row in thrice["highest"] + thrice["lowest"]}\n    assert result["highest"] == thrice["highest"]\n    assert result["lowest"] == thrice["lowest"]\n\n\ndef test_each_frequency_uses_its_own_latest_completed_production_day():\n    today = date(2026, 9, 13)\n    yesterday = date(2026, 9, 12)\n    animals = [SimpleNamespace(animal_id=value) for value in ("T1", "T2", "W1", "W2")]\n    rows = {\n        ("T1", today.isoformat()): snapshot("T1", today.isoformat(), "THRICE_DAILY", 20, complete=False),\n        ("T2", today.isoformat()): snapshot("T2", today.isoformat(), "THRICE_DAILY", 18, complete=False),\n        ("T1", yesterday.isoformat()): snapshot("T1", yesterday.isoformat(), "THRICE_DAILY", 30),\n        ("T2", yesterday.isoformat()): snapshot("T2", yesterday.isoformat(), "THRICE_DAILY", 24),\n        ("W1", today.isoformat()): snapshot("W1", today.isoformat(), "TWICE_DAILY", 22),\n        ("W2", today.isoformat()): snapshot("W2", today.isoformat(), "TWICE_DAILY", 16),\n    }\n\n    result = _production_extremes(\n        service=FakeTrendService(rows),\n        records=[],\n        animals=animals,\n        histories={},\n        target_date=today,\n    )\n\n    assert result["cohorts"]["THRICE_DAILY"]["production_date"] == yesterday.isoformat()\n    assert result["cohorts"]["TWICE_DAILY"]["production_date"] == today.isoformat()\n''', encoding="utf-8")

          # Lightweight UI/data-contract regression guard.
          test_path = Path("tests/test_dashboard_production_extremes_tabs_contract.py")
          test_path.write_text('''from pathlib import Path\n\n\ndef test_dashboard_has_frequency_tabs_inside_existing_production_extremes_surface():\n    source = Path("src/DairyOS.Web/src/components/UnifiedDashboard.tsx").read_text(encoding="utf-8")\n    assert "Thrice Milking" in source\n    assert "Twice Milking" in source\n    assert "productionExtremesFrequency" in source\n    assert "THRICE_DAILY" in source\n    assert "TWICE_DAILY" in source\n    assert 'title="Highest" rows={displayedTop}' in source\n    assert 'title="Lowest" rows={displayedBottom}' in source\n\n\ndef test_dashboard_client_maps_both_frequency_cohorts():\n    source = Path("src/DairyOS.Web/src/api/commandDashboardClient.ts").read_text(encoding="utf-8")\n    assert "productionExtremes.cohorts?.THRICE_DAILY?.highest" in source\n    assert "productionExtremes.cohorts?.TWICE_DAILY?.highest" in source\n    assert "productionExtremes.cohorts?.THRICE_DAILY?.lowest" in source\n    assert "productionExtremes.cohorts?.TWICE_DAILY?.lowest" in source\n''', encoding="utf-8")
          PY

      - name: Sanity-check patched source
        shell: bash
        run: |
          python -m compileall -q src/dairyos/api/milk_production_analytics.py
          python - <<'PY'
          from pathlib import Path
          backend = Path('src/dairyos/api/milk_production_analytics.py').read_text(encoding='utf-8')
          ui = Path('src/DairyOS.Web/src/components/UnifiedDashboard.tsx').read_text(encoding='utf-8')
          client = Path('src/DairyOS.Web/src/api/commandDashboardClient.ts').read_text(encoding='utf-8')
          assert '"cohorts": cohorts' in backend
          assert 'not bool(snapshot.get("complete"))' in backend
          assert 'Thrice Milking' in ui and 'Twice Milking' in ui
          assert 'cohorts?.THRICE_DAILY' in client and 'cohorts?.TWICE_DAILY' in client
          PY

      - name: Commit remediation and remove staging workflow
        shell: bash
        run: |
          rm .github/workflows/remote-production-extremes-remediation.yml
          git config user.name "DairyOS Remediation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/dairyos/api/milk_production_analytics.py \
                  src/DairyOS.Web/src/api/commandDashboardClient.ts \
                  src/DairyOS.Web/src/components/UnifiedDashboard.tsx \
                  tests/test_production_extremes_milking_frequency_cohorts.py \
                  tests/test_dashboard_production_extremes_tabs_contract.py \
                  .github/workflows/remote-production-extremes-remediation.yml
          git commit -m "fix: segregate production extremes by milking frequency"
          git push origin HEAD:fix/production-extremes-milking-cohorts
