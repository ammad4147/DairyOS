name: DairyOS Admin PostgreSQL

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  admin-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dairyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dairyos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DAIRYOS_DB_HOST: localhost
      DAIRYOS_DB_PORT: "5432"
      DAIRYOS_DB_NAME: dairyos
      DAIRYOS_DB_USER: postgres
      DAIRYOS_DB_PASSWORD: postgres
      DAIRYOS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dairyos
      PGCONNECT_TIMEOUT: "10"
      DAIRYOS_ENV: development
      DAIRYOS_ADMIN_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install project and test runner
        run: python -m pip install --upgrade pip && pip install -e . pytest httpx2

      - name: Bootstrap runtime schema
        run: >-
          python -c "import dairyos.app; from dairyos.data.database.session import Base, engine; Base.metadata.create_all(engine)"

      - name: Run real Admin Reset and restore verification
        run: pytest -q -s tests/admin/test_admin_postgres_integration.py
