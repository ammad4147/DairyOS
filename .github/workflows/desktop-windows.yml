name: DairyOS Desktop Windows

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  desktop-windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/DairyOS.Web/package-lock.json

      - name: Install Python project and desktop dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,test]"

      - name: Install frontend dependencies
        shell: pwsh
        run: npm --prefix src/DairyOS.Web ci

      - name: Build certified desktop release bundle
        shell: pwsh
        run: ./scripts/Build-DairyOS-Desktop.ps1

      - name: Verify packaged runtime excludes Admin Tool source surface
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "dist\\DairyOS-Release\\DairyOS"
          $adminPatterns = @(
            (Join-Path $bundle "_internal\\dairyos\\admin"),
            (Join-Path $bundle "dairyos\\admin")
          )
          foreach ($path in $adminPatterns) {
            if (Test-Path $path) {
              throw "Destructive Admin Tool surface unexpectedly present in desktop bundle: $path"
            }
          }

      - name: Publish DairyOS desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: DairyOS-Desktop-Windows
          path: dist/DairyOS-Release/DairyOS/
          if-no-files-found: error
