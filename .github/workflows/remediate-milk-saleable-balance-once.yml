name: One-shot milk saleable balance remediation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remediate-milk-saleable-balance-once.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded Milk UI remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/DairyOS.Web/src/components/MilkTab.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '  unaccounted_litres: number | null;\n  over_accounted_litres: number | null;',
                  '  unaccounted_litres: number | null;\n  unaccounted_saleable_litres?: number | null;\n  over_accounted_litres: number | null;',
                  'reconciliation saleable field',
              ),
              (
                  "  const monthRecon =\n    monthProduced -\n    monthSold -\n    monthDomestic -\n    monthCalves -\n    monthWastage;",
                  "  const monthRecon =\n    dailyRecon.reduce(\n      (sum, row) =>\n        sum +\n        Number(\n          row.unaccounted_saleable_litres ||\n            0,\n        ),\n      0,\n    );",
                  'authoritative monthly reconciliation',
              ),
              (
                  "        await request('/farm/milk', {",
                  "        const saved = await request<\n          ProductionRow | {\n            record?: ProductionRow;\n            data?: ProductionRow;\n          }\n        >('/farm/milk', {",
                  'capture milk save response',
              ),
              (
                  "        setMessage(\n          `Milk production recorded for ${productionAnimal}.`,\n        );",
                  "        const savedStatus = String(\n          'status' in saved\n            ? saved.status\n            : saved.record?.status ??\n                saved.data?.status ??\n                '',\n        ).toUpperCase();\n\n        setMessage(\n          savedStatus === 'WITHDRAWAL'\n            ? `Withdrawal active — ${productionAnimal} milk recorded for animal history only and excluded from saleable milk.`\n            : `Milk production recorded for ${productionAnimal}.`,\n        );",
                  'withdrawal production notice',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Source assertions
        shell: bash
        run: |
          grep -F "unaccounted_saleable_litres?: number | null" src/DairyOS.Web/src/components/MilkTab.tsx
          grep -F "savedStatus === 'WITHDRAWAL'" src/DairyOS.Web/src/components/MilkTab.tsx
          grep -F "dailyRecon.reduce(" src/DairyOS.Web/src/components/MilkTab.tsx
          grep -F 'unbacked_disposition_litres' src/dairyos/farm/production/services/milk_inventory_capacity_service.py
          git diff --check

      - name: Focused backend regression
        run: python -m pytest -q tests/milk/test_milk_inventory_capacity_service.py

      - name: Frontend production build
        working-directory: src/DairyOS.Web
        run: |
          npm ci
          npm run build

      - name: Commit remediation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/remediate-milk-saleable-balance-once.yml
          git add src/DairyOS.Web/src/components/MilkTab.tsx .github/workflows/remediate-milk-saleable-balance-once.yml
          git commit -m "fix: align Milk reconciliation with saleable inventory"
          git push origin main
