# DairyOS capability knowledge: Dashboard, findings, Analytics, Reporting, Settings, data protection, Assistant.
collection: dairyos
domain: platform
records:
- id: dashboard.cards
  kind: CONCEPT
  title: What the Dashboard shows
  questions:
  - What does the dashboard show?
  - average yield milking animals meaning
  - what is total adults
  keywords: [dashboard, cards, herd strength, average yield, farm yield trend, production extremes, receivables]
  summary: The Dashboard is a command view built from the governed records; herd category counts, milking animals, average yield, cost of milk per litre, receivables, yield-drop watchlist, production extremes, farm yield trend, unreconciled milk, health, vaccinations due and reproductive status, plus quick data entry.
  location: Dashboard tab
  facts:
  - Average Yield is shown for milking animals and for the total herd.
  - The farm yield trend can be viewed over 7 days, 30 days, 3 months, 6 months or 1 year (default 7 days).
  - Reproductive Health shows inseminated and pregnant animals and the conception rate.
  - Vaccinations show items due today and overdue.
  - Data Entry offers Enter Milk Production and Enter Milk Sale.
  - Each card is a projection of source records; open the detail before acting on it.
  - Which cards are visible is a Settings preference; hiding a card does not stop its calculation.
  related: [dashboard.findings, milk.yield-drop, milk.reconciliation]
  anchors:
  - {path: src/DairyOS.Web/src/components/UnifiedDashboard.tsx, text: Yield Drop Watchlist}

- id: dashboard.findings
  kind: CONCEPT
  title: Dashboard warnings (findings) and their lifecycle
  questions:
  - What does a dashboard finding mean?
  - acknowledge vs resolve warning
  - how to clear a warning
  - reinstate warning
  keywords: [finding, warning, alert, acknowledge, resolve, reinstate, audit register, bell]
  summary: Findings are warnings raised by DairyOS checks (for example missed milking, yield drop, veterinary non-milking directives, equipment). Acknowledge means someone reviewed it; Resolve means the underlying condition was fixed and needs a resolution note; an administrator can Reinstate a resolved finding with a reason.
  location: Bell icon (Active Warnings) > Open Full Audit Register (Warning Audit Register)
  facts:
  - Finding statuses are RAISED, ACKNOWLEDGED, RESOLVED and REINSTATED.
  - Acknowledging is not resolving; the finding stays active.
  - Some findings resolve automatically when the missing record is entered, such as a missed milk entry.
  - Reinstating marks the warning active again across all dashboards and records an immutable administrator override.
  - The Warning Audit Register lists every warning with its resolution and override trail.
  - A finding is a decision aid; trace it to its source record before acting.
  related: [milk.missed-session, milk.yield-drop, health.non-milking-directive]
  anchors:
  - {path: src/dairyos/api/operational_findings.py, symbol: router}
  - {path: src/DairyOS.Web/src/components/AuditTab.tsx, text: Warning Audit Register}

- id: analytics.overview
  kind: CONCEPT
  title: The Analytics tab
  questions:
  - What is in analytics?
  - analytics period
  keywords: [analytics, herd dynamics, health outcomes, breeding cycle analytics, withdrawal burden]
  summary: Analytics shows server-calculated projections for a chosen period; milk litres, Feed Cost/L, OPEX/L, COP/L, open health cases, conception rate, herd dynamics, health outcomes and breeding cycle analytics by animal, technician, semen lot and sire.
  facts:
  - When the daily TMR cost authority is incomplete for part of the period, Analytics says Feed Cost/L and COP/L are unavailable for that part rather than substituting Finance purchases or zero.
  related: [cop.estimated, breeding.analytics]
  anchors:
  - {path: src/DairyOS.Web/src/components/AnalyticsTab.tsx, text: Breeding cycle analytics}

- id: reports.catalog
  kind: CONCEPT
  title: What reports are available
  questions:
  - What reports are available?
  - where are reports
  - how to export report to excel
  keywords: [reports, reporting, export, excel, print, report catalogue]
  summary: Reporting is in System Settings > Reporting. Choose an area (Herd, Milk, Feed, Breeding, Health, Finance, Cost of Milk, Management), then a report, set the period, and Generate, Print or export to Excel.
  location: System Settings (gear) > Reporting
  facts:
  - Herd reports include Herd Register, each category list, Herd by Category, Herd Movement, Exits & Mortality, Individual Animal Passport and Animal Identification.
  - Milk reports include Daily Milk Production, Milk Production by Animal, Individual Animal Milk History, Monthly Milk Summary, Milk Utilisation, Milk Quality Log, Yield Drop Watchlist and Lactation & Production Performance.
  - Feed reports include Current TMR & Feed Cost by Category, Daily Feed Cost & Feed Cost per Litre, Feed Inventory, Feed Stock Movement and Feed Purchases.
  - Breeding reports include Breeding Status, Animals Due for AI, Pregnancy Diagnosis Due, Confirmed Pregnancies & Expected Calvings, Insemination History, Calving History, Pregnancy Losses, Repeat Breeders, AI Technician Performance, Sire Performance, Semen Lot Performance, Semen Inventory & Usage and Reproductive History by Animal.
  - Health reports include Active Health Cases, Health Cases by Period, Treatment History, Milk Withdrawal Status, Withdrawal History, Vaccination Due, Vaccination History, Health History by Animal and Clinical Inventory.
  - Finance reports include reconciliations, Monthly / Quarterly Financial Summary, Daily Financial Activity, Transaction Ledger, Receivables, Payables, Settlements, Milk Sales, Animal Sales, Semen Purchases, OPEX & Cost of Milk Reconciliation, Capital & Cash Movements and VOID Transaction History.
  - Cost of Milk reports include Cost of Milk & Component Breakdown, Monthly Cost Summary, Daily Cost of Milk and Official COML History; Management reports include Daily Farm Summary, Farm Performance Summary and Attention Report.
  - Columns can be customised, and totals and exports always cover every record, not just the visible page.
  related: [reports.reconciliation-controls, settings.email]
  anchors:
  - {path: src/dairyos/reporting/registry.py, symbol: AREAS}
  - {path: src/DairyOS.Web/src/components/ReportingTab.tsx, text: Customize Columns}

- id: reports.reconciliation-controls
  kind: CONCEPT
  title: Reconciliation controls in reports
  questions:
  - what does reconciliation controls pass mean
  keywords: [reconciliation controls, expected, actual, difference, pass]
  summary: Some reports include Reconciliation Controls that compare an expected total with the actual total and show the difference and a PASS or difference result.
  facts:
  - The OPEX & Cost of Milk Reconciliation report recalculates OPEX row by row and compares it with the COP authority; the difference should be PKR 0.00.
  related: [reports.catalog, finance.attribution]
  anchors:
  - {path: src/dairyos/finance/opex_period_attribution.py, symbol: attribute_opex_for_period}

- id: settings.operational-date
  kind: CONCEPT
  title: How DairyOS uses the operational date
  questions:
  - How does DairyOS use the operational date?
  - which day does late night milk go to
  - system date wrong
  keywords: [operational date, system date, timezone, farm day, future date]
  summary: DairyOS's operational date is the Windows computer's local date and time. It decides which day today's entries belong to, blocks future-dated milk, exits and vaccinations, and bounds COP and missed-milking checks.
  facts:
  - The default farm timezone is the operating system's; audit timestamps are stored in UTC.
  - If the Windows clock or timezone is wrong, entries land on the wrong farm day, so correct the Windows date and time.
  - Historical dates remain available where the workflow permits late entries.
  - The daily TMR cost lock and the automatic backup run on farm local time.
  related: [milk.late-entry, feed.daily-snapshot, settings.farm-profile]
  anchors:
  - {path: src/dairyos/farm/settings/services/farm_settings_service.py, symbol: FarmSettingsService.get_operational_datetime}

