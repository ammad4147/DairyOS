- id: settings.system-health
  kind: CONCEPT
  title: Read-only System Health check
  questions:
  - what does system health check do
  keywords: [system health, database check, integrity, read-only]
  summary: Run System Health Check performs read-only checks of the database, schema, persistence and projection integrity. It changes nothing; it does not reset, repair, delete or restore data.
  facts:
  - A failed check is diagnostic evidence for support, not permission to reset data.
  related: [settings.backup, support.troubleshooting]
  anchors:
  - {path: src/DairyOS.Web/src/components/SettingsTab.tsx, text: Run System Health Check}

- id: settings.backup
  kind: CONCEPT
  title: Automatic backups and farm data export/import
  questions:
  - Does DairyOS back up my data?
  - how to move dairyos to new computer
  - restore farm data
  keywords: [backup, restore, export farm data, import, archive, data protection]
  summary: DairyOS backs up the farm database automatically every farm day at 00:01 (with catch-up), verifies it, and keeps a mirror copy. Data Management can export a complete verified farm package and import one after validation.
  location: System Settings > Data Management; Farm & System > Farm Data Protection
  facts:
  - Each run creates a verified PostgreSQL backup plus a checksum-verified mirror copy.
  - The first successful run each month also creates a monthly archive.
  - DairyOS keeps up to 120 rolling backups and 60 monthly archives (five years).
  - If a second physical drive exists, DairyOS uses it automatically; otherwise protection is reported as degraded because one disk failure could lose both copies.
  - Import validates the package manifest, file hashes and PostgreSQL archive before it is enabled, and creates a rollback snapshot first.
  - Keep exported packages outside the DairyOS data folder, ideally on another device.
  related: [settings.zero-reset, settings.system-health]
  anchors:
  - {path: src/dairyos/data/database/automatic_backups.py, symbol: ROLLING_KEEP}
  - {path: src/DairyOS.Web/src/components/SettingsTab.tsx, text: Export Complete Farm Data}

- id: settings.zero-reset
  kind: CONCEPT
  title: Reset to Zero State
  questions:
  - how to delete all data and start fresh
  keywords: [reset, zero state, wipe data, delete all]
  summary: Reset to Zero State permanently removes operational farm records. It needs the administrator to unlock Navigation Visibility, type RESET DAIRYOS TO ZERO STATE, and is queued for the next DairyOS start after a verified recovery snapshot.
  facts:
  - It is not a troubleshooting step; use System Health and support first.
  related: [settings.backup, settings.navigation-visibility]
  anchors:
  - {path: src/DairyOS.Web/src/components/NavigationVisibilityControl.tsx, text: Queue Reset for Next Start}

- id: settings.navigation-visibility
  kind: CONCEPT
  title: Hiding navigation tabs and the administrator password
  questions:
  - how to hide a tab
  - forgot admin password
  - tab missing from top menu
  keywords: [hide tab, navigation visibility, administrator password, recovery code, hidden tab]
  summary: Navigation Visibility is password-protected. Hiding a tab removes only its top navigation button; the module, calculations and records keep working.
  facts:
  - The administrator password must be at least 12 characters.
  - A one-time recovery code is shown once and must be saved; recovery is accepted only on the local DairyOS computer.
  - A missing tab usually means it was hidden, not that its data is gone.
  related: [settings.zero-reset]
  anchors:
  - {path: src/DairyOS.Web/src/components/NavigationVisibilityControl.tsx, text: Navigation Visibility}

- id: settings.email
  kind: HOWTO
  title: Email notifications and the Daily Summary
  questions:
  - how to email daily report
  keywords: [email, smtp, daily summary, notification recipients, test email]
  summary: In Email & Notifications, set the DairyOS Sender (SMTP), send a test email, add notification recipients, and use Share Daily Summary to email the current Daily Summary PDF.
  facts:
  - A successful test email only proves the delivery path.
  - Sharing manually does not replace the automatic nightly summary.
  related: [reports.catalog]
