- id: support.troubleshooting
  kind: TROUBLESHOOTING
  title: When a save fails or a number looks wrong
  questions:
  - my entry did not save
  - dashboard not updating
  - number looks wrong what do i check
  keywords: [save failed, error, not updating, wrong number, stale view]
  summary: First check whether the record was actually saved (open the register or Passport), then refresh the screen. Do not re-enter the same record to make a screen change, because that creates duplicates. For a wrong total, trace the period, the source records and any voids or missing entries.
  facts:
  - Some updates reach dashboards through a durable outbox; a short delay is not a lost record.
  - Capture the exact error message, time and screen for support.
  - Never delete or manually edit the database as a first response.
  related: [settings.system-health, cop.troubleshooting]
  anchors:
  - {path: src/dairyos/api/breeding_biology.py, symbol: record_breeding_entry}

- id: assistant.about
  kind: CONCEPT
  title: What the DairyOS Assistant can and cannot do
  questions:
  - What can you do?
  - can you see my farm data
  - who are you
  keywords: [assistant, ai, help, capabilities, farm data access]
  summary: The Assistant explains how DairyOS works (screens, workflows, calculations and where data goes) and gives general dairy-farming education. It cannot see or change your farm records, so it cannot tell you today's milk, which cow is sick or any other farm figure.
  facts:
  - The Assistant runs locally on this computer in a separate process with no connection to the farm database.
  - Animal-health information is educational triage; diagnosis, medicines and doses are decisions for your veterinarian.
  - Answers show which knowledge they came from.
  related: [assistant.farm-data-boundary]
  anchors:
  - {path: src/dairyos/api/assistant.py, symbol: ask_assistant}

- id: assistant.farm-data-boundary
  kind: POLICY
  title: Finding farm figures yourself in DairyOS
  questions:
  - how much milk did we produce today
  - which cow is sick
  - show my finance records
  keywords: [farm data, today milk, which cow, records, lookup]
  summary: The Assistant has no access to your farm's records, so it cannot give farm figures or name animals. It can tell you where DairyOS shows the answer and how DairyOS calculates it.
  facts:
  - Today's milk is on the Dashboard and in the Milk tab; herd counts on the Dashboard and Animals tab; sick animals in Health (Active Sick Animals); withdrawals in Health (Animals in Milk Withdrawal); money in Finance; COP in the COP tab.
  - A single animal's status, pregnancy, treatments and milk history are in its Animal Passport (open it from the Animals tab).
  - Lists such as animals due for PD, active health cases or receivables are in System Settings > Reporting.
  - The Assistant runs in a separate process with no connection to the farm database, so it cannot look up, change or delete records.
  related: [assistant.about, dashboard.cards]
  anchors:
  - {path: src/dairyos/api/assistant.py, symbol: ask_assistant}
