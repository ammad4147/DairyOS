- id: milk.yield-drop
  kind: CALCULATION
  title: How the yield drop warning works
  questions:
  - What does the yield drop watchlist mean?
  - why is my cow on yield drop
  - yield drop critical meaning
  keywords: [yield drop, watchlist, milk decline, critical, high, drop variance]
  summary: DairyOS compares each animal's complete daily yield with its preceding comparable complete day. A decline of 10 to 20 percent raises a HIGH finding and more than 20 percent raises a CRITICAL finding.
  location: Dashboard > Yield Drop Watchlist; Reporting > Milk > Yield Drop Watchlist
  facts:
  - A decline below 10 percent raises no finding.
  - A decline from 10 through 20 percent is HIGH; above 20 percent is CRITICAL.
  - Only complete days are compared, so a missed session does not create a false drop.
  - The detail view shows the flagged date, prior 3-day average, current yield and drop variance percent, with Quick Triage to record an observation.
  - A yield drop is a signal to examine the animal, not a diagnosis.
  related: [dashboard.findings, dairy.milk.sudden-drop, health.observation]
  anchors:
  - {path: src/dairyos/farm/production/services/milk_drop_detection_service.py, symbol: detect_drop}
  - {path: src/DairyOS.Web/src/components/YieldDropAlertModal.tsx, text: Prior 3-Day Avg}

- id: milk.flow
  kind: DATA_FLOW
  title: Where milk data goes after it is recorded
  questions:
  - Where does milk go after I record it?
  - what happens to milk entry after save
  - which modules use milk production
  - where does milk record go
  keywords: [data flow, milk entry, dashboard, cop, passport, reports, analytics, reconciliation]
  summary: A saved milk entry becomes that animal's production fact for the date. From there it feeds the daily and period totals, reconciliation and saleable balance, the Dashboard, the Animal Passport, yield-drop and missed-milking checks, the COP milk denominator, Analytics and Reports.
  facts:
  - The entry settles that animal's session in the milking session ledger and is written to the event journal.
  - Daily and period totals are derived from the saved session yields.
  - The Dashboard uses it for average yield, farm yield trend, production extremes and unreconciled milk.
  - The Animal Passport shows it in Production Summary, Lactation History and Monthly Production.
  - Estimated COP uses period milk as the denominator for Feed Cost/L and OPEX/L.
  - Yield-drop detection and the missed-milking control read the same records.
  - If the animal is under withdrawal, the litres are also posted to WASTAGE so they stay out of sales.
  - Milk is not revenue by itself; revenue arises only from a Finance Milk Sale.
  related: [milk.record.session, milk.daily-total, cop.estimated, milk.saleable, finance.milk-sale, milk.yield-drop]
  anchors:
  - {path: src/dairyos/api/farm_data_entry.py, symbol: record_milk_entry}
  - {path: src/dairyos/api/tmr.py, symbol: milk_litres_for_period}
