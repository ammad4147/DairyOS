# DairyOS capability knowledge: Milk.
# Authored from repository source at 21ec0056 (see anchors). Facts are claim-sized so the
# Assistant can compose, ground and cite them individually.
collection: dairyos
domain: milk
records:
- id: milk.record.session
  kind: HOWTO
  title: Recording milk for an animal and session
  questions:
  - How do I record milk for a cow?
  - how to enter milk
  - where do i enter morning milk
  - add evening milk entry
  keywords: [milk entry, record milk, enter milk production, session, morning, evening, afternoon, litres]
  summary: Open the Milk tab, choose Enter Milk Production, select the milking animal, and enter the measured litres for the session DairyOS offers as that animal's next session. Save once.
  location: Milk tab > Enter Milk Production (also Dashboard > Data Entry > Enter Milk Production)
  steps:
  - Open Milk and choose Enter Milk Production.
  - Select the milking animal. DairyOS resolves that animal's next expected session.
  - Enter the measured litres (must be greater than zero) and save.
  facts:
  - DairyOS has three named milking sessions, MORNING, AFTERNOON and EVENING, each stored as its own yield field on the animal's record for the production date.
  - Milk cannot be recorded for a future operational date.
  - Sessions must be recorded in order; a later session is refused while an earlier expected session for that animal and day is still unsettled.
  - A session that is not in the animal's expected schedule for that date is refused as an unscheduled session.
  - Recording the same session twice for the same animal and day is refused as already settled.
  - The daily total is the sum of the session yields actually entered; an empty session is never treated as zero.
  - If the animal is under a treatment withdrawal on that date, the milk is still recorded as production but the same litres are automatically posted to WASTAGE, so they are not available for sale.
  related: [milk.session-plan, milk.missed-session, milk.withdrawal-milk, milk.daily-total, milk.flow]
  anchors:
  - {path: src/dairyos/api/farm_data_entry.py, symbol: record_milk_entry}
  - {path: src/dairyos/milk/services/milk_session_sequence_service.py, symbol: MilkSessionSequenceService.assert_can_record}
  - {path: src/DairyOS.Web/src/components/MilkTab.tsx, text: Enter Milk Production}

- id: milk.session-plan
  kind: CONCEPT
  title: Which sessions an animal is expected to have
  questions:
  - Which milking sessions should I enter for a twice daily cow?
  - why no afternoon session
  - thrice daily milking sessions
  keywords: [milking frequency, twice daily, thrice daily, expected sessions, schedule, afternoon]
  summary: The animal's milking frequency effective on that date decides which sessions are expected. TWICE_DAILY expects MORNING and EVENING; THRICE_DAILY expects MORNING, AFTERNOON and EVENING.
  location: Animal Passport > Editable Master Profile > Milking Frequency
  facts:
  - TWICE_DAILY expects the MORNING and EVENING sessions only, so a missing AFTERNOON entry for a twice-daily animal is not a gap.
  - THRICE_DAILY expects MORNING, AFTERNOON and EVENING.
  - Milking frequency is kept as dated history, so each production date is judged against the frequency that was effective on that date.
  - An explicitly entered frequency change takes precedence over the automatic initial baseline for the same date.
  - Only animals currently classified as Milking have a milking frequency; setting one on any other animal is rejected.
  related: [animals.milking-frequency, milk.record.session, milk.missed-session]
  anchors:
  - {path: src/dairyos/farm/herd/services/animal_milking_schedule_service.py, symbol: AnimalMilkingScheduleService}

- id: milk.missed-session
  kind: HOWTO
  title: What to do when a milk entry was missed
  questions:
  - What do I do if I missed the evening milk entry?
  - forgot to enter milk yesterday
  - missed milking entry warning
  - how to fill missing milk record
  keywords: [missed session, missed milking, late entry, historical entry, reject, close with reason, action required]
  summary: If the milk was taken but not entered, enter the historical quantity from Missed Milking - Action Required. If the entry cannot be recovered, reject it there with an audited reason. Never enter zero just to close the day.
  location: Milk tab > Missed Milking - Action Required > Enter Missing Milk / Reject / Close with Reason
  steps:
  - Open Milk and find the item under Missed Milking - Action Required.
  - If the quantity is known, choose Enter Missing Milk and save the historical litres for that production date and session.
  - If it cannot be recovered, choose Reject / Close with Reason and record why.
  facts:
  - DairyOS scans completed days (up to yesterday, never today) for expected sessions that have no recorded milk.
  - The scan looks back 31 days by default and at most 90 days.
  - Each gap raises a HIGH severity finding titled "Missed milking entry" for that animal and date.
  - Entering the missing milk later automatically resolves the finding.
  - Rejecting the missing entry closes it with an audited reason and it is not raised again.
  - A session declared NOT_MILKED for the whole farm counts as settled and is not reported as missed.
  - Entering zero would claim the animal was milked and produced nothing, which is a different and alarming fact.
  related: [milk.not-milked, milk.late-entry, milk.session-plan, dashboard.findings]
  anchors:
  - {path: src/dairyos/farm/production/services/missed_milking_control_service.py, symbol: MissedMilkingControlService}
  - {path: src/DairyOS.Web/src/components/MilkTab.tsx, text: Enter Missing Milk}

- id: milk.not-milked
  kind: HOWTO
  title: Declaring that a whole milking session did not happen
  questions:
  - The power failed and we could not milk this evening, what do I record?
  - session not milked
  - skip a milking for whole farm
  keywords: [not milked, skipped session, power outage, equipment failure, whole farm session]
  summary: When a whole farm milking did not happen, declare the session NOT_MILKED with a reason instead of entering zeros for every animal.
  facts:
  - A NOT_MILKED declaration settles that session for every animal on that date.
  - Allowed reasons are EQUIPMENT_FAILURE, POWER_OUTAGE, LABOUR_UNAVAILABLE, WEATHER, HERD_MOVEMENT, VETERINARY_HOLD and OTHER.
  - A reason of OTHER requires notes explaining why the milking did not happen.
  - A session cannot be declared NOT_MILKED if any animal already has milk recorded for it, or for a future date.
  - After a session is declared NOT_MILKED, milk can no longer be recorded against it.
  related: [milk.missed-session, milk.record.session]
  anchors:
  - {path: src/dairyos/api/farm_data_entry.py, symbol: declare_session_not_milked}

- id: milk.late-entry
  kind: HOWTO
  title: Entering milk after its production day
  questions:
  - Can I enter yesterday's milk today?
  - backdate milk entry
  keywords: [late entry, historical milk, backdated, production date]
  summary: Record late milk against its actual production date and session, not against today. DairyOS keys every milk fact to its production date.
  facts:
  - Entering yesterday's milk against today would overstate today, understate yesterday and leave yesterday incomplete.
  - A late entry changes past daily totals, period totals and any cost per litre calculated for that period.
  - A late entry for a missed session resolves the corresponding missed-milking finding.
  related: [milk.missed-session, milk.period-total, cop.estimated]
  anchors:
  - {path: src/dairyos/farm/production/services/missed_milking_control_service.py, symbol: MissedMilkingControlService.reconcile}

- id: milk.amendment
  kind: HOWTO
  title: Correcting a milk record
  questions:
  - I entered the wrong litres, how do I correct it?
  - edit milk record
  - change milk entry
  keywords: [correct milk, amend, edit milk, correction reason]
  summary: Correct a milk production record through its edit action with a meaningful correction reason. The original value and the reason are kept in the correction history.
  facts:
  - A correction requires a meaningful correction reason.
  - A VOID milk record cannot be edited.
  - A record cannot be corrected to a future date or to a session the animal was not expected to have.
  - At least one session yield must remain recorded after a correction; use VOID if the whole record is invalid.
  - Each correction is kept in the record's correction history with the reason.
  related: [milk.void, milk.flow]
  anchors:
  - {path: src/dairyos/api/milk_traceability.py, symbol: update_milk_production}

- id: milk.void
  kind: HOWTO
  title: Voiding a milk record
  questions:
  - How do I delete a wrong milk entry?
  - void milk production
  keywords: [void milk, delete milk, remove milk record]
  summary: Void an invalid milk record with a reason. It is excluded from all active totals but stays in the register with its reason; DairyOS does not delete it.
  facts:
  - A voided record stays visible for audit, with the reason and a snapshot of what was voided.
  - VOID records are excluded from daily totals, period totals, reconciliation and the cost of production milk denominator.
  - Milk dispositions (sales, domestic use, calf feed, wastage) can also be voided from the Milk register.
  related: [milk.amendment, finance.void]
  anchors:
  - {path: src/dairyos/api/milk_traceability.py, symbol: void_milk_production}

- id: milk.daily-total
  kind: CALCULATION
  title: How daily milk production is calculated
  questions:
  - How does DairyOS calculate today's milk production?
  - how is daily milk total worked out
  - daily milk calculation
  keywords: [daily total, total production, day complete, incomplete, compliance]
  summary: The daily total is the sum of the active session yields recorded for each animal on that production date. It is derived from the records, not typed as a dashboard figure.
  facts:
  - For each animal and date, only sessions that actually hold a value are added; empty sessions add nothing rather than zero.
  - A day is complete only when every expected session is either recorded or settled as NOT_MILKED.
  - VOID records are excluded.
  - Animals under a veterinary non-milking directive are left out of the milk population before completeness is judged.
  - Milk under treatment withdrawal still counts as production; it is removed from saleable milk by its automatic WASTAGE disposition.
  related: [milk.record.session, milk.saleable, milk.flow, milk.period-total]
  anchors:
  - {path: src/dairyos/farm/production/services/milk_daily_semantics.py, symbol: evaluate_sessions}

- id: milk.period-total
  kind: CALCULATION
  title: Milk production for a period
  questions:
  - how is monthly milk total calculated
  - milk in the period for COP
  keywords: [period total, monthly milk, milk denominator, litres in period]
  summary: Period milk is the sum of active milk production records whose production dates fall inside the selected inclusive period.
  facts:
  - The period milk total is the denominator for Feed Cost/L, OPEX/L and COP/L.
  - VOID and NOT_MILKED rows are excluded.
  - Withdrawal milk is still counted in produced litres for the cost denominator, because it is biological production.
  - A late entry adds litres to a past date and a void removes them, so a cost per litre quoted earlier for that period can change.
  - An incomplete day inside the period understates the denominator and therefore overstates cost per litre.
  related: [cop.estimated, milk.late-entry, milk.void]
  anchors:
  - {path: src/dairyos/api/tmr.py, symbol: milk_litres_for_period}

- id: milk.dispositions
  kind: HOWTO
  title: Recording where milk went (sold, domestic use, calf feed, wastage)
  questions:
  - How do I record milk given to calves?
  - enter milk for domestic use
  - record milk wastage
  - milk thrown away
  keywords: [disposition, domestic use, calves feed, wastage, unusable, sold, milk utilisation]
  summary: In Milk, use Enter Milk for Domestic Use, Enter Milk for Calves or Enter Wastage / Unusable to record where produced milk went. Milk sales are recorded in Finance as Milk Sales.
  location: Milk tab > Enter Milk for Domestic Use / Enter Milk for Calves / Enter Wastage / Unusable
  facts:
  - Governed milk dispositions are SOLD, CALF_FEED, DOMESTIC_USE, WASTAGE, OTHER and WITHDRAWAL.
  - A disposition quantity must be greater than zero.
  - Dispositions cannot exceed the saleable milk available; DairyOS treats milk as carried inventory and checks the cumulative balance through that date.
  - A Finance Milk Sale automatically creates the matching SOLD disposition in Milk.
  - Dispositions can be voided from the Milk register; the record stays for audit.
  related: [milk.saleable, milk.reconciliation, finance.milk-sale, milk.flow]
  anchors:
  - {path: src/dairyos/farm/production/services/milk_reconciliation_service.py, symbol: MilkReconciliationService.validate_disposition_quantity}
  - {path: src/DairyOS.Web/src/components/MilkTab.tsx, text: Enter Milk for Calves}

- id: milk.saleable
  kind: CALCULATION
  title: How saleable milk is determined
  questions:
  - How does DairyOS decide which milk is saleable?
  - saleable milk meaning
  - why is milk not available for sale
  keywords: [saleable milk, withdrawal milk, available balance, unbacked disposition]
  summary: Saleable milk is recorded production less milk that must not be sold, chiefly milk from animals under treatment withdrawal, which DairyOS automatically posts to WASTAGE. Sales and other dispositions are drawn from that saleable balance.
  facts:
  - Milk from an animal under treatment withdrawal is recorded as production and automatically posted to WASTAGE, so it never enters the saleable pool.
  - Ordinary dispositions (sold, domestic use, calf feed, wastage, other) cannot exceed the available saleable balance.
  - Milk is carried inventory, so a sale larger than one day's milk is validated against the cumulative saleable balance through that date.
  - The Dashboard shows Unreconciled Milk and an overall Closing Balance so undisposed milk stays visible.
  related: [milk.withdrawal-milk, milk.dispositions, milk.reconciliation]
  anchors:
  - {path: src/dairyos/farm/production/services/milk_inventory_capacity_service.py, symbol: overall_saleable_capacity}

- id: milk.withdrawal-milk
  kind: CONCEPT
  title: What happens to milk from a cow under withdrawal
  questions:
  - Can I sell milk from a treated cow?
  - what happens when I record milk of a cow in withdrawal
  - withdrawal cow milk entry
  keywords: [withdrawal, treated cow, antibiotic milk, wastage, residue, not for sale]
  summary: DairyOS still records the milk as that animal's production, but automatically posts the same litres to WASTAGE so they are not available for sale, and shows a withdrawal warning.
  facts:
  - The warning reads that withdrawal is active, the milk is recorded in total production and the animal record, and is automatically posted to WASTAGE.
  - The automatic WASTAGE disposition is created once per session quantity and is idempotent.
  - The withdrawal period comes from the treatment record (start when the treatment is recorded, end after the withdrawal days).
  - Recording the milk keeps the animal's true production history while keeping the litres out of sales and revenue.
  related: [health.withdrawal, milk.saleable, health.treatment]
  anchors:
  - {path: src/dairyos/farm/production/services/withdrawal_milk_wastage_service.py, symbol: ensure_withdrawal_wastage}
  - {path: src/dairyos/api/farm_data_entry.py, symbol: record_milk_entry}

- id: milk.reconciliation
  kind: CONCEPT
  title: Milk reconciliation and closing balance
  questions:
  - How does milk reconciliation work?
  - what is closing milk balance
  - unreconciled milk on dashboard
  keywords: [reconciliation, closing balance, opening balance, produced, sold, utilisation]
  summary: Reconciliation compares milk produced with where it went (sold, domestic use, calves feed, wastage) and carries the remaining balance forward as the closing milk balance.
  location: Milk tab > Overall Reconciliation / Closing Balance; Dashboard > Unreconciled Milk
  facts:
  - The reconciliation shows Opening Milk Balance, Milk Produced, Milk Sold, Domestic Use, Calves Feed, Wastage / Not Usable and Closing Milk Balance.
  - Dispositions may never exceed available saleable production.
  - Reconciliation is by explicit production date and can be reviewed by month.
  related: [milk.dispositions, milk.saleable, finance.milk-sale]
  anchors:
  - {path: src/dairyos/farm/production/services/milk_reconciliation_service.py, symbol: MilkReconciliationService}
  - {path: src/DairyOS.Web/src/components/MilkTab.tsx, text: Closing Milk Balance}

- id: milk.quality
  kind: HOWTO
  title: Recording milk quality (fat and SNF)
  questions:
