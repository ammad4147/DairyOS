# General dairy knowledge: reproduction. Educational; the farm's veterinarian sets reproductive protocols.
collection: dairy
domain: reproduction
records:
- id: dairy.repro.estrous-cycle
  kind: TOPIC
  title: The estrous (heat) cycle
  questions:
  - How long is a cow's heat cycle?
  - how often does a cow come on heat
  keywords: [estrous cycle, heat cycle, 21 days, oestrus, heat duration]
  summary: A cow that is not pregnant comes into heat about every 21 days (range roughly 17 to 24 days). Standing heat lasts on average about 18 hours, with a range of about 8 to 24 hours.
  facts:
  - University of Missouri Extension gives a cycle of every 17 to 24 days depending on the cow.
  - Ovulation occurs roughly 30 hours after the start of standing heat.
  - Heat stress, lameness and poor body condition reduce how strongly heat is shown.
  provenance:
  - {source: MU-G2021}
  - {source: UMD-HEAT-STRESS, section: Reproduction}
  safety: {class: EDUCATIONAL}
  related: [dairy.repro.heat-signs, dairy.repro.ai-timing]

- id: dairy.repro.heat-signs
  kind: TOPIC
  title: Signs of heat (estrus) and heat detection
  questions:
  - What are the signs of heat in a cow?
  - how to detect heat
  - cow in heat signs
  keywords: [heat signs, standing heat, mounting, mucus, restless, heat detection]
  summary: The key sign is standing to be mounted by another cow or bull. Secondary signs include mounting others, restlessness, bellowing, a swollen vulva and clear stringy mucus. Watch the herd at least twice a day, morning and evening.
  facts:
  - Secondary signs such as increased activity, vocalisation and nervousness can appear 4 to 48 hours before standing heat.
  - Long clear streams of vaginal mucus are a common secondary sign.
  - Observing at least twice daily is the minimum; more frequent observation finds more heats.
  - DairyOS does not record heat events; you record the insemination when the animal is served.
  provenance:
  - {source: MU-G2021}
  safety: {class: EDUCATIONAL}
  related: [dairy.repro.ai-timing, breeding.ai]

- id: dairy.repro.ai-timing
  kind: TOPIC
  title: When to inseminate after heat is seen (AM-PM rule)
  questions:
  - When should I inseminate a cow after heat?
  - am pm rule
  - best time for AI
  - sexed semen timing
  keywords: [ai timing, am pm rule, insemination timing, sexed semen, conventional semen]
  summary: Under the AM-PM rule, a cow seen in standing heat in the morning is inseminated that evening, and one seen in the evening is inseminated the next morning. Conventional semen is best used about 12 to 18 hours after standing heat begins; sexed semen a little later, about 18 to 24 hours.
  facts:
  - Ovulation occurs about 30 hours after the start of standing heat, which is why insemination is timed after heat onset.
  - Sexed semen has a shorter fertile life, so timing is more critical.
  - Follow the AI technician's and semen supplier's handling instructions for thawing and handling straws.
  provenance:
  - {source: MU-G2021}
  safety: {class: EDUCATIONAL}
  related: [dairy.repro.heat-signs, breeding.ai, breeding.semen]

- id: dairy.repro.vwp-principles
  kind: TOPIC
  title: The voluntary waiting period after calving
  questions:
  - Why wait before breeding after calving?
  keywords: [voluntary waiting period, uterine involution, rebreeding, calving interval]
  summary: The voluntary waiting period is the time after calving during which a farm deliberately does not breed a cow, so she can recover and return to cycling. The length is a farm and veterinary decision; DairyOS enforces 45 days.
  facts:
  - A 21-day pregnancy rate describes the share of eligible cows that become pregnant in each 21-day window, which drives the interval from calving to conception.
  - Cows with metritis, retained placenta or heavy body condition loss often have poorer fertility.
  provenance:
  - {source: MSD-METRITIS}
  - {source: PSU-BCS}
  safety: {class: EDUCATIONAL}
  related: [breeding.vwp, dairy.transition.metritis]

- id: dairy.repro.pregnancy-diagnosis
  kind: TOPIC
  title: Pregnancy diagnosis methods and timing
  questions:
  - How early can a cow be pregnancy checked?
  - pd by ultrasound how many days
  - blood pregnancy test cows
  keywords: [pregnancy diagnosis, pd, ultrasound, rectal palpation, pag test, milk progesterone, non-return]
  summary: A veterinarian can diagnose pregnancy by ultrasound or rectal palpation, typically around 35 days after insemination. Blood or milk pregnancy-associated glycoprotein (PAG) tests work from about 28 days. Not coming back into heat is only a rough early indicator.
  facts:
  - NADIS lists non-return to heat at 18 to 24 days as a poor indicator, with about 30 percent false positives at 21 days.
  - Milk progesterone at 24 days is over 95 percent accurate for identifying non-pregnant cows but gives 20 to 25 percent false positives for pregnancy.
  - Experienced ultrasound or rectal examination is over 95 percent accurate, with about 35 days as the standard timing.
  - Some early pregnancies are lost, so a positive early diagnosis may need rechecking.
  - Finding open cows early lets them be re-bred sooner.
  provenance:
  - {source: NADIS-PD}
  safety: {class: EDUCATIONAL}
  related: [breeding.pd]

- id: dairy.repro.gestation
  kind: TOPIC
  title: Gestation length in dairy cows
  questions:
  - How long is a cow pregnant?
  - gestation period cow
  - why does dairyos use 283 days
  keywords: [gestation, pregnancy length, days pregnant, 283, 279]
  summary: Gestation averages about 279 days in Holstein-Friesian cows, with normal variation of roughly 260 to 300 days; breed matters most, and zebu cattle average about 296 days. DairyOS uses a fixed 283 days from insemination as its planning rule for expected calving.
  facts:
  - The Merck Veterinary Manual states a mean of 279 days for Holstein-Friesian cattle, with a normal range of about 260 to 300 days.
  - Dairy breeds generally have shorter gestations than beef breeds, and Bos indicus (zebu) cattle average about 296 days.
  - Because DairyOS's 283 days is a planning constant, a real calving can come some days before or after the expected date; watch close-up cows accordingly.
  provenance:
  - {source: MSD-GESTATION}
  safety: {class: EDUCATIONAL}
  applicability: Breed-dependent; local cattle and buffalo differ.
  related: [breeding.expected-calving, dairy.transition.close-up]

- id: dairy.repro.repeat-breeder
  kind: TOPIC
  title: Repeat breeders and poor conception
  questions:
  - Cow not conceiving after many AI, why?
  - repeat breeder cow
  keywords: [repeat breeder, not conceiving, conception failure, infertility]
  summary: A cow that keeps returning to heat after several services needs a veterinary reproductive examination. Common contributors include uterine infection after calving, poor body condition, heat stress, poor heat detection or AI timing, and semen handling.
  facts:
  - Heat stress reduces heat expression, egg quality and embryo survival.
  - Thin cows often show weaker heats and have lower conception rates.
  - Uterine disease after calving (metritis, endometritis) reduces later fertility.
  - DairyOS Reporting has a Repeat Breeders report and AI Technician, Sire and Semen Lot Performance reports to spot patterns.
  provenance:
  - {source: UMD-HEAT-STRESS, section: Reproduction}
  - {source: PSU-BCS}
  - {source: MSD-METRITIS}
  safety: {class: TRIAGE, escalate: "Repeated failed services warrant a veterinary reproductive examination; hormonal treatments are veterinary decisions."}
  related: [breeding.analytics, dairy.repro.ai-timing]

- id: dairy.repro.abortion
  kind: TRIAGE
  title: Abortion in dairy cattle
  questions:
  - My cow aborted, what should I do?
  - cow abortion causes
  keywords: [abortion, aborted fetus, pregnancy loss, brucellosis, bvd, leptospirosis]
  summary: Isolate the cow, avoid handling the fetus and afterbirth with bare hands, keep them for the veterinarian, and call the veterinarian. Several abortions close together may indicate an infectious disease that can also affect people.
  facts:
  - Brucellosis causes contagious abortion, retained placenta and weak calves, and people can be infected through aborted material or raw milk.
  - Infectious causes such as BVD, IBR and leptospirosis can cause reproductive losses.
  - Record the loss in DairyOS as Aborted Pregnancy so the herd pattern is visible.
  provenance:
  - {source: MSD-BRUCELLOSIS}
  safety: {class: TRIAGE, escalate: "Contact the veterinarian after any abortion; suspected brucellosis must be reported to the veterinary authority. Wear gloves and do not drink raw milk from affected animals."}
  related: [breeding.pregnancy-loss, dairy.disease.brucellosis]
