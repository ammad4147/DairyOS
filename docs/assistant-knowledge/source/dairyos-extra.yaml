# DairyOS capability knowledge: additional workflows found missing by the development benchmark.
collection: dairyos
domain: finance
records:
- id: finance.feed-purchase
  kind: HOWTO
  title: Recording a feed purchase
  questions:
  - Where do I enter a feed purchase?
  - bought silage where to record
  - how to enter bhoosa or vanda purchase
  keywords: [feed purchase, buy feed, silage, vanda, wanda, bhoosa, wheat straw, khal, cake, fodder, feed expense]
  summary: Record a feed purchase in Finance with Record Expense under Feed Expenses, choosing the feed group and item (for example Corn / Maize Silage, Wheat Straw (Bhoosa) or Commercial Compound Vanda / Cattle Feed), the quantity in kg and the rate per kg.
  location: Finance tab > Record Expense > Feed Expenses
  steps:
  - Open Finance and choose Record Expense, then Feed Expenses.
  - Pick the feed group and item, enter quantity (kg), rate per kg, supplier, date and payment status.
  - Save. The item appears automatically in the Feed tab.
  facts:
  - Feed purchases entered in Finance automatically appear in the Feed tab's Feed Storage Status as Finance Purchased.
  - A new purchase in kg becomes the Finance price for that ingredient in every TMR stage.
  - Buying feed does not itself change Feed Cost/L or COP; feeding it through the TMR does.
  related: [feed.prices, feed.storage, finance.expense-category, cop.feed-price-effect]
  anchors:
  - {path: src/dairyos/api/finance_ledger.py, symbol: _ensure_feed_catalog_authority}
  - {path: src/DairyOS.Web/src/components/FinanceTab.tsx, text: Feed purchases are entered here and automatically appear in the Feed tab.}
