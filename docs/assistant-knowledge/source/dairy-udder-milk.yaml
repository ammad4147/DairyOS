# General dairy knowledge: udder health, milking and milk quality.
collection: dairy
domain: udder-milk
review: {status: VET_REVIEWED, reviewer: "Dr Umair Shaffi", date: "2026-09-22", note: "Clinical responses approved by the named veterinarian."}
records:
- id: dairy.mastitis.signs
  kind: TRIAGE
  title: Mastitis warning signs
  questions:
  - What are common mastitis warning signs?
  - how to know cow has mastitis
  - clots in milk
  - udder swollen hot
  keywords: [mastitis, clots, flakes, watery milk, swollen udder, hot quarter, udder pain]
  summary: Clinical mastitis shows as abnormal milk (clots, flakes, watery or discoloured milk) with or without a swollen, hot or painful quarter. Severe cases add fever, loss of appetite, dullness or shock.
  facts:
  - The Merck Veterinary Manual grades mild and moderate cases as local signs only, and severe cases as including systemic illness such as fever, anorexia or shock.
  - Subclinical mastitis has no visible signs and is found only by testing milk, for example with the California Mastitis Test or somatic cell count.
  - Forestripping three or four streams from each teat before milking helps find abnormal milk early.
  - Milk from a cow with abnormal milk or under treatment must be kept out of the saleable milk.
  provenance:
  - {source: MSD-MASTITIS}
  - {source: NMC-MILKING}
  safety: {class: TRIAGE, escalate: "A cow with abnormal milk plus fever, dullness, cold ears, not eating or a very swollen quarter may have severe (toxic) mastitis and needs a veterinarian urgently. Tube or injection choice and dose are veterinary decisions."}
  related: [dairy.mastitis.scc, dairy.mastitis.prevention, milk.withdrawal-milk, health.treatment]

- id: dairy.mastitis.scc
  kind: TOPIC
  title: Somatic cell count (SCC)
  questions:
  - What is somatic cell count?
  - what scc is good
  - high scc meaning
  keywords: [somatic cell count, scc, cmt, subclinical mastitis, bulk tank scc]
  summary: Somatic cell count measures white blood cells and other cells in milk and rises with udder infection. A healthy quarter is below about 100,000 cells/mL; an individual cow at 200,000 cells/mL or more is likely infected, and a herd aims to stay below 200,000 cells/mL.
  facts:
  - High SCC reduces milk yield and quality and may breach milk buyer standards.
  - The California Mastitis Test is a simple cow-side test for subclinical mastitis.
  - Heat stress is associated with higher somatic cell counts in summer.
  provenance:
  - {source: MSD-MASTITIS}
  - {source: UMD-HEAT-STRESS}
  safety: {class: EDUCATIONAL}
  applicability: Milk buyer and national limits vary; follow your buyer's contract.
  related: [dairy.mastitis.signs, dairy.mastitis.prevention]

- id: dairy.mastitis.types
  kind: TOPIC
  title: Contagious and environmental mastitis
  questions:
  - difference between contagious and environmental mastitis
  keywords: [contagious mastitis, environmental mastitis, staph aureus, strep agalactiae, e coli, klebsiella, strep uberis]
  summary: Contagious mastitis bacteria (such as Staphylococcus aureus and Streptococcus agalactiae) spread cow to cow at milking. Environmental bacteria (such as E. coli, Klebsiella and Streptococcus uberis) come from bedding, mud and manure.
  facts:
  - Contagious spread happens through milkers' hands and milking-unit liners.
  - Contaminated bedding is a primary source of environmental mastitis.
  - Milking infected cows last reduces spread to healthy cows.
  - Identifying the organism requires a milk culture arranged by the veterinarian.
  provenance:
  - {source: MSD-MASTITIS}
  - {source: NMC-MILKING}
  safety: {class: EDUCATIONAL}
  related: [dairy.mastitis.prevention, dairy.milking.routine]

- id: dairy.mastitis.prevention
  kind: TOPIC
  title: Preventing mastitis
  questions:
  - How can I prevent mastitis?
  - reduce mastitis on farm
  keywords: [mastitis prevention, teat dip, post dip, pre dip, liners, dry cow therapy, bedding, culling]
  summary: The foundations are a clean, dry environment, a consistent milking routine with teat disinfection before and after milking, well-maintained milking equipment, treating or managing infections at dry-off, and removing chronically infected cows.
  facts:
  - Post-milking teat dipping with an effective germicide is described by Merck as the most important practice.
  - Liners should be replaced regularly and vacuum levels maintained.
  - Dry cow therapy at the last milking treats existing infections and prevents new ones during the dry period.
  - Milk in order; first-lactation and low-SCC cows first, high-SCC cows next, clinical cases last.
  - Chronic cases that do not respond may be candidates for culling on veterinary advice.
  provenance:
  - {source: MSD-MASTITIS}
  - {source: NMC-MILKING}
  safety: {class: EDUCATIONAL}
  related: [dairy.milking.routine, dairy.mastitis.types]

- id: dairy.milking.routine
  kind: TOPIC
  title: A good milking routine
  questions:
  - What is the correct milking routine?
  - how to prepare cow for milking
  - pre dip post dip steps
  keywords: [milking routine, forestrip, pre-dip, post-dip, attach, let-down, teat preparation]
  summary: Forestrip three or four streams per teat, pre-dip and leave for about 30 seconds, wipe and dry each teat with an individual towel, attach the unit within 60 to 120 seconds of starting preparation, turn off vacuum before removal, then post-dip the whole teat.
  facts:
  - These steps are the National Mastitis Council's recommended milking procedures.
  - Attaching within 60 to 120 seconds of starting preparation matches the cow's milk let-down.
  - Never pour used dip back into the original container.
  - Gloves should be worn and disinfected or changed frequently.
  provenance:
  - {source: NMC-MILKING}
  safety: {class: EDUCATIONAL}
  related: [dairy.mastitis.prevention, dairy.milk-quality.cooling]

- id: dairy.milk-quality.cooling
  kind: TOPIC
  title: Cooling and storing milk on the farm
  questions:
  - How fast should milk be cooled?
  - milk cooling temperature
  - milk spoiling in tank
  keywords: [milk cooling, chiller, bulk tank, temperature, bacteria, storage]
  summary: Cool milk quickly after milking. A typical regulatory standard requires cooling to 40 F (about 4 C) or colder within two hours of milking and never letting stored milk rise above 50 F (10 C).
  facts:
  - The example standard is from Virginia's farm milk regulation; local laws and milk buyer contracts set the rule that applies to you.
  - Slow cooling lets bacteria multiply, raising bacterial counts and causing souring.
  - Chiller maintenance is recorded as an OPEX item in DairyOS Finance (Milk Chiller / Cooling Tank Maintenance).
  provenance:
  - {source: VA-MILK-COOLING}
  safety: {class: EDUCATIONAL}
  applicability: Illustrative regulatory standard; follow the local authority and your milk buyer.
  related: [dairy.milking.routine, dairy.milk-quality.components]

- id: dairy.milk-quality.components
  kind: TOPIC
  title: Milk fat and SNF
  questions:
  - What are fat and SNF in milk?
  - why is fat low in milk
  keywords: [fat, snf, solids not fat, milk components, milk price, low fat]
  summary: Fat and SNF (solids-not-fat, mainly protein, lactose and minerals) describe milk composition and often affect the price paid. A sudden herd-wide fall in milk fat is commonly linked to ration problems such as too little effective fibre, sorting or subacute ruminal acidosis.
  facts:
  - The Merck Veterinary Manual lists inadequate physically effective fibre and sorting among causes of subacute ruminal acidosis.
  - Penn State Extension notes inadequate particle size risks milk fat depression.
  - DairyOS records Fat % and SNF % per quality sample in Milk > Milk Quality.
  provenance:
  - {source: MSD-SARA}
  - {source: PSU-TMR}
  safety: {class: EDUCATIONAL}
  related: [milk.quality, dairy.nutrition.sara]

- id: dairy.milk.sudden-drop
  kind: TRIAGE
  title: Why milk suddenly dropped
  questions:
  - Milk suddenly dropped but feed is the same, why?
  - milk production down suddenly
  - herd milk drop
  keywords: [milk drop, sudden decline, production fall, yield drop, herd milk down]
  summary: First decide whether it is one cow or many. For one cow, check for illness (mastitis, lameness, fever, off feed, metabolic disease after calving). For many cows, check water supply, heat stress, feed delivery and mixing, ration changes, sorting, silage quality, milking equipment and routine, and recording errors.
  facts:
  - Heat stress reduces intake and milk, with milk loss the most immediate effect.
  - A lactating cow drinks 30 to 60 percent of her daily water shortly after milking, so interrupted water access quickly reduces milk.
  - Missing milk entries in DairyOS can look like a drop; check completeness before investigating the herd.
  - DairyOS's yield-drop warning flags an individual cow that falls 10 percent or more against her previous complete day.
  provenance:
  - {source: UMD-HEAT-STRESS}
  - {source: SDSU-WATER}
  - {source: PSU-TMR}
  safety: {class: TRIAGE, escalate: "A sick-looking cow, fever, abnormal milk or several cows affected at once needs veterinary input."}
  related: [milk.yield-drop, dairy.welfare.heat-stress, dairy.nutrition.water, milk.missed-session]

- id: dairy.lactation.curve
  kind: TOPIC
  title: The lactation curve
  questions:
  - When does a cow reach peak milk?
  - lactation curve explained
  keywords: [lactation curve, peak milk, days in milk, persistency, 305 days]
  summary: Milk rises after calving to a peak at about 40 to 70 days in milk in mature cows (70 to 100 days in first-lactation heifers), then declines gradually through late lactation until dry-off.
  facts:
  - A common rule of thumb is that each extra unit of peak milk adds about 200 units over the whole lactation.
  - First-lactation cows peak lower but hold their production more persistently.
  - Problems around calving or poor early-lactation nutrition lower the peak.
  provenance:
  - {source: UNH-LACTATION}
  safety: {class: EDUCATIONAL}
  related: [dairy.transition.overview, animals.passport]
