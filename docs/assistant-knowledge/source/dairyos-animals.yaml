  title: Correcting an animal's identity details
  questions:
  - how to change ear tag
  - wrong breed entered
  keywords: [edit animal, ear tag change, correct identity]
  summary: Edit the Passport profile. Identity labels (ear tag, RFID, breed, dates, parentage, group, location, photo) can be corrected; the permanent Animal ID never changes.
