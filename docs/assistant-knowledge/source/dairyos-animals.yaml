# DairyOS capability knowledge: Animals, herd and Passport.
collection: dairyos
domain: animals
records:
- id: animals.register
  kind: HOWTO
  title: Registering a new animal
  questions:
  - How do I add an animal?
  - register new cow
  - add calf to herd
  keywords: [register animal, add animal, new cow, animal id, ear tag, rfid]
  summary: Open Animals and register the animal with its type, category, sex, dates, identifiers and parentage. DairyOS generates the permanent Animal ID; you cannot type one.
  location: Animals tab > Register Animal (also opened after a Finance Animal Purchase)
  facts:
  - The permanent Animal ID is always generated by DairyOS as the farm prefix set in Settings, a hyphen and a sequential number, and is never reused.
  - A legacy (old) Animal ID, ear tag, RFID, breed, date of birth, date of acquisition, dam, sire, production group, location and photo can be recorded.
  - A legacy Animal ID must be unique on the farm.
  - Registering a Female or Male Calf requires the Mother / Dam ID.
  - A milking animal registered without a milking frequency defaults to TWICE_DAILY; a frequency on a non-milking animal is rejected.
  - Dam and sire references are validated against the Animal Register.
  related: [animals.categories, animals.passport, animals.calf-id, finance.animal-purchase]
  anchors:
  - {path: src/dairyos/api/animal_registration.py, symbol: register_animal}

- id: animals.calf-id
  kind: CONCEPT
  title: How a calf gets its Animal ID
  questions:
  - How does a calf receive an ID?
  - calf id after calving
  - animal id format
  keywords: [calf id, animal id, prefix, sequential, permanent id]
  summary: A calf born on the farm is created automatically when calving is recorded, with the next permanent Animal ID in the farm's series. A purchased or unregistered calf gets its ID when it is registered.
  facts:
  - Permanent IDs follow the pattern PREFIX-NNN, for example TD-001, where the prefix comes from Settings (default TD).
  - IDs are allocated sequentially under a lock so two simultaneous registrations cannot get the same ID.
  - Ear tag and RFID are separate labels; changing them does not change the permanent ID.
  related: [breeding.calving, animals.register]
  anchors:
  - {path: src/dairyos/api/animal_registration.py, symbol: _new_animal_id}
  - {path: src/dairyos/farm/settings/services/farm_settings_service.py, symbol: FarmSettingsService.get_animal_id_prefix}

- id: animals.categories
  kind: CONCEPT
  title: Herd categories and how they are determined
  questions:
  - How are herd categories determined?
  - what is the difference between heifer and dry cow in dairyos
  - herd totals calculation
  keywords: [herd category, lifecycle, milking, dry, heifer, female calf, male calf, bull, exited, close up]
  summary: DairyOS derives each animal's category from its lifecycle status and sex. Lactating is Milking, Dry is Dry, Heifer and Close-Up are Heifer, Bull is Bull, Calf is Female or Male Calf, and Sold, Culled or Deceased are Exited.
  facts:
  - The lifecycle statuses are CALF, HEIFER, CLOSE_UP, LACTATING, DRY, BULL, SOLD, CULLED and DECEASED.
  - A male cannot be LACTATING, DRY or CLOSE_UP, and a female cannot be BULL; such pairings are rejected.
  - Herd totals count active animals in the six categories Milking Cows, Dry Cows, Heifers, Female Calves, Male Calves and Bulls.
  - Exited animals leave active totals but their records and Passports remain.
  - The same active counts drive the TMR feed cost per category.
  - In DairyOS a CLOSE_UP animal is counted in the Heifer category.
  related: [animals.lifecycle, feed.tmr-cost, dashboard.cards]
  anchors:
  - {path: src/dairyos/farm/herd/services/animal_classification_service.py, symbol: AnimalClassificationService}

- id: animals.lifecycle
  kind: HOWTO
  title: Changing an animal's lifecycle status (for example dry-off)
  questions:
  - How do I mark a cow dry?
  - change animal status to close up
  - move heifer to milking
  keywords: [lifecycle change, dry off, close up, status change, milking status]
  summary: Change the life stage from the Animal Passport's editable profile (lifecycle workflow). Setting Dry, Close-Up or Heifer stops milking and clears the milking frequency; setting Lactating makes the animal Milking.
  facts:
  - The status field cannot be edited directly; it follows the lifecycle or disposition workflow.
  - Sold, culled or deceased animals cannot be returned to a live lifecycle.
  - Dry-off is recorded as a lifecycle change to DRY; DairyOS does not infer dry-off from missing milk.
  - A lifecycle change is recorded in the event journal with the previous and new status.
  related: [animals.categories, animals.dry-off, animals.exit]
  anchors:
  - {path: src/dairyos/api/animal_management/router.py, symbol: change_lifecycle}

- id: animals.dry-off
  kind: HOWTO
  title: Drying off a cow in DairyOS
  questions:
  - How do I dry off a cow?
  - record dry off
  keywords: [dry off, drying off, dry cow, stop milking]
  summary: Dry-off is recorded by changing the cow's life stage to Dry. DairyOS shows an expected dry-off date (expected calving minus 60 days) as a planning aid only.
  facts:
  - After the change the cow no longer has expected milking sessions, so no missed-milking warnings are raised for her.
  - Historical milk stays unchanged.
  - Dry cow therapy or teat sealant decisions belong to the veterinarian's udder-health plan.
  related: [breeding.expected-calving, animals.lifecycle, dairy.transition.dry-period]
  anchors:
  - {path: src/dairyos/api/animal_management/router.py, symbol: change_lifecycle}

- id: animals.milking-frequency
  kind: HOWTO
  title: Changing an animal's milking frequency
  questions:
  - how to change cow from twice to thrice milking
  keywords: [milking frequency, twice daily, thrice daily, effective date]
  summary: Change the milking frequency from the Animal Passport with an effective date and reason. DairyOS keeps it as dated history, so earlier days are still judged by their old schedule.
  facts:
  - Allowed values are TWICE_DAILY and THRICE_DAILY.
  - Only animals currently Milking can have a frequency.
  - The Dashboard shows how many animals are Twice and Thrice Milking.
  related: [milk.session-plan]
  anchors:
  - {path: src/dairyos/api/animal_management/router.py, symbol: change_milking_frequency}

- id: animals.exit
  kind: HOWTO
  title: Recording an animal's death or sale
  questions:
  - How do I record a dead cow?
  - animal died what to do in dairyos
  - remove sold animal from herd
  keywords: [death, deceased, mortality, sold, exit, cull, disposal]
  summary: Record the exit as SOLD or DECEASED with the effective date and reason (buyer and amount for a sale; cause and veterinarian for a death). A sale entered in Finance as animal sale revenue marks the animal SOLD automatically.
  facts:
  - The effective date cannot be later than the farm's operational date.
  - Exited animals become inactive, stop milking and leave herd totals, but their Passport and history are retained.
  - Reports include Exits & Mortality and Herd Movement.
  - Sudden or clustered deaths should be discussed with the veterinarian, and suspected notifiable disease reported to the veterinary authority.
  related: [finance.animal-sale, animals.categories, dairy.biosecurity.carcass]
  anchors:
  - {path: src/dairyos/api/animal_management/router.py, symbol: record_animal_disposition}

- id: animals.passport
  kind: CONCEPT
  title: The Animal Passport
  questions:
  - What does the animal passport show?
  - where can I see a cow's full history
  keywords: [passport, animal history, lineage, clinical history, reproductive history, lactation history]
  summary: The Passport is the per-animal view of everything recorded under one permanent ID; identity, production, lactations, clinical and treatment history, vaccinations, reproduction, lineage, body development and calf management.
  location: Animals tab > Open Passport (animal IDs are links across DairyOS)
  facts:
  - Sections include Identity & Registration, Production Summary, Lactation History, Monthly Production, Clinical History, Treatment History, Vaccination History, Current Reproductive Status, Reproductive History and Lineage & Pedigree.
  - Record Body Development stores weight, body condition score and the method (scale, tape, estimated or other).
  - Calf & Youngstock Management records newborn care (first colostrum with litres and Brix, navel care) and weaning (date, weight, method, starter kg/day), with a checklist marked complete or overdue.
  - Guideline targets on the calf checklist are suggestions; only the operator's recorded action becomes evidence.
  - Mutable labels such as ear tag can change; the permanent ID is the anchor.
  related: [animals.register, animals.youngstock]
  anchors:
  - {path: src/DairyOS.Web/src/components/AnimalPassportModal.tsx, text: Lineage & Pedigree}

- id: animals.youngstock
  kind: HOWTO
  title: Recording calf care and weaning
  questions:
  - Where do I record colostrum given to a calf?
  - record weaning
  - navel dipping record
  keywords: [colostrum record, navel care, weaning, calf care, brix, starter]
  summary: Open the calf's Passport, Calf & Youngstock Management. Use Record Newborn Care for first colostrum (litres and Brix) or navel care, and Record Weaning for the weaning date, weight, method and starter intake.
  facts:
  - Warnings on the calf checklist stay active until the operator records the underlying action.
  - Colostrum quality is recorded as a Brix reading.
  related: [dairy.calf.colostrum-timing, dairy.calf.weaning, animals.passport]
  anchors:
  - {path: src/dairyos/api/youngstock_management.py, symbol: router}
  - {path: src/DairyOS.Web/src/components/AnimalPassportModal.tsx, text: Record Newborn Care}

- id: animals.search
  kind: HOWTO
  title: Finding an animal
  questions:
  - how to search a cow by ear tag
  keywords: [search animal, find cow, ear tag, rfid]
  summary: Use the Animals tab search, which matches Animal ID, tag, breed, RFID and status, then open the Passport to confirm before recording anything.
  facts:
  - The herd register keeps sold and dead animals visible.
  - Recording an event against the wrong animal is one of the most expensive errors, so confirm the Passport first.
  related: [animals.passport]
  anchors:
  - {path: src/DairyOS.Web/src/components/AnimalTab.tsx, text: Open Passport}

