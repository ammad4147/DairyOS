# General dairy knowledge: calves and youngstock. Educational; farm protocols and the veterinarian take precedence.
collection: dairy
domain: calves
records:
- id: dairy.calf.colostrum-timing
  kind: TOPIC
  title: Colostrum timing for newborn calves
  questions:
  - When should a calf get colostrum?
  - how soon colostrum after birth
  - first milk for calf timing
  keywords: [colostrum, newborn calf, first feeding, hours after birth, passive transfer, antibodies]
  summary: Feed colostrum as soon as possible after birth, ideally within the first hour, because the calf's ability to absorb antibodies falls rapidly over the first 24 hours.
  facts:
  - Penn State Extension advises feeding colostrum within 1 hour of birth.
  - By 24 hours after birth the gut absorbs less than 10 percent of its original antibody absorption capacity.
  - The Merck Veterinary Manual recommends at least 3 L of high-quality colostrum within 6 hours after birth, with a second feeding at 8 to 12 hours.
  - For scours prevention Merck cites 4 L of colostrum by oesophageal feeder within the first 2 hours of life.
  - A newborn calf is born without protective antibodies and depends on colostrum for early immunity.
  provenance:
  - {source: PSU-NEWBORN-CALF, section: Colostrum timing}
  - {source: MSD-YOUNG-CALVES, section: Colostrum feeding}
  - {source: MSD-NEONATAL-DIARRHEA, section: Prevention}
  safety: {class: EDUCATIONAL}
  related: [dairy.calf.colostrum-quantity, dairy.calf.colostrum-quality, animals.youngstock]

- id: dairy.calf.colostrum-quantity
  kind: TOPIC
  title: How much colostrum a calf needs
  questions:
  - How much colostrum should a calf drink?
  - colostrum quantity litres
  keywords: [colostrum amount, litres, quarts, igg grams]
  summary: A large-breed calf needs about 4 quarts (roughly 4 L) of good colostrum in the first feeding, or 2 quarts within an hour and 2 more within 6 to 8 hours; small-breed calves about 3 quarts.
  facts:
  - Penn State Extension states calves typically need 150 to 200 grams of IgG in the first 12 hours of life.
  - Merck gives a minimum of 3 L of high-quality colostrum within 6 hours after birth.
  - Colostrum feeding can continue until calves are 3 days old.
  provenance:
  - {source: PSU-NEWBORN-CALF, section: Colostrum quantity}
  - {source: MSD-YOUNG-CALVES, section: Colostrum feeding}
  safety: {class: EDUCATIONAL}
  related: [dairy.calf.colostrum-timing, dairy.calf.colostrum-quality]

- id: dairy.calf.colostrum-quality
  kind: TOPIC
  title: Checking colostrum quality (Brix) and hygiene
  questions:
  - How do I check colostrum quality?
  - brix value colostrum good
  - colostrum storage
  keywords: [colostrum quality, brix, refractometer, igg, contamination, storage, freeze]
  summary: Good colostrum has at least 50 g/L IgG, which corresponds to a Brix reading above 22 percent. Collect it cleanly and feed or cool it quickly.
  facts:
  - A Brix refractometer reading above 22 percent indicates adequate colostrum quality.
  - Feed or cool colostrum within 30 minutes of milking and keep bacterial counts below 100,000 cfu/mL.
  - Refrigerated colostrum should be used within 24 hours; frozen colostrum keeps up to one year.
  - Adequate passive transfer is suggested by serum Brix of at least 8.4 percent or serum total protein of at least 5.5 g/dL at 24 to 48 hours.
  - DairyOS lets you record colostrum litres and Brix in the calf's Passport under Record Newborn Care.
  provenance:
  - {source: PSU-NEWBORN-CALF, section: Quality, passive transfer, hygiene}
  safety: {class: EDUCATIONAL}
  related: [dairy.calf.colostrum-timing, animals.youngstock]

- id: dairy.calf.navel-care
  kind: TOPIC
  title: Navel care in newborn calves
  questions:
  - How should I treat the calf's navel?
  - navel dipping calf
  - swollen navel calf
  keywords: [navel, umbilical, navel dip, iodine, chlorhexidine, navel ill, joint ill]
  summary: Dip the navel immediately after birth (7 percent tincture of iodine is the usual standard; 2 percent chlorhexidine is an alternative) and keep the calf on clean, dry bedding. A swollen, wet, smelly or painful navel after the first day needs veterinary attention.
  facts:
  - Signs of navel infection include swelling, foul discharge, wetness lasting beyond the first day, hardness, tenderness, fever and poor appetite.
  - Palpating the navel at 3 to 5 days of age helps catch infection early.
  - By one week of age the umbilical stump should be about thumb-sized.
  - University of Wisconsin reports that 15 to 20 percent of US dairy calves develop umbilical infections.
  provenance:
  - {source: UW-NAVEL}
  safety: {class: TRIAGE, escalate: "A hot, swollen or discharging navel, fever, or swollen joints in a calf needs prompt veterinary examination."}
  related: [animals.youngstock, dairy.calf.housing-hygiene]

- id: dairy.calf.milk-feeding
  kind: TOPIC
  title: Milk feeding for young calves
  questions:
  - How much milk should a calf get per day?
  - calf milk feeding
  keywords: [milk feeding, milk replacer, calf feeding, litres per day, feeding frequency]
  summary: Traditional systems feed a 40 to 50 kg calf slightly more than 4 L of milk or milk replacer per day, usually in two feedings, rising to three feedings in cold weather. Many farms now feed more for faster growth.
  facts:
  - Milk replacers commonly contain 20 to 25 percent protein and 15 to 20 percent fat; at least 15 percent fat is advised in cold weather.
  - Clean, fresh water should always be available in addition to milk.
  - Feeding equipment must be cleaned between feedings to limit scours.
  provenance:
  - {source: MSD-YOUNG-CALVES, section: Liquid feed, water}
  safety: {class: EDUCATIONAL}
  related: [dairy.calf.starter-water, dairy.calf.weaning]

- id: dairy.calf.starter-water
  kind: TOPIC
  title: Calf starter and water
  questions:
  - When should calves start eating starter?
  - do calves need water
  keywords: [calf starter, grain, rumen development, water, 3 days]
  summary: Offer calf starter and fresh water from about 3 days of age; starter intake develops the rumen, and water is needed for rumen fermentation.
  facts:
  - Merck recommends a starter with 18 to 20 percent crude protein on a dry-matter basis.
  - Calves may drink more than 4 L of water a day in addition to milk.
  - Plain water goes to the rumen, whereas milk bypasses it.
  provenance:
  - {source: MSD-YOUNG-CALVES, section: Starter, water}
  - {source: PSU-NEWBORN-CALF, section: Starter, water}
  safety: {class: EDUCATIONAL}
  related: [dairy.calf.weaning, dairy.calf.milk-feeding]

- id: dairy.calf.weaning
  kind: TOPIC
  title: When to wean a calf
  questions:
  - When can I wean a calf?
  - weaning age calf
  keywords: [weaning, starter intake, weaning age, gradual weaning]
  summary: Traditional systems wean at about 4 to 8 weeks, once the calf is eating starter well; wean on intake and health, not age alone, and reduce milk gradually.
  facts:
  - Penn State notes calves are typically weaned at 4 to 6 weeks when starter consumption and rumen development are adequate.
  - Calves fed higher milk volumes usually need later and more gradual weaning.
  - DairyOS records weaning date, weight, method and starter kg/day in the calf's Passport.
  provenance:
  - {source: MSD-YOUNG-CALVES, section: Weaning}
  - {source: PSU-NEWBORN-CALF, section: Weaning}
  safety: {class: EDUCATIONAL}
  related: [animals.youngstock, dairy.heifer.growth]

- id: dairy.calf.housing-hygiene
  kind: TOPIC
  title: Calf housing and hygiene
  questions:
  - How should calves be housed?
  - calf pen hygiene
  keywords: [calf housing, bedding, draughts, hygiene, maternity pen, hospital pen]
  summary: Keep newborn calves clean, dry and out of draughts, separate from older animals, with clean feeding equipment and separate maternity and hospital pens.
  facts:
  - In cold weather calves should be well bedded so their legs are covered when lying down, and protected from draughts.
  - Avoid mixing older calves with neonates, and keep maternity, calf and hospital areas separate.
  - Wash hands after handling scouring calves; some calf diarrhoea organisms infect people.
  provenance:
  - {source: MSD-YOUNG-CALVES, section: Housing}
  - {source: MSD-NEONATAL-DIARRHEA, section: Prevention}
  safety: {class: EDUCATIONAL}
  related: [dairy.calf.scours-causes, dairy.biosecurity.principles]

- id: dairy.calf.scours-causes
  kind: TOPIC
  title: What causes calf scours
  questions:
  - What causes diarrhea in calves?
  - calf scours causes
  - why do calves get loose motion
  keywords: [scours, diarrhoea, diarrhea, loose motion, e coli, rotavirus, coronavirus, cryptosporidium, salmonella]
  summary: Calf scours is not one disease. Common infectious causes differ by age; E. coli in the first days, rotavirus and coronavirus at about 5 to 15 days, Cryptosporidium in the first 2 weeks, and Salmonella from 2 to 12 weeks, often worsened by poor colostrum and hygiene.
  facts:
  - Enterotoxigenic E. coli affects calves under 3 to 5 days old and causes profuse watery diarrhoea.
  - Rotavirus is the most common viral cause and, like coronavirus, usually affects calves 5 to 15 days old.
  - Cryptosporidium parvum is among the most common infectious causes in the first 2 weeks of life.
  - Salmonella affects calves about 2 to 12 weeks old and can spread to the bloodstream.
  - The cause cannot be identified from appearance alone; laboratory testing guided by the veterinarian identifies it.
  provenance:
  - {source: MSD-NEONATAL-DIARRHEA, section: Etiology}
  safety: {class: TRIAGE, escalate: "Several scouring calves, blood in the manure, or a weak calf needs the veterinarian."}
  related: [dairy.calf.scours-triage, dairy.calf.dehydration]

- id: dairy.calf.scours-triage
  kind: TRIAGE
  title: What to watch and do when a calf has scours
  questions:
  - What should I watch in a calf with scours?
  - calf has loose motion and is dull
  - what should I look for if calf has diarrhea
  - calf diarrhea what to do
  keywords: [scours, diarrhea, calf dull, dehydration, electrolytes, suckle, weak calf]
  summary: Check how dehydrated and weak the calf is (standing, suckle reflex, sunken eyes, cold mouth), keep feeding milk, offer oral electrolytes between milk feeds and free water, isolate it, keep it warm and dry, and call the veterinarian if it cannot stand, will not suck, or is getting worse.
  facts:
  - The Merck Veterinary Manual advises that milk should not be withheld from scouring calves.
  - Oral electrolyte solutions are given between milk feedings, and plain water should be offered freely.
  - Calves that cannot stand, cannot drink voluntarily, or are about 8 percent dehydrated or more need intravenous fluids from a veterinarian.
  - Blood or mucus in the manure, fever, several affected calves, or a calf that is getting weaker are reasons for prompt veterinary attention.
  - Record the calf, age, attitude, suckle reflex, manure description, temperature if measured and what was done, so the veterinarian can see the pattern.
  provenance:
  - {source: MSD-NEONATAL-DIARRHEA, section: Treatment}
  safety: {class: TRIAGE, escalate: "A calf that is down, not sucking, cold, very dull, or has bloody diarrhoea is an emergency; call the veterinarian now. Antibiotic use is a veterinary decision."}
  related: [dairy.calf.dehydration, dairy.calf.scours-causes, health.treatment]

- id: dairy.calf.dehydration
  kind: TRIAGE
  title: Recognising dehydration in a calf
  questions:
  - How do I know if a calf is dehydrated?
  - skin tent test calf
  keywords: [dehydration, sunken eyes, skin tent, suckle reflex, standing, eye recession]
  summary: Judge dehydration from how sunken the eyes are, how long a skin pinch stays tented, the calf's demeanour and whether it can stand and suck. Under about 8 percent dehydration a standing calf can usually be given oral electrolytes; at 8 percent or more it needs intravenous fluids from a veterinarian.
  facts:
  - Oklahoma State University's guide describes 6 to 8 percent dehydration as a depressed calf with 2 to 4 mm eye recession and a skin tent lasting 1 to 3 seconds.
  - At 8 to 10 percent the eyes are recessed 4 to 6 mm and the skin tent lasts 2 to 5 seconds.
  - At 10 to 12 percent the calf may be comatose, with 6 to 8 mm eye recession and a skin tent of 5 to 10 seconds.
  - Skin tenting is checked by gently pinching the skin below the eye and watching whether the fold persists.
  - Calves in sternal or lateral recumbency respond poorly to oral fluids and need intravenous therapy.
  provenance:
  - {source: OKSTATE-DEHYDRATION}
  - {source: ILLINOIS-CALF-FLUIDS}
  - {source: MSD-NEONATAL-DIARRHEA, section: Treatment}
  safety: {class: TRIAGE, escalate: "A calf that is down, not sucking or visibly sunken-eyed needs a veterinarian immediately."}
  related: [dairy.calf.scours-triage]

- id: dairy.calf.pneumonia
  kind: TRIAGE
  title: Calf pneumonia warning signs
  questions:
  - How do I know if a calf has pneumonia?
  - calf coughing and nose running
  - calf breathing fast
  keywords: [pneumonia, respiratory, cough, nasal discharge, ear droop, fever, calf breathing]
  summary: Watch for cough, nasal or eye discharge, droopy ears or head tilt, fast or laboured breathing and fever. A simple scoring system treats a calf as a respiratory case when its signs add up to 5 or more points.
  facts:
  - In the simplified scoring system, cough scores 2, eye discharge 2, fever above 39.2 C (102.6 F) 2, abnormal breathing 2, nasal discharge 4 and ear droop or head tilt 5.
  - Respiratory disease is the single greatest cause of heifer deaths after weaning in US surveys.
  - Risk factors include poor colostrum (passive immunity) transfer, inadequate ventilation, high humidity, rapid weather changes, crowding and mixing age groups.
  - Prevention relies on good colostrum, well-ventilated housing separate from adults, avoiding crowding and age mixing, all-in/all-out groups, good nutrition and a veterinarian-designed vaccination plan.
  provenance:
  - {source: DAIREXNET-BRD-SCORE}
  - {source: MSD-CALF-PNEUMONIA}
  safety: {class: TRIAGE, escalate: "Laboured or open-mouth breathing, a calf off feed, or several calves coughing needs prompt veterinary assessment; antimicrobial choice is a veterinary decision."}
  related: [dairy.vitals.temperature, dairy.calf.housing-hygiene]

- id: dairy.heifer.growth
  kind: TOPIC
  title: Heifer growth and breeding targets
  questions:
  - When should a heifer be bred?
  - heifer breeding age and weight
  - first calving age
  keywords: [heifer, breeding age, breeding weight, mature body weight, first calving, 24 months, growth]
  summary: Breed heifers by size, not age alone; about 55 percent of mature body weight, usually at 13 to 15 months, aiming for first calving at 22 to 24 months at 85 to 90 percent of mature weight after calving.
  facts:
  - Merck gives 50 to 55 percent of mature weight at 13 to 15 months as the breeding target.
  - University of Wisconsin gives 55 percent of mature body weight and 90 percent of mature structural growth at breeding.
  - Typical daily gain ranges from about 500 g/day for smaller breeds to 800 g/day for larger breeds.
  - Undersized heifers have more calving problems and produce less milk; overfeeding that mainly fattens heifers also harms later production.
  - Weighing with a scale or tape is more reliable than visual estimates.
  provenance:
  - {source: MSD-HEIFER-FEEDING}
  - {source: UW-HEIFER-BREEDING}
  safety: {class: EDUCATIONAL}
  related: [breeding.ai, dairy.repro.heat-signs, animals.passport]
