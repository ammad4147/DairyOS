# General dairy knowledge: dry period, transition, calving and fresh cows.
collection: dairy
domain: transition
records:
- id: dairy.transition.overview
  kind: TOPIC
  title: The transition period
  questions:
  - What is the transition period in dairy cows?
  - why are fresh cows high risk
  keywords: [transition cow, transition period, fresh cow, periparturient, 3 weeks before and after calving]
  summary: The transition period is the time around calving, traditionally three weeks before to three weeks after, now often viewed as 60 days before to 30 days after. Most metabolic and infectious disease of dairy cows happens in this window.
  facts:
  - University of Minnesota Extension notes that more than 35 percent of dairy cows have at least one clinical disease event in the first 90 days in milk.
  - Key transition diseases are milk fever (hypocalcaemia), ketosis, retained placenta, metritis, displaced abomasum and mastitis.
  - Fresh cows should be observed daily during the first two weeks of lactation.
  - Feed intake falls before calving and must recover quickly afterwards; low intake drives ketosis and displaced abomasum risk.
  provenance:
  - {source: UMN-TRANSITION}
  - {source: MSD-KETOSIS, section: Risk factors}
  safety: {class: EDUCATIONAL}
  related: [dairy.transition.close-up, dairy.transition.fresh-cow-watch, dairy.transition.dry-period]

- id: dairy.transition.dry-period
  kind: TOPIC
  title: The dry period and drying off
  questions:
  - How long should the dry period be?
  - what is a dry cow
  - how to dry off a cow
  keywords: [dry period, dry cow, dry off, far-off, dry cow therapy, teat sealant]
  summary: A dry cow is a pregnant cow that has stopped being milked before her next calving. A dry period of about 45 to 65 days (commonly around 60) lets the udder regenerate; cows with no dry period produce much less in the next lactation.
  facts:
  - Alabama Extension reports that cows with no dry period produce only about 75 percent as much milk as cows given a 50 to 60 day break.
  - Both much longer and much shorter dry periods tend to reduce milk in the next lactation.
  - Abrupt dry-off is common when yield is already low; higher-yielding cows may be dried off gradually by reducing milking frequency, following the veterinarian's advice.
  - Dry cow therapy and internal teat sealants protect the udder during the dry period; which products to use is a veterinary decision.
  - Dry-off is recorded in DairyOS by changing the cow's life stage to Dry.
  provenance:
  - {source: ACES-DRY-COW}
  - {source: MSD-MASTITIS, section: Dry cow therapy}
  safety: {class: EDUCATIONAL}
  related: [animals.dry-off, dairy.transition.close-up, breeding.expected-calving]

- id: dairy.transition.close-up
  kind: TOPIC
  title: Close-up cows (the last weeks before calving)
  questions:
  - What is a close-up cow?
  - difference between dry cow and close-up cow
  - what should I watch in a close-up cow
  - close up cow management
  keywords: [close-up, close up cow, pre-calving, far-off, springer, dcad, calving pen]
  summary: A close-up cow is a dry cow in roughly the last 2 to 3 weeks before calving. Compared with a far-off dry cow she is moved to a close-up group, often fed a specific pre-calving ration, and watched closely for appetite, calving signs and early disease.
  facts:
  - Far-off dry cows are in the early part of the dry period; close-up cows are in the final 2 to 3 weeks.
  - Close-up rations often limit calcium or use a negative dietary cation-anion difference (DCAD) to reduce milk fever risk, as formulated by the nutritionist.
  - Watch for loss of appetite, isolation, abnormal manure, udder swelling or oedema, lameness and signs of calving.
  - Body condition at calving is ideally around 3.25 to 3.75 on a 5-point scale; over-conditioned cows are at greater risk of ketosis.
  - DairyOS has a Close-Up Dry TMR stage and a CLOSE_UP lifecycle status.
  provenance:
  - {source: ACES-DRY-COW, section: Close-up management}
  - {source: MSD-MILK-FEVER, section: Prevention}
  - {source: PSU-BCS}
  - {source: MSD-KETOSIS}
  safety: {class: TRIAGE, escalate: "A close-up cow that stops eating, is down, or strains without progress needs prompt veterinary attention."}
  related: [dairy.transition.calving-signs, animals.categories, feed.tmr-tool]

- id: dairy.transition.calving-signs
  kind: TOPIC
  title: Normal calving and when to help
  questions:
  - When should I help a cow calving?
  - how long should calving take
  - calving problems when to call vet
  keywords: [calving, dystocia, calving difficulty, stage 2, water bag, feet showing, pulling calf]
  summary: Once the water bag or feet appear, a normal calving is usually finished within about 70 minutes, with visible progress every 15 to 20 minutes. Examine the cow if progress stops, if only one leg or an abnormal presentation is seen, or if straining continues without progress.
  facts:
  - Ohio State Extension advises checking cows in labour at least every 2 hours.
  - For first-calf heifers, once the calf's nose and feet are outside the vulva, help finish the birth.
  - Call the veterinarian if there is no progress 30 minutes after you intervene.
  - Use clean hands and gloves, lubricant, and disinfected calving chains.
  - The afterbirth should be expelled within 24 hours of calving.
  - Record the calving in DairyOS promptly with the calf's sex so the calf is created and the dam's cycle updates.
  provenance:
  - {source: OSU-VME29-CALVING}
  safety: {class: TRIAGE, escalate: "Malpresentation, a stuck calf, or no progress after intervention needs a veterinarian immediately; do not use excessive force."}
  related: [breeding.calving, dairy.transition.retained-placenta, dairy.calf.colostrum-timing]

- id: dairy.transition.fresh-cow-watch
  kind: TRIAGE
  title: What to watch after calving (fresh cow checks)
  questions:
  - What should I watch after calving?
  - fresh cow checks
  - what to check in cow after delivery
  keywords: [fresh cow, after calving, post calving, appetite, temperature, discharge, milk]
  summary: In the first two weeks after calving check each fresh cow daily for appetite and rumen fill, attitude, temperature, manure, uterine discharge (smell and colour), udder and milk, ability to rise, and milk yield trend.
  facts:
  - Milk fever usually appears within 48 hours of calving; displaced abomasum and ketosis mostly within the first weeks; metritis within the first 2 weeks.
  - A fever above 39.5 C with a foul, watery reddish-brown discharge suggests metritis.
  - Refusing concentrate before forage, falling milk and weight loss suggest ketosis.
  - A cow that is weak, cold-eared or unable to rise soon after calving may have milk fever and needs urgent help.
  - Record abnormal findings in DairyOS Health so follow-up is visible.
  provenance:
  - {source: UMN-TRANSITION}
  - {source: MSD-MILK-FEVER}
  - {source: MSD-METRITIS}
  - {source: MSD-KETOSIS}
  - {source: MSD-DA}
  safety: {class: TRIAGE, escalate: "Down, cold, very dull, fevered or non-eating fresh cows need prompt veterinary examination."}
  related: [dairy.transition.off-feed-fresh-cow, dairy.transition.milk-fever, dairy.transition.metritis, dairy.transition.ketosis]

- id: dairy.transition.off-feed-fresh-cow
  kind: TRIAGE
  title: A fresh cow that is not eating
  questions:
  - What should I check if a fresh cow stops eating?
  - cow fresh 2 days not eating
  - cow freshened yesterday not eating much
  - cow calved 3 days ago eating poorly milk down
  keywords: [off feed, not eating, fresh cow, poor appetite, calved, milk down]
  summary: A fresh cow off feed is a warning sign, not a diagnosis. Check her temperature, attitude, rumen fill and manure, uterine discharge and smell, udder and milk, whether she can stand normally, and ask the veterinarian to examine her; common causes include milk fever, ketosis, metritis, displaced abomasum and mastitis.
  facts:
  - Cold ears, weakness or wobbling within about 3 days of calving points toward low blood calcium (milk fever), which can become an emergency.
  - Fever with a foul-smelling uterine discharge points toward metritis.
  - Refusing grain first, then forage, with falling milk points toward ketosis, which often occurs alongside displaced abomasum.
  - A displaced abomasum typically causes reduced appetite and milk; a veterinarian detects the characteristic ping.
  - Sudden severe illness with abnormal milk and fever may be toxic mastitis.
  - Several fresh cows going off feed suggests a transition or ration problem worth reviewing with the nutritionist.
  provenance:
  - {source: MSD-MILK-FEVER}
  - {source: MSD-METRITIS}
  - {source: MSD-KETOSIS}
  - {source: MSD-DA}
  - {source: MSD-MASTITIS}
  safety: {class: TRIAGE, escalate: "Call the veterinarian for any fresh cow that is off feed with fever, weakness, cold ears, a foul discharge or abnormal milk, or that is down. Medicines, calcium products and doses are veterinary decisions."}
  related: [dairy.transition.fresh-cow-watch, dairy.vitals.temperature, health.treatment]

- id: dairy.transition.milk-fever
  kind: TRIAGE
  title: Milk fever (hypocalcaemia)
  questions:
  - What is milk fever?
  - cow down after calving cold ears
  - hypocalcemia signs
  keywords: [milk fever, hypocalcaemia, hypocalcemia, parturient paresis, cow down, cold ears, calcium]
  summary: Milk fever is low blood calcium around calving. It usually appears within 48 hours of calving and progresses from excitability and trembling, to lying on the chest with cold ears and a dull expression, to lying flat and unconscious.
  facts:
  - The Merck Veterinary Manual describes stage 2 as sternal recumbency with dullness, poor appetite, dry muzzle, low body temperature, cold extremities and sometimes an S-shaped neck.
  - It is most common in high-producing cows in their third or later lactation, and Jersey and Guernsey breeds are more susceptible.
  - Subclinical hypocalcaemia has no visible signs but increases the risk of metritis and displaced abomasum.
  - Prevention relies on close-up diets such as negative DCAD rations formulated by a nutritionist.
  - Despite the name, milk fever does not cause a fever; body temperature is often low.
  provenance:
  - {source: MSD-MILK-FEVER}
  safety: {class: TRIAGE, escalate: "A cow down or wobbling after calving is an emergency; call the veterinarian. Calcium products, routes and doses must come from the veterinarian because wrong use can be fatal."}
  related: [dairy.transition.off-feed-fresh-cow, dairy.welfare.down-cow]

- id: dairy.transition.ketosis
  kind: TRIAGE
  title: Ketosis
  questions:
  - What are the signs of ketosis?
  - cow smells sweet not eating grain
  - ketosis test cows
  keywords: [ketosis, hyperketonemia, bhb, acetone, negative energy balance, fat cow]
  summary: Ketosis happens when an early-lactation cow cannot eat enough energy. It mostly occurs in the first 2 weeks (risk through about 6 weeks); the first sign is usually reduced feed intake, often refusing concentrate before forage, with falling milk and weight loss.
  facts:
  - The Merck Veterinary Manual uses a blood BHB threshold of 1.2 mmol/L for hyperketonemia; cow-side blood meters, milk and urine strips are available.
  - A minority of cases show nervous signs such as excessive licking, chewing, incoordination or aggression.
  - Cows with body condition 3.75 or more at calving are at greater risk.
  - Ketosis increases the risk of displaced abomasum, metritis, retained placenta, poor fertility and culling.
  - Prevention focuses on avoiding over-conditioning in late lactation and keeping intake up around calving.
  provenance:
  - {source: MSD-KETOSIS}
  safety: {class: TRIAGE, escalate: "Ketotic cows need veterinary assessment for the underlying cause; treatment choices and doses are veterinary decisions."}
  related: [dairy.transition.off-feed-fresh-cow, dairy.nutrition.bcs]

- id: dairy.transition.displaced-abomasum
  kind: TRIAGE
  title: Displaced abomasum (DA)
  questions:
  - What is a displaced abomasum?
  - twisted stomach cow
  keywords: [displaced abomasum, lda, rda, twisted stomach, ping]
  summary: A displaced abomasum is when the fourth stomach moves out of place, usually to the left. About 80 to 85 percent occur within the first month after calving. Signs are reduced appetite (grain refused first), lower milk, and often ketosis.
  facts:
  - A veterinarian diagnoses it by hearing a ping while tapping and listening over the abdomen.
  - Right-sided displacement or twisting (volvulus) causes complete loss of appetite and rapid deterioration and is an emergency.
  - Risk rises with low blood calcium, ketosis, other diseases around calving, low intake and low-fibre diets.
  provenance:
  - {source: MSD-DA}
  safety: {class: TRIAGE, escalate: "Suspected DA needs veterinary examination; a rapidly worsening cow may need emergency surgery."}
  related: [dairy.transition.off-feed-fresh-cow, dairy.transition.ketosis]

- id: dairy.transition.retained-placenta
  kind: TRIAGE
  title: Retained afterbirth (placenta)
  questions:
  - Cow did not drop afterbirth, what to do?
  - retained placenta
  keywords: [retained placenta, retained afterbirth, fetal membranes, cleansing]
  summary: The afterbirth normally comes away within 24 hours of calving. If it is retained, do not pull it out by force; keep the cow clean, watch her appetite and temperature, and involve the veterinarian because retained membranes raise the risk of metritis.
  facts:
  - Retained fetal membranes are a recognised risk factor for metritis.
  - Dystocia, twins, stillbirth and low blood calcium increase the risk.
  provenance:
  - {source: OSU-VME29-CALVING}
  - {source: MSD-METRITIS}
  safety: {class: TRIAGE, escalate: "Contact the veterinarian for retained afterbirth, especially with fever, foul smell or loss of appetite. Do not pull the membranes forcibly."}
  related: [dairy.transition.metritis]

- id: dairy.transition.metritis
  kind: TRIAGE
  title: Metritis (uterine infection after calving)
  questions:
  - What is metritis?
  - foul smelling discharge after calving
  keywords: [metritis, uterine infection, discharge, fever, endometritis]
  summary: Acute metritis is a uterine infection mainly in the first 2 weeks after calving, with a fetid, watery, reddish-brown discharge, fever above 39.5 C, dullness, poor appetite and falling milk.
  facts:
  - It affects roughly 10 to 25 percent of cows on many farms.
  - Risk factors include difficult calving, twins, stillbirth, retained afterbirth, male calves, first-calf heifers, low blood calcium, poor hygiene and low intake before calving.
  - Uterine disease reduces later fertility.
  provenance:
  - {source: MSD-METRITIS}
  safety: {class: TRIAGE, escalate: "A fevered, dull cow with foul discharge needs the veterinarian; antibiotic use is a veterinary decision."}
  related: [dairy.transition.retained-placenta, dairy.transition.fresh-cow-watch]
