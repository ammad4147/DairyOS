# DairyOS capability knowledge: Finance, Payroll and Cost of Production.
collection: dairyos
domain: finance
records:
- id: finance.financial-entry
  kind: HOWTO
  title: Recording revenue and expenses in Finance
  questions:
  - How do I record an expense?
  - how to add income in finance
  - where do I enter a payment
  keywords: [finance, expense, revenue, record expense, record revenue, ledger, transaction]
  summary: Use Finance > Record Revenue for income and Record Expense for costs. Choose the governed category and item, amount, date, counterparty, and whether it was paid now or is on credit.
  location: Finance tab > Record Revenue / Record Expense
  facts:
  - DairyOS keeps one unified Finance ledger; Feed, OPEX and Non-OPEX are analytical categories on expense rows, not separate ledgers.
  - INCOME and RECEIPT are revenue; EXPENSE and PAYMENT are expenses.
  - Owner Investment is a financing cash inflow and Owner Draw is a financing cash outflow; neither is revenue, farm expense, OPEX or part of Estimated COP.
  - A new transaction starts as RECORDED, PAYABLE, RECEIVABLE, PAID or RECEIVED.
  - PAYABLE and RECEIVABLE transactions require a due date.
  - Payment methods are CASH, BANK, MOBILE and CREDIT.
  related: [finance.expense-category, finance.payment-status, finance.milk-sale, finance.flow]
  anchors:
  - {path: src/dairyos/api/finance_ledger.py, symbol: create_finance_ledger_entry}
  - {path: src/DairyOS.Web/src/components/FinanceTab.tsx, text: Record Expense}

- id: finance.expense-category
  kind: CONCEPT
  title: Expense categories (Feed, OPEX, Non-OPEX)
  questions:
  - Which category should I use for this expense?
  - what are the expense categories
  - where does diesel go in finance
  keywords: [expense category, feed, opex, non-opex, taxonomy, group, item]
  summary: Every expense is entered under one of three master categories, Feed, OPEX or Non-OPEX, then a group, then a specific item. The category decides whether and how the cost can reach cost of production.
  facts:
  - Feed covers green fodder and silage, dry roughages and hay, commercial feeds and grains, protein meals and cakes, and minerals, premixes and additives.
  - OPEX has ten groups; veterinary and herd health; breeding and reproduction; labour and salaries; utilities and energy; machinery and infrastructure; dairy chemicals and hygiene; bedding, housing and waste; logistics, admin and finance; land, rent and custom services; plus Other.
  - Non-OPEX contains only Animal Purchase and Equipment Purchase.
  - Feed purchases entered in Finance automatically appear in the Feed tab and become the Finance price for that TMR ingredient.
  - On edit, the authoritative expense category is fixed; if the transaction intent was wrong, record a governed correction instead.
  related: [finance.opex, finance.attribution, feed.prices]
  anchors:
  - {path: src/dairyos/finance/expense_taxonomy.py, symbol: EXPENSE_TAXONOMIES}

- id: finance.opex
  kind: CONCEPT
  title: What counts as OPEX and why equipment purchase is excluded
  questions:
  - Why isn't equipment purchase counted in OPEX?
  - why my equipment purchase not coming in opex
  - does equipment purchase count in cop
  - is loan interest opex
  keywords: [opex, non-opex, equipment purchase, animal purchase, loan interest, capital, excluded]
  summary: Equipment Purchase, Animal Purchase and Loan Interest are classified Non-OPEX, so they never enter OPEX/L or COP. They are capital or financing costs, not the operating cost of producing this period's milk.
  facts:
  - Including an equipment purchase would load one period's cost per litre with an asset that serves many years.
  - Loan Interest is entered under the logistics, admin and finance OPEX group but is classified Non-OPEX for cost of production.
  - Other, Small Tools & Implements, Building / Yard Repairs and Taxes / Local Fees have no default classification; the operator decides OPEX or Non-OPEX per transaction.
  - Non-OPEX amounts remain in the Finance ledger and in cash totals; they are only excluded from Estimated COP.
  - Equipment bought through Finance also appears as feed-related equipment in the Feed tab when applicable.
  related: [finance.attribution, cop.estimated, finance.expense-category]
  anchors:
  - {path: src/dairyos/finance/opex_attribution.py, symbol: NON_OPEX_ITEMS}
  - {path: src/dairyos/finance/opex_attribution.py, symbol: default_cop_classification}

- id: finance.attribution
  kind: CALCULATION
  title: How expenses are attributed to a COP period
  questions:
  - How does DairyOS decide which month an expense belongs to for COP?
  - electricity bill spread over month
  - attribution method direct periodic allocated
  keywords: [attribution, direct, periodic, allocated, consumption, coverage period, service date]
  summary: Each OPEX expense uses one of four attribution rules. Direct costs land on their service date, Periodic and Allocated costs spread across their coverage dates, and Consumption applies only to semen straws, counted as straws are used.
  facts:
  - DIRECT applies to a cost tied to one dated service, such as a vet consultation, lab test or repair, and lands on its service date ("Immediate service/use").
  - PERIODIC spreads a cost pro rata across its coverage start and end, such as wages, electricity, rent, insurance and internet ("Defined coverage period").
  - ALLOCATED spreads consumables bought in bulk across an estimated consumption period, such as medicines, teat dip, bedding and fuel ("Estimated consumption period").
  - CONSUMPTION applies only to Semen Straws; cost counts when a straw is drawn for an insemination, at the lot's cost per straw.
  - Tractor Diesel & Servicing, Farm Vehicle Fuel & Maintenance and Water Pumping & Borehole Maintenance require the operator to choose the method.
  - OPEX that cannot be attributed is excluded from the estimate and flagged as awaiting attribution; it is never silently counted as zero.
  - The Finance transaction date is not the COP attribution date.
  related: [cop.estimated, finance.opex, breeding.semen]
  anchors:
  - {path: src/dairyos/finance/opex_attribution.py, symbol: attributed_amount}
  - {path: src/dairyos/finance/opex_period_attribution.py, symbol: attribute_opex_for_period}

- id: finance.payment-status
  kind: CONCEPT
  title: Payment status, receivables and payables
  questions:
  - What is the difference between payable and paid?
  - how to mark credit sale received
  - receivable meaning
  keywords: [payment status, payable, receivable, paid, received, credit, settlement, due date, ageing]
  summary: A transaction paid immediately is RECORDED/PAID/RECEIVED. Credit purchases are PAYABLE and credit sales are RECEIVABLE until settled. Settlement moves PAYABLE to PAID and RECEIVABLE to RECEIVED.
  facts:
  - PAYABLE and RECEIVABLE require a due date and appear in Finance ageing and the Receivables/Payables reports.
  - Once PAID or RECEIVED, the only remaining change is VOID.
  - There is no partial settlement; a transaction settles once and in full.
  - Owner Investment must be recorded as cash received and cannot be credit.
  related: [finance.void, reports.catalog]
  anchors:
  - {path: src/dairyos/api/finance_ledger.py, symbol: create_finance_ledger_entry}

- id: finance.void
  kind: HOWTO
  title: Voiding a finance transaction
  questions:
  - How does VOID work?
  - how to cancel wrong expense
  - delete finance entry
  keywords: [void, cancel transaction, delete expense, wrong entry, reason]
  summary: Void an invalid or duplicate transaction with a reason. It stays visible in the ledgers marked Voided but is excluded from every balance and total, including COP.
  facts:
  - VOID is available from any status, including settled ones, and requires a reason.
  - The void is stamped into the transaction's history with when it happened, what status it moved from and why.
  - VOID rows are excluded from balances, revenue, expenses, receivables, payables and Estimated COP.
  - Voiding a Finance milk sale keeps the linked Milk SOLD disposition consistent in the same transaction.
  - Reporting > Finance > VOID Transaction History lists voided rows.
  related: [finance.amendment, milk.void, finance.milk-sale]
  anchors:
  - {path: src/dairyos/api/finance_ledger.py, symbol: _append_status_transition}
  - {path: src/DairyOS.Web/src/components/FinanceTab.tsx, text: Confirm Void}

- id: finance.amendment
  kind: HOWTO
  title: Correcting a finance entry
  questions:
  - What happens when I correct a transaction?
  - edit finance entry
  keywords: [edit transaction, correct finance, amendment]
  summary: Edit the transaction from the Finance ledger. The expense category is fixed on edit; linked records such as a milk sale or semen lot are updated together or not at all.
  facts:
  - The authoritative expense category cannot be changed by editing; use a governed correction entry when the transaction intent was wrong.
  - A Finance milk sale and its Milk SOLD disposition are amended atomically so quantity, rate, amount and status cannot disagree.
  - An unsettled semen purchase and its semen lot stay identical when edited; semen purchase details are read-only once linked.
  related: [finance.void, finance.milk-sale, breeding.semen]
  anchors:
  - {path: src/dairyos/api/finance_ledger.py, symbol: _sync_existing_milk_sale_status}

- id: finance.milk-sale
  kind: HOWTO
  title: Recording a milk sale
  questions:
  - How do I record milk sold?
  - enter milk sale
  - milk sale calculation
  keywords: [milk sale, sell milk, rate per litre, milk revenue, buyer]
  summary: Record Revenue > Milk Sales with the litres and the rate per litre. DairyOS calculates the amount as quantity times rate and creates the matching SOLD disposition in Milk.
  location: Finance tab > Record Revenue > Milk Sales (also Dashboard > Enter Milk Sale)
  facts:
  - Milk Sales require a positive quantity in litres and a positive rate per litre.
  - The amount is always quantity x rate; an entered amount that conflicts is rejected.
  - A cash sale is RECEIVED; a credit sale is RECEIVABLE with a due date.
  - The sale is mirrored into the Milk disposition ledger as SOLD with sale identity FIN-{transaction number}, and the two stay synchronised on amendment and void.
  - A sale cannot exceed the available saleable milk balance.
  related: [milk.dispositions, milk.saleable, finance.payment-status]
  anchors:
  - {path: src/dairyos/api/finance_ledger.py, symbol: create_finance_ledger_entry}

- id: finance.animal-sale
  kind: HOWTO
  title: Selling an animal
  questions:
  - How do I record a cow sale?
  - sold a heifer how to enter
  keywords: [animal sale, sell cow, sold animal, bull sale, calf sale]
  summary: Record Revenue with the matching animal sale type (Milking Animal, Dry Animal, Heifer, Female Calf, Male Calf or Bull Sale) and select the Animal ID. Saving marks the animal SOLD and removes it from active herd strength.
  facts:
  - The animal's Passport and final disposal history are retained after sale.
  - If the animal sale disposition or Passport link fails, the Finance row is automatically revoked so the ledger and herd do not disagree.
  - Animal sale revenue is revenue; it is not part of COP.
  related: [animals.exit, finance.financial-entry]
  anchors:
  - {path: src/DairyOS.Web/src/components/FinanceTab.tsx, text: Select Animal ID being sold}

- id: finance.animal-purchase
  kind: HOWTO
  title: Buying an animal
  questions:
  - How do I record a purchased cow?
  - bought new cow entry
  keywords: [animal purchase, buy cow, new animal, register purchased animal]
  summary: Record Expense > Non-OPEX > Animal Purchase with its standard category, then complete the Register Animal / Passport form that DairyOS opens with that category preselected.
  facts:
  - Animal Purchase is capital (Non-OPEX) and is excluded from Estimated COP.
  - The purchase stays a Finance record while registration is pending; linking to the Passport is a separate step so a failed registration never loses the accounting row.
  related: [animals.register, finance.opex]
  anchors:
  - {path: src/dairyos/api/finance_ledger.py, symbol: link_animal_purchase}

- id: finance.payroll
  kind: HOWTO
  title: Payroll
  questions:
  - How do I pay staff salaries?
  - where is payroll
  keywords: [payroll, salary, wages, overtime, advances, deductions, staff]
  summary: Open Payroll from the wallet button on the Finance tab. Create a payroll record with worked days, base pay, overtime, allowances, advances and deductions, then Mark Paid to post it to Finance.
  location: Finance tab > Payroll (wallet icon)
  facts:
  - DairyOS shows Gross and Net pay for each payroll record.
  - Marking a payroll record paid creates one linked Finance posting in the same database transaction; it cannot be posted twice.
  - Labour costs are OPEX under labour and salaries and are attributed across the period they cover.
  related: [finance.attribution]
  anchors:
  - {path: src/DairyOS.Web/src/components/PayrollWindow.tsx, text: Mark Paid}
  - {path: src/dairyos/api/payroll.py, symbol: router}

- id: finance.running-status
  kind: CONCEPT
  title: Finance running status and ledger explorer
  questions:
  - what is net cash position
  - how to see all expenses this month
  keywords: [net cash, cash position, ledger explorer, carried forward, closing balance, operations to date]
  summary: Financial Running Status summarises Cash Revenue, Capital Added, Receivables, Payables, Total Expenses and Net Cash Position for Operations to Date, a month or a custom range. Ledger Explorer shows the full historical ledger.
  facts:
  - VOID entries remain visible in the ledgers but are excluded from balances.
  - Ledger Explorer can show combined, revenue or expense views and filter expenses by Feed, OPEX or Non-OPEX.
