- id: finance.flow
  kind: DATA_FLOW
  title: How Finance connects to other modules
  questions:
  - Where does a finance entry go?
  - how finance links to feed and breeding
  keywords: [finance flow, feed purchase, semen purchase, milk sale, cop, animal purchase]
  summary: Finance is the purchase and cash authority. Feed purchases become Feed catalog items and TMR prices, semen purchases create semen lots for Breeding, milk sales create Milk SOLD dispositions, animal sales exit the animal, and OPEX feeds Estimated COP.
  facts:
  - A Feed expense creates or reactivates the Feed catalog item and makes that ingredient Finance-priced in every TMR stage.
  - Finance feed purchases are never counted as feed cost in COP; feed cost comes from the daily TMR snapshot.
  - A Semen Straws expense creates a semen lot that Breeding draws straws from.
  - Attributed OPEX is the OPEX/L part of Estimated COP.
  related: [feed.prices, breeding.semen, finance.milk-sale, cop.estimated]
  anchors:
  - {path: src/dairyos/api/finance_ledger.py, symbol: _ensure_feed_catalog_authority}

- id: cop.estimated
  kind: CALCULATION
  title: How COP (cost of production per litre) is calculated
  questions:
  - How is COP calculated?
  - COP?
  - what is cost of production per litre
  - how is cost of milk calculated
  keywords: [cop, coml, cost of production, cost per litre, feed cost per litre, opex per litre, estimated cop]
  summary: Estimated COP/L = (TMR feed cost + attributed OPEX) divided by the milk produced in the same period. Equivalently, COP/L = Feed Cost/L + OPEX/L.
  location: COP tab > Estimated COP
  facts:
  - Feed Cost/L = total daily TMR feed cost for the period divided by period milk litres.
  - OPEX/L = Finance OPEX attributed to the period divided by the same milk litres.
  - Three authorities feed it; TMR is the feed cost authority, Finance is the OPEX authority and Milk Production is the denominator authority.
  - Non-OPEX items (Equipment Purchase, Animal Purchase, Loan Interest) and Finance feed purchases are excluded.
  - Period presets are This month, Last 30 days and Year to date, or a custom analysis period; the period is clamped to the operational date and future dates are never filled.
  - If milk is zero the result is not calculable (NO_MILK_DENOMINATOR); missing daily TMR snapshots mark it incomplete rather than substituting zero.
  - Estimated COP is a management estimate that moves when late milk, voids or corrections land in the period; it is not an accounting close.
  related: [cop.feed-cost-per-litre, finance.attribution, milk.period-total, cop.official, cop.feed-price-effect]
  anchors:
  - {path: src/dairyos/api/coml.py, symbol: get_integrated_coml}
  - {path: src/DairyOS.Web/src/components/COML.tsx, text: Estimated COP / L}

- id: cop.feed-cost-per-litre
  kind: CALCULATION
  title: Where Feed Cost/L comes from
  questions:
  - Where does feed cost per litre come from?
  - how does TMR feed cost reach COP
  - why feed per litre went high
  keywords: [feed cost per litre, feed/l, tmr cost, whole herd feed cost, daily snapshot]
  summary: Feed Cost/L comes from the TMR. Each day DairyOS prices the TMR for every animal category, multiplies by the active animal count, locks that whole-herd feed cost at 12:00, and divides the period's total by the period's milk.
  facts:
  - Feed Cost/L rises when ration quantities rise, ingredient prices rise, active animal counts rise, or milk litres fall.
  - Non-milking animals (dry cows, heifers, calves, bulls) are fed too, so their ration cost is part of the whole-herd feed cost spread over the milk.
  - A missed or incomplete milk day lowers the denominator and makes Feed Cost/L look higher.
  - Before today's 12:00 lock, today uses the live TMR as a provisional value.
  - Finance feed purchases do not change Feed Cost/L directly; only feeding (the TMR) does, although a new purchase price changes the Finance price used by the TMR.
  related: [feed.tmr-cost, feed.daily-snapshot, cop.estimated, cop.feed-price-effect]
  anchors:
  - {path: src/dairyos/api/tmr.py, symbol: tmr_feed_cost_for_period}

- id: cop.feed-price-effect
  kind: DATA_FLOW
  title: How a feed price change affects COP
  questions:
  - How does feed price affect COP?
  - how feed price affects cop
  - new feed purchase price changes cop?
  keywords: [feed price, cop, price per kg, finance price, manual price]
  summary: A feed price reaches COP through the TMR. When an ingredient is Finance-priced, the newest Finance purchase rate per kg becomes its TMR price; that changes cost per head per day, the whole-herd daily feed cost, and therefore Feed Cost/L and COP/L from the next locked day onward.
  facts:
  - Each ingredient is priced either from Finance (newest active purchase rate per kg) or from a Manual PKR/kg rate chosen in the TMR tool.
  - A new Finance feed purchase makes that ingredient Finance-priced across all TMR stages.
  - Locked past days keep the prices frozen in their snapshots; a price change does not rewrite history.
  - An ingredient with no price at all is shown as unpriced rather than costed at zero.
  related: [feed.prices, cop.feed-cost-per-litre, feed.daily-snapshot]
  anchors:
  - {path: src/dairyos/api/tmr.py, symbol: _finance_price_authority}
  - {path: src/dairyos/api/tmr.py, symbol: promote_tmr_price_source_for_finance_purchase}

- id: cop.official
  kind: HOWTO
  title: Official monthly COP (locking)
  questions:
  - How do I make COP official?
  - operator assessed cop
  - lock monthly cop
  keywords: [official cop, lock, operator-assessed, monthly cop, reminder]
  summary: On the COP tab you can make the Estimated COP/L official for a month, or enter an Operator-Assessed Feed Cost/L and OPEX/L and make that official. The official monthly record stores Feed Cost/L, OPEX/L and COP/L.
  facts:
  - Official COP/L = Feed Cost/L + OPEX/L, stored per month (month start must be the first day).
  - A monthly reminder day (1 to 28, default 1) shows the month as UPCOMING, DUE, OVERDUE or LOCKED.
  - Reporting > Cost of Milk > Official COML History lists locked months.
  related: [cop.estimated]
  anchors:
  - {path: src/dairyos/api/coml.py, symbol: lock_coml}
  - {path: src/DairyOS.Web/src/components/COML.tsx, text: Make Estimated COP / L Official}

- id: cop.daily-log
  kind: CONCEPT
  title: Daily COP log
  questions:
  - where is daily cop
  - cop log
  keywords: [daily cop log, cop history, view cop log]
  summary: View COP Log shows the daily calculation for completed operational days with milk, Feed Cost/L, Estimated OPEX/L, Estimated COP/L and status.
  facts:
  - Only completed days with recorded authority appear; DairyOS does not create zero rows for empty days.
  - Status values are CALCULATED, NO_MILK_DENOMINATOR, MISSING_TMR_AUTHORITY or INCOMPLETE_TMR_AUTHORITY.
  related: [cop.estimated]
  anchors:
  - {path: src/dairyos/api/coml.py, symbol: get_coml_period_history}

- id: cop.troubleshooting
  kind: TROUBLESHOOTING
  title: Why COP or feed cost per litre looks wrong
  questions:
  - why my cop is so high this month
  - cop unavailable why
  - milk dropped but feed same cop up
  keywords: [cop high, cop wrong, cop unavailable, feed per litre high]
  summary: Check the milk denominator first (missed or late entries), then the TMR (ration quantities, prices, unpriced ingredients, missing daily snapshots), then Finance OPEX (attribution, unresolved classification, voids).
  facts:
  - Missing milk entries shrink the denominator and inflate every per-litre figure.
  - Feed cost is a whole-herd cost, so more dry cows, heifers or calves raise Feed Cost/L even when milk is unchanged.
  - Days without a TMR snapshot make the estimate incomplete; they are reported, not replaced with zero.
  - OPEX awaiting attribution is excluded and flagged on the COP tab.
  - A large capital purchase entered as OPEX (instead of Non-OPEX) would inflate OPEX/L.
  related: [cop.estimated, milk.missed-session, feed.daily-snapshot, finance.attribution]
  anchors:
  - {path: src/dairyos/api/coml.py, symbol: _integrated_cop_status}
