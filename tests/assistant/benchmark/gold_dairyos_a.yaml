# Gold benchmark: DairyOS capability questions (part A: Milk, COP, Feed, Finance).
# Each group shares expectations; each phrasing is a separately scored question.
# required_facts: list of fact slots; each slot is a list of alternative regexes (any match satisfies the slot).
# required_records: list of slots; each slot lists acceptable record ids (any one retrieved in top 5 satisfies it).
groups:
# ---------------------------------------------------------------- Milk (40)
- gid: milk.record
  domain: milk
  intent: DAIRYOS_HOWTO
  route: DAIRYOS
  required_records: [[milk.record.session]]
  required_facts: [["enter milk production", "milk tab|open milk"], ["session|morning|evening"], ["litre|liter"]]
  phrasings:
  - {q: "How do I record milk for a cow?", style: proper}
  - {q: "how to enter milk", style: short}
  - {q: "where i put morning milk of cow", style: shorthand}
