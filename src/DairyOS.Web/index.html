<head>
    <meta charset="UTF-8" />

    <title>DairyOS Command Center</title>

  <link rel="icon" type="image/svg+xml" href="/dairyos-cow.svg">
  <link rel="manifest" href="/manifest.json">
  </head>

<body>

<div id="root"></div>

<script type="module" src="/src/main.tsx"></script>

    <script>
      // Disable legacy workers that could serve stale application/API data.
      // DairyOS remains network-only until a reviewed offline mode is enabled.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.filter(key => key.startsWith('dairyos-')).map(key => caches.delete(key)));
            }
          } catch (error) {
            console.error('[DairyOS] Could not clear legacy offline state:', error);
          }
        });
      }
    </script>
  </body>

</html>
